# =============================================================================
#  XcellHost — nginx configuration
#
#  Plesk > Domains > xcellhost.top > Apache & nginx Settings >
#  "Additional nginx directives" — paste the block below.
#  (If Plesk shows only Apache settings, use .htaccess instead.)
# =============================================================================

# Every unknown URL goes to index.html so Angular's router can handle it
location / {
    try_files $uri $uri/ /index.html;
}

# Hashed build files never change content under the same name — cache forever
location ~* \.(?:js|css|woff2?|ttf|eot)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
}

location ~* \.(?:png|jpe?g|gif|svg|webp|avif|ico|mp4|webm)$ {
    expires 30d;
    add_header Cache-Control "public";
    access_log off;
}

# index.html must never be cached, or visitors keep loading an old build
location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    expires 0;
}

gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 256;
gzip_types text/plain text/css text/xml application/javascript application/json image/svg+xml;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
