<div class="utility">
  <div class="wrap ub2">
    <a href="https://billing.zohosecure.in/portal/xcellhostcloudservicespvtltd/signin" target="_blank"
      rel="noopener noreferrer">Billing Portal</a><a href="https://supportdesk.xcellhost.cloud/portal/en/home"
      target="_blank" rel="noopener noreferrer">Support Portal</a>
    <button class="utility-mobile-toggle" type="button" aria-controls="utility-more-links"
      [attr.aria-expanded]="linksExpanded()" (click)="linksExpanded.set(!linksExpanded())">
      {{ linksExpanded() ? 'Less' : 'More links' }} <span aria-hidden="true">{{ linksExpanded() ? '−' : '+' }}</span>
    </button>
    <div id="utility-more-links" class="ub2-extra" [class.is-expanded]="linksExpanded()">
    <a
      href="https://supportdesk.xcellhost.cloud/portal/en/signin" target="_blank" rel="noopener noreferrer">Submit a
      Ticket</a><a href="https://www.microsoft.com/en-in/microsoft-365" target="_blank" rel="noopener noreferrer">Microsoft 365
      Login</a><a href="https://supportdesk.xcellhost.cloud/portal/en/kb" target="_blank"
      rel="noopener noreferrer">Knowledgebase</a><a
      href="https://assist.zoho.in/install-customer-plugin?cxp_token=abb9fe4a68f6868fd49a081392f89115d7268dfc361a9370005a494a1fde5742&amp;type=exe"
      target="_blank" rel="noopener noreferrer">Remote Assist</a><a href="https://vcloud.officeinfra.com:4085/"
      target="_blank" rel="noopener noreferrer">VPS Login</a><a href="https://cp.cloudbaba.ai/login">Cloud Login</a><a
      href="/cloud-login" target="_blank" rel="noopener noreferrer">Acronis Cyber Console</a>
    <span class="ub2-push"></span>
    <div class="ub2-tools" role="group" aria-label="Display settings">
      <a class="ub2-status" routerLink="/company/platform-status" aria-label="View platform status" title="Platform Status">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round" aria-hidden="true">
          <path d="M22 12h-4l-3 8-6-16-3 8H2" />
        </svg>
        <span class="ub2-status-dot" aria-hidden="true"></span>
      </a>
      <button class="ub2-tool ub2-theme" type="button"
        [attr.aria-label]="theme.isDark() ? 'Switch to light mode' : 'Switch to dark mode'"
        [attr.title]="theme.isDark() ? 'Light mode' : 'Dark mode'" [attr.aria-pressed]="theme.isDark()"
        (click)="theme.toggle()">
        @if (theme.isDark()) {
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4" />
          <path
            d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.66 6.34l1.41-1.41" />
        </svg>
        } @else {
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round" aria-hidden="true">
          <path d="M20.5 14.4A8.5 8.5 0 0 1 9.6 3.5 8.5 8.5 0 1 0 20.5 14.4Z" />
        </svg>
        }
      </button>
      <xh-language-picker [options]="language.options()" [selected]="language.selected()" [status]="language.status()"
        (selectLanguage)="language.choose($event)" (retry)="retryTranslation()" />
      <div class="ub2-translate notranslate" translate="no" role="group" aria-label="Google Translate">
        <div id="google_translate_element" class="google-translate-host"></div>
        @if (language.status() === 'loading') {
        <span class="ub2-translate-status" role="status">Loading languages...</span>
        } @else if (language.status() === 'error') {
        <button class="ub2-tool" type="button" (click)="retryTranslation()"
          title="Google Translate could not load. Check your connection and try again.">
          Retry Google Translate
        </button>
        }
      </div>
    </div>
    <a class="phone" [href]="site.phoneHref">Phone {{ site.phone }}</a>
    <a class="uwa" [href]="whatsappHref" target="_blank" rel="noopener" aria-label="WhatsApp XcellHost"><svg
        viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true">
        <path
          d="M17.47 14.38c-.3-.15-1.75-.86-2.02-.96-.27-.1-.47-.15-.67.15-.2.3-.77.96-.94 1.16-.17.2-.35.22-.64.08-.3-.15-1.25-.46-2.38-1.47-.88-.78-1.47-1.75-1.65-2.05-.17-.3-.02-.46.13-.6.13-.13.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.08-.15-.67-1.6-.92-2.2-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.8.37-.27.3-1.04 1.02-1.04 2.48s1.07 2.88 1.22 3.08c.15.2 2.1 3.2 5.08 4.49.71.3 1.26.49 1.69.63.71.22 1.36.19 1.87.12.57-.09 1.75-.72 2-1.41.25-.7.25-1.29.17-1.42-.07-.13-.27-.2-.57-.35zM12 2a10 10 0 00-8.6 15.05L2 22l5.07-1.33A10 10 0 1012 2zm0 18.2a8.17 8.17 0 01-4.17-1.14l-.3-.18-3.1.81.83-3.02-.2-.31A8.2 8.2 0 1112 20.2z" />
      </svg>{{ site.whatsappLabel }}</a>
    </div>
  </div>


  <div id="google_translate_element" class="google-translate-host" hidden aria-hidden="true" inert></div>

</div>
