@if (!isPortalLogin()) {
  <div class="site-progress" [style.width.%]="scrollProgress()" aria-hidden="true"></div>
  <xh-intro-splash />
  <xh-utility-bar />
  <xh-promo-bar />
  <xh-header />
}

<router-outlet />

@if (!isPortalLogin()) {
  <xh-contact-options />
  <xh-footer />
}

<!-- =====================================================================
     GLOBAL OVERLAY HOSTS

     Everything that floats above the page lives outside the router outlet so
     it survives navigation. Escape is bound once on the app host (app.ts) and
     calls OverlayService.closeTop() — overlays must not re-bind it.
     ===================================================================== -->
<xh-cart-drawer />
<xh-chatbot />
<xh-search-dialog />
<xh-callback-modal />
<xh-trial-modal />
<xh-partner-modal />
<xh-doc-modal />
@if (!isPortalLogin()) {
  <xh-whatsapp-fab />
  <xh-back-to-top />
}
