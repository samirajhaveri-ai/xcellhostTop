# =============================================================================
#  XcellHost — nginx configuration
#
#  Plesk > Domains > xcellhost.cloud > Apache & nginx Settings >
#  "Additional nginx directives" — paste the block below.
#  (If Plesk shows only Apache settings, use .htaccess instead.)
# =============================================================================

# Apply to the public domain and legacy domain virtual hosts in Plesk.
if ($host ~* "^(www\.xcellhost\.(top|cloud)|xcellhost\.top)$") {
    return 301 https://xcellhost.cloud$request_uri;
}

# Every unknown URL passes through the social-preview front controller. It
# returns the Angular index with route-specific Open Graph metadata.
location / {
    try_files $uri $uri/ /social-preview.php?$query_string;
}

location = /feeds/blog {
    rewrite ^ /feeds/blog.php last;
}

# Hashed build files never change content under the same name — cache forever
location ~* \.(?:js|css|woff2?|ttf|eot)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
}

location ~* \.(?:png|jpe?g|gif|svg|webp|avif|ico|mp4|webm)$ {
    expires 30d;
    add_header Cache-Control "public";
    access_log off;
}

# index.html must never be cached, or visitors keep loading an old build
location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    expires 0;
}

gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 256;
gzip_types text/plain text/css text/xml application/javascript application/json image/svg+xml;

add_header X-Content-Type-Options "nosniff" always;
# Zoho Billing renders only this checkout route in a portal iframe. Variables
# keep the policy attached to the original URL after the internal PHP rewrite;
# nginx omits headers whose value is an empty string.
set $x_frame_options "SAMEORIGIN";
set $checkout_frame_ancestors "";
if ($request_uri ~ ^/tally-on-cloud/checkout/?(?:\?.*)?$) {
    set $x_frame_options "";
    set $checkout_frame_ancestors "frame-ancestors 'self' https://billing.zoho.in https://billing.zohosecure.in;";
}
add_header X-Frame-Options $x_frame_options always;
add_header Content-Security-Policy $checkout_frame_ancestors always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
