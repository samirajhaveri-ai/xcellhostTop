@keyframes meEcg{to{stroke-dashoffset:0}}
.hero.lh .hero-grid.me-hg{grid-template-columns:minmax(0,.86fr) minmax(0,1.14fr);gap:36px;align-items:center}
.me-copy{position:relative;z-index:3;min-width:0}
.me-hero .lh-title{color:#fff}
.me-stage{position:relative;z-index:3;display:flex;flex-direction:column;align-items:stretch;justify-items:stretch;gap:12px;min-height:0;padding:46px 0 6px;min-width:0}
.me-stage .lh-orbit{opacity:.3}
.me-chip{max-width:270px;backdrop-filter:none!important;-webkit-backdrop-filter:none!important;background:rgba(11,19,43,.96)!important;z-index:7}
.me-chip b{display:block;font:700 12px var(--f-disp);color:#fff;white-space:nowrap}
.me-chip small{white-space:nowrap}
.me-chip.sw b,.me-chip.sw small{animation:meIn .55s var(--ease-o)}
#main .me-chO i{background:#FF8A00}
/* monitor + vertical scene rail */
.me-mon{display:grid;grid-template-columns:minmax(0,1fr) 78px;gap:10px;align-items:stretch}
.me-mon>.lh-tilt{min-width:0}
.me-win{background:var(--me-card);border-radius:18px;box-shadow:0 40px 80px -30px rgba(0,0,0,.75),0 0 0 1px rgba(255,255,255,.1);overflow:hidden;color:var(--ink);border:6px solid #16264A}
html[data-theme="dark"] .me-win{border-color:#1B2D57}
.me-wh{display:flex;align-items:center;gap:10px;padding:8px 12px;background:#0B132B;color:#cfe0ff}
html[data-theme="dark"] .me-wh{background:#050B1A}
.me-bpm{width:44px;flex-shrink:0}
.me-bpm svg{display:block;width:44px;height:14px}
.me-bpm path{fill:none;stroke:#3DD47A;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:90;stroke-dashoffset:90;animation:meBpm 1.6s linear infinite}
@keyframes meBpm{to{stroke-dashoffset:-90}}
.me-wh b{min-width:0;font:600 12px var(--f-mono);color:#fff}
.me-wh b span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me-wh b span.sw{animation:meIn .5s var(--ease-o)}
.me-live{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font:700 10px var(--f-mono);letter-spacing:.12em;color:#3DD47A;font-style:normal;flex-shrink:0}
.me-live i{width:7px;height:7px;border-radius:50%;background:#3DD47A;animation:mePulse 1.6s ease-in-out infinite}
.me-scr{position:relative;height:340px;background:var(--surface-2);overflow:hidden;touch-action:pan-y}
.me-cv{position:absolute;inset:0;width:100%;height:100%;display:block;opacity:0;transition:opacity .8s var(--ease-o)}
.me-cv.on{opacity:1}
.me-cap{position:absolute;left:10px;top:10px;display:inline-flex;align-items:center;gap:8px;background:var(--me-card);border:1px solid var(--line);border-radius:999px;padding:4px 12px 4px 4px;font:600 11.5px var(--f-disp);color:var(--ink);box-shadow:0 8px 18px -12px rgba(11,19,43,.4);max-width:calc(100% - 140px)}
.me-cap span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me-cap b{font:700 10px var(--f-mono);background:#0066FF;color:#fff;border-radius:999px;padding:3px 7px;flex-shrink:0}
.me-cap.sw span{animation:meIn .6s var(--ease-o)}
.me-smp{position:absolute;right:10px;top:12px;font:600 9.5px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);background:var(--me-card);border:1px solid var(--line);border-radius:6px;padding:3px 7px}
.me-rail{display:flex;flex-direction:column;gap:6px;min-width:0}
.me-rail button[data-k]{flex:1;display:grid;grid-template-areas:"r" "s";place-items:center;align-content:center;gap:2px;border:1px solid rgba(255,255,255,.12);background:rgba(14,26,54,.9);border-radius:12px;color:#9fb3d9;cursor:pointer;padding:6px 4px;transition:background .3s,border-color .3s,color .3s;min-height:0}
.me-rail button[data-k] svg{grid-area:r;width:30px;height:30px;transform:rotate(-90deg)}
.me-rail button[data-k] circle{fill:none;stroke:rgba(255,255,255,.12);stroke-width:3}
.me-rail button[data-k] circle.p{stroke:#FF8A00;stroke-dasharray:94.25;stroke-dashoffset:calc(94.25 * (1 - var(--p,0)));stroke-linecap:round}
.me-rail button[data-k].past circle.p{stroke:#0066FF;stroke-dashoffset:0;opacity:.6}
.me-rail button[data-k] em{grid-area:r;font:700 9.5px var(--f-mono);font-style:normal;color:inherit}
.me-rail button[data-k] span{grid-area:s;font:600 10.5px var(--f-disp);white-space:nowrap}
.me-rail button[data-k]:hover{color:#fff;border-color:rgba(255,255,255,.3)}
.me-rail button[data-k].on{background:#0066FF;border-color:#0066FF;color:#fff}
.me-rail button[data-k].on circle{stroke:rgba(255,255,255,.25)}
.me-rail button[data-k].on circle.p{stroke:#fff}
.me-pz{flex:0 0 32px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);border-radius:10px;color:#fff;display:grid;place-items:center;cursor:pointer}
.me-pz svg{width:12px;height:12px}
.me-pz .pl,.me-pz.paused .pa{display:none}
.me-pz.paused .pl{display:block}
/* vitals */
.me-vit{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.me-vc{background:rgba(14,26,54,.92);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:10px 12px 8px;color:#fff;min-width:0;box-shadow:0 20px 40px -22px rgba(0,0,0,.9)}
.me-vc small{display:block;font:600 9.5px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:#9fb3d9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me-vc b{display:block;font:800 20px var(--f-disp);color:#fff;font-variant-numeric:tabular-nums;margin:2px 0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me-vc b.bump{animation:meBump .5s var(--ease-o)}
.me-vc svg{display:block;width:100%;height:18px}
.me-vc path{fill:none;stroke:#3DD47A;stroke-width:1.6;vector-effect:non-scaling-stroke}
.me-vc.o path{stroke:#FF8A00}
/* foot: powered + audit trail */
.me-foot{display:grid;grid-template-columns:200px minmax(0,1fr);gap:10px;align-items:stretch}
.me-pw.lh-powered{position:relative;left:auto;bottom:auto;margin:0;background:#0B132B;max-width:none;min-width:0;display:flex;flex-direction:column;justify-content:center;border-radius:14px}
.me-pw.lh-powered>span{font-size:12px;line-height:1.25;align-items:center}
.me-pw em{display:block;font:500 9.5px/1.4 var(--f-mono);color:#9fb6de;font-style:normal;margin-top:4px}
.me-tile{width:24px;height:24px;border-radius:7px;background:#0066FF;color:#fff;display:grid;place-items:center;flex-shrink:0;font:800 14px/1 var(--f-disp)}
.me-log{overflow:hidden;position:relative;z-index:5;background:#0B132B;border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:10px 12px;color:#fff;box-shadow:0 24px 50px -20px rgba(0,0,0,.85);min-width:0}
.me-logh{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:7px}
.me-logh span{display:flex;align-items:center;gap:6px;font:700 9.5px var(--f-mono);letter-spacing:.1em;min-width:0}
.me-logh span b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me-logh span i{width:7px;height:7px;border-radius:50%;background:#FF8A00;flex-shrink:0;animation:meBlink 1.4s steps(1) infinite}
.me-logh em{font:500 9px var(--f-mono);color:#9fb3d9;font-style:normal}
.me-log ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px 14px;min-height:62px;align-content:start}
.me-log li{font:500 10px/1.35 var(--f-mono);color:#8a9bbd;border-left:2px solid rgba(127,176,255,.3);padding-left:7px;overflow-wrap:anywhere;min-width:0}
.me-log li b{font-weight:700;color:#7FB0FF;margin-right:5px}
.me-log li.go{color:#fff;border-left-color:#FF8A00}.me-log li.go b{color:#FFB15C}
.me-log li.ok{color:#d6e2f5;border-left-color:#3DD47A}.me-log li.ok b{color:#5FE08D}
.me-log li.bad{color:#fff;border-left-color:#FF6B5B}.me-log li.bad b{color:#FF8F82}
.me-log li.nw{animation:meIn .45s var(--ease-o) both}

/* proof + sub-nav */
.me-proof b{color:var(--ink)}
.me-sub{position:sticky;top:var(--me-hh);z-index:60;background:rgba(255,255,255,.97);border-bottom:1px solid var(--line);box-shadow:0 8px 20px -18px rgba(11,19,43,.5)}
html[data-theme="dark"] .me-sub{background:rgba(6,18,42,.95)}
.me-subt{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.me-subt::-webkit-scrollbar{display:none}
.me-subt a{position:relative;flex-shrink:0;font:600 12.5px var(--f-disp);color:var(--muted);padding:12px 12px 11px;transition:color .2s}
.me-subt a:after{content:"";position:absolute;left:12px;right:12px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:#FF8A00;transform:scaleX(0);transition:transform .3s var(--ease-o)}
.me-subt a:hover{color:var(--ink);text-decoration:none}
.me-subt a.on{color:var(--ink)}
.me-subt a.on:after{transform:scaleX(1)}

/* ---------- CHALLENGES ---------- */
.me-chg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.me-c{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:8px;overflow:hidden;transition:transform .35s var(--ease-o),border-color .3s,box-shadow .3s}
.me-c:after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:#0066FF;transform:scaleX(0);transform-origin:left;transition:transform .45s var(--ease-o)}
.me-c:hover{transform:translateY(-4px);border-color:var(--line-2);box-shadow:var(--sh-s)}
.me-c:hover:after{transform:scaleX(1)}
.me-cn{position:absolute;right:16px;top:12px;font:800 30px var(--f-disp);color:var(--line)}
.me-c i,.me-d i{width:40px;height:40px;border-radius:12px;background:#0066FF;color:#fff;display:grid;place-items:center}
.me-c i.o,.me-d i.o{background:#FF8A00}.me-c i.n,.me-d i.n{background:#0B132B}
html[data-theme="dark"] .me-c i.n,html[data-theme="dark"] .me-d i.n{background:#2C3D68}
.me-c i svg,.me-d i svg{width:19px;height:19px}
.me-c h3{margin:4px 0 0;font:700 17px var(--f-disp);color:var(--ink)}
.me-c p{margin:0;font-size:13.5px;color:var(--text);line-height:1.55;flex:1}
.me-c em{display:flex;align-items:center;gap:6px;font:700 12.5px var(--f-disp);font-style:normal;color:var(--me-ot)}
.me-c em svg{width:14px;height:14px}

/* ---------- SOLUTION STACK ---------- */
.me-wls{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.me-wls button{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 15px;font:600 13px var(--f-disp);cursor:pointer;transition:border-color .2s,background .2s,color .2s}
.me-wls button svg{width:15px;height:15px;color:#0066FF}
.me-wls button:hover{border-color:#0066FF}
.me-wls button.on{background:#0B132B;border-color:#0B132B;color:#fff}
.me-wls button.on svg{color:#FFB15C}
html[data-theme="dark"] .me-wls button.on{background:#0066FF;border-color:#0066FF}
html[data-theme="dark"] .me-wls button.on svg{color:#fff}
html[data-theme="dark"] .me-wls button svg{color:#9CC2FF}
.me-skg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.me-skc{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px}
.me-skh{display:grid;grid-template-columns:38px minmax(0,1fr);gap:0 10px;align-items:center}
.me-skh i{grid-row:span 2;width:38px;height:38px;border-radius:11px;background:#0066FF;color:#fff;display:grid;place-items:center}
.me-skh.o i{background:#FF8A00}.me-skh.n i{background:#0B132B}
html[data-theme="dark"] .me-skh.n i{background:#2C3D68}
.me-skh i svg{width:18px;height:18px}
.me-skh b{font:700 16px var(--f-disp);color:var(--ink)}
.me-skh small{font:600 10.5px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.me-skc ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.me-skc li{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);border-radius:12px;padding:9px 11px;opacity:.38;transform:scale(.985);transition:opacity .4s var(--ease-o),transform .4s var(--ease-o),border-color .3s,background .3s}
.me-skc li svg{width:16px;height:16px;color:#0066FF;flex-shrink:0;margin-top:2px}
html[data-theme="dark"] .me-skc li svg{color:#9CC2FF}
.me-skc li span{font-size:12.5px;color:var(--muted);line-height:1.4}
.me-skc li b{display:block;font:700 13px var(--f-disp);color:var(--ink)}
.me-skc li.on{opacity:1;transform:none;border-color:#0066FF;background:var(--me-bs)}

/* ---------- ARCHITECTURE ---------- */
.me-arw{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:18px;align-items:start}
.me-arm{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.8fr) minmax(0,1.1fr);gap:48px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--sh-s)}
.me-arcv{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.me-col{position:relative;z-index:1;display:flex;flex-direction:column;gap:9px;justify-content:center;min-width:0}
.me-col.dc{border:2px solid #0B132B;border-radius:16px;padding:10px;background:var(--me-card)}
html[data-theme="dark"] .me-col.dc{border-color:#2C3D68}
.me-cl{display:flex;align-items:center;gap:6px;font:700 10.5px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.me-cl svg{width:14px;height:14px;color:#FF8A00}
.me-ab{display:flex;align-items:center;gap:7px;border:1.5px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:11px;padding:9px 11px;font:600 12.5px var(--f-disp);cursor:pointer;text-align:left;transition:border-color .2s,background .2s,transform .2s var(--ease-o);min-width:0}
.me-ab svg{width:15px;height:15px;color:#0066FF;flex-shrink:0}
html[data-theme="dark"] .me-ab svg{color:#9CC2FF}
.me-ab:hover{border-color:#0066FF;transform:translateY(-1px)}
.me-ab.o{border-color:#FF8A00;background:rgba(255,138,0,.07)}
.me-ab.z.n{border-left:4px solid #0B132B}
html[data-theme="dark"] .me-ab.z.n{border-left-color:#8DB8FF}
.me-ab.z.dr{border-style:dashed;border-color:#FF8A00}
.me-ab.on{border-color:#0066FF;background:#0066FF;color:#fff}
.me-ab.on svg{color:#fff}
.me-ard{position:sticky;top:calc(var(--me-hh) + 60px);background:#0B132B;color:#fff;border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:10px;box-shadow:0 30px 60px -30px rgba(11,19,43,.8)}
html[data-theme="dark"] .me-ard{background:#0E1A36;border:1px solid var(--line)}
.me-ard .me-k{color:#FFB15C}
.me-ard h3{margin:0;font:700 20px var(--f-disp);color:#fff}
.me-ard h3.sw,.me-ard p.sw{animation:meIn .45s var(--ease-o)}
.me-ard p{margin:0;font-size:13.5px;color:#c9d6ee;line-height:1.6}
.me-arl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.me-arl li{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:#e3ebfa;background:rgba(255,255,255,.06);border-radius:10px;padding:8px 10px;line-height:1.45;animation:meIn .4s var(--ease-o) both}
.me-arl li svg{width:14px;height:14px;color:#FFB15C;flex-shrink:0;margin-top:2px}
.me-arx{font:700 13px var(--f-disp);color:#FFB15C}
.me-arx:hover{text-decoration:none;color:#fff}

/* ---------- REGULATORY MAP (card rows) ---------- */
.me-rf{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.me-rf button{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 14px;font:600 13px var(--f-disp);cursor:pointer;transition:border-color .2s,background .2s}
.me-rf button em{font:700 10.5px var(--f-mono);font-style:normal;color:var(--muted);background:var(--surface-2);border-radius:999px;padding:1px 7px}
.me-rf button:hover{border-color:#0066FF}
.me-rf button.on{background:#0066FF;border-color:#0066FF;color:#fff}
.me-rf button.on em{background:rgba(255,255,255,.2);color:#fff}
.me-rmg{display:flex;flex-direction:column;gap:8px}
.me-rmg:before{content:"Requirement · How XcellHost helps · Evidence you get";display:block;font:700 10.5px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:0 4px 2px}
.me-r{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1.2fr) minmax(0,.75fr);gap:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;transition:border-color .3s,transform .3s var(--ease-o),opacity .5s var(--ease-o)}
.me-r:hover{border-color:#0066FF}
.me-r>div{padding:14px 16px;min-width:0}
.me-rq b{display:block;font:700 14px var(--f-disp);color:var(--ink);margin-top:6px}
.me-rq small{display:block;font:500 11.5px/1.45 var(--f-body);color:var(--muted);margin-top:3px}
.me-rh{background:var(--me-bs);font-size:13px;color:var(--ink);line-height:1.55;border-left:3px solid #0066FF}
.me-re{font-size:12.5px;color:var(--text);line-height:1.5;display:flex;align-items:center}
.me-r.hid{display:none}
.me-rmg.pre .me-r{opacity:0;transform:translateY(8px)}
.me-rb{display:inline-block;white-space:nowrap;font:800 10px var(--f-mono);letter-spacing:.08em;color:#fff;background:#0066FF;border-radius:999px;padding:3px 9px}
.me-rb.n{background:#0B132B}.me-rb.o{background:#FF8A00}
html[data-theme="dark"] .me-rb.n{background:#2C3D68}

/* ---------- SEGMENTS ---------- */
.me-sgw{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.6fr);gap:16px;align-items:stretch}
.me-sgt{display:flex;flex-direction:column;gap:8px}
.me-sgt button{display:flex;align-items:center;gap:12px;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;cursor:pointer;transition:border-color .2s,background .2s,transform .25s var(--ease-o)}
.me-sgt button i{width:36px;height:36px;border-radius:10px;background:var(--chip);color:#0066FF;display:grid;place-items:center;flex-shrink:0}
html[data-theme="dark"] .me-sgt button i{color:#9CC2FF}
.me-sgt button i svg{width:18px;height:18px}
.me-sgt button span{font:700 14px var(--f-disp);color:var(--ink);min-width:0}
.me-sgt button small{display:block;font:500 11.5px var(--f-body);color:var(--muted)}
.me-sgt button:hover{transform:translateX(4px);border-color:var(--line-2)}
.me-sgt button.on{background:#0B132B;border-color:#0B132B}
.me-sgt button.on span{color:#fff}.me-sgt button.on small{color:#FFB15C}
.me-sgt button.on i{background:#FF8A00;color:#fff}
html[data-theme="dark"] .me-sgt button.on{background:#0066FF;border-color:#0066FF}
html[data-theme="dark"] .me-sgt button.on small{color:#fff}
.me-sgp{background:var(--surface);border:2px solid #0066FF;border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:16px}
.me-sgh h3{margin:6px 0 6px;font:700 21px var(--f-disp);color:var(--ink)}
.me-sgh p{margin:0;font-size:14px;color:var(--text);line-height:1.6}
.me-sgl{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.me-sgl ul{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:7px}
.me-sgl li{display:flex;gap:9px;align-items:flex-start;font-size:13px;color:var(--text);line-height:1.45;animation:meIn .4s var(--ease-o) both}
.me-sgl li svg{width:15px;height:15px;color:#0066FF;flex-shrink:0;margin-top:2px}
html[data-theme="dark"] .me-sgl li svg{color:#9CC2FF}
.me-sgp .btn{align-self:flex-start;margin-top:auto}

/* ---------- USE CASES · patient journey ---------- */
.me-jr{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px}
.me-jl{position:absolute;left:44px;right:44px;top:56px;height:4px;border-radius:2px;background:var(--line)}
.me-jt{position:absolute;top:-6px;left:0;width:16px;height:16px;border-radius:50%;background:#FF8A00;box-shadow:0 0 0 5px rgba(255,138,0,.22);transform:translateX(-50%);transition:left .9s var(--ease-o)}
.me-js{position:relative;list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.me-js button{width:100%;display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;cursor:pointer;padding:0 2px;text-align:center}
.me-js i{width:44px;height:44px;border-radius:50%;background:var(--surface);border:2px solid var(--line-2);color:var(--muted);display:grid;place-items:center;transition:background .3s,border-color .3s,color .3s,transform .3s var(--ease-o)}
.me-js i svg{width:19px;height:19px}
.me-js b{font:700 13px var(--f-disp);color:var(--ink)}
.me-js small{font:500 11px var(--f-body);color:var(--muted)}
.me-js li.done i{border-color:#0066FF;color:#0066FF}
html[data-theme="dark"] .me-js li.done i{color:#9CC2FF}
.me-js li.on i{background:#0066FF;border-color:#0066FF;color:#fff;transform:scale(1.1)}
.me-js button:hover i{border-color:#0066FF}
.me-jd{margin-top:20px;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;background:var(--surface-2);border-radius:16px;padding:18px}
.me-jd h3{margin:6px 0;font:700 19px var(--f-disp);color:var(--ink)}
.me-jd h3.sw,.me-jd p.sw{animation:meIn .45s var(--ease-o)}
.me-jd p{margin:0;font-size:13.5px;color:var(--text);line-height:1.6}
.me-jd ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.me-jd li{display:flex;gap:9px;align-items:flex-start;font-size:13px;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;line-height:1.45;animation:meIn .4s var(--ease-o) both}
.me-jd li svg{width:15px;height:15px;color:#FF8A00;flex-shrink:0;margin-top:2px}
.me-jd li a{color:#0066FF;font-weight:600}
html[data-theme="dark"] .me-jd li a{color:#9CC2FF}

/* ---------- DELIVERY ---------- */
.me-dlw{display:grid;grid-template-columns:260px minmax(0,1fr);gap:28px;align-items:center}
.me-ring{position:relative;width:260px;height:260px}
.me-ring svg{width:100%;height:100%;display:block}
.me-ring circle.t{fill:none;stroke:var(--line);stroke-width:14}
.me-ring circle.v{fill:none;stroke:#0066FF;stroke-width:14;stroke-linecap:round;stroke-dasharray:110 544;transform-origin:130px 130px;animation:meSpin 6s linear infinite}
.me-rt{transform-origin:130px 130px;animation:meSpin 6s linear infinite reverse}
.me-rt circle{fill:#FF8A00}
@keyframes meSpin{to{transform:rotate(360deg)}}
.me-rc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.me-rc b{font:800 40px var(--f-disp);color:var(--ink);line-height:1}
.me-rc span{font:700 13px var(--f-disp);color:var(--ink);margin-top:4px}
.me-rc small{font:600 10.5px var(--f-mono);color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.me-dlg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.me-d{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:7px;transition:transform .35s var(--ease-o),border-color .3s}
.me-d:hover{transform:translateY(-4px);border-color:#0066FF}
.me-d b{font:700 15px var(--f-disp);color:var(--ink)}
.me-d p{margin:0;font-size:13px;color:var(--text);line-height:1.55}

/* ---------- PLANS ---------- */
.me-plg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:stretch}
.me-plc{position:relative;background:var(--surface);border:1.5px solid var(--line);border-radius:20px;padding:24px 22px;display:flex;flex-direction:column;gap:10px;transition:transform .35s var(--ease-o),box-shadow .35s,border-color .3s}
.me-plc:hover{transform:translateY(-6px);box-shadow:var(--sh)}
.me-plc.pop{background:#0B132B;border-color:#0B132B;box-shadow:0 30px 60px -34px rgba(11,19,43,.8)}
html[data-theme="dark"] .me-plc.pop{background:#0E1A36;border-color:#0066FF}
.me-plc.pop h3,.me-plc.pop .me-pr b{color:#fff}
.me-plc.pop .me-pr small{color:#9fb3d9}
.me-plc.pop li{color:#c9d6ee}
.me-plc.pop li svg{color:#FFB15C}
.me-plc.pop .me-pt{color:#FFB15C}
.me-flag{position:absolute;top:-12px;right:18px;background:#FF8A00;color:#fff;font:700 10.5px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;border-radius:999px;padding:5px 11px}
.me-pt{font:700 10.5px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--me-ot)}
.me-plc h3{margin:0;font:700 20px var(--f-disp);color:var(--ink)}
.me-pr{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.me-pr b{font:800 32px var(--f-disp);color:var(--ink);letter-spacing:-.01em}
.me-pr small{font-size:12.5px;color:var(--muted)}
.me-plc ul{list-style:none;margin:6px 0 10px;padding:0;display:flex;flex-direction:column;gap:8px;flex:1}
.me-plc li{display:flex;gap:9px;align-items:flex-start;font-size:13.5px;color:var(--text);line-height:1.4}
.me-plc li svg{width:16px;height:16px;color:#0066FF;flex-shrink:0;margin-top:1px}
html[data-theme="dark"] .me-plc li svg{color:#9CC2FF}
.me-plc .btn{justify-content:center}
.me-svc{margin-top:18px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.me-svc div{background:var(--surface);border:1px dashed var(--line-2);border-radius:14px;padding:12px 14px}
.me-svc b{display:block;font:800 17px var(--f-disp);color:var(--ink)}
.me-svc span{font-size:12.5px;color:var(--text);line-height:1.45}

/* ---------- CONFIGURATOR ---------- */
.me-cfw{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px;align-items:start}
.me-cfw>*{min-width:0}
.me-cfi{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px;display:flex;flex-direction:column;gap:18px}
.me-cf2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.me-cf2>*,.me-cf3>*{min-width:0}
.me-cf3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.me-cf3[hidden],.fld[hidden]{display:none}
.me-cfi .seg{flex-wrap:wrap}
.me-drn{display:block;margin-top:6px;font:500 12px var(--f-mono);color:var(--muted)}
.me-adds{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.me-adds label{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;transition:border-color .2s,background .2s;min-width:0}
.me-adds label:hover{border-color:var(--line-2)}
.me-adds label.ck{border-color:#0066FF;background:var(--me-bs)}
.me-adds input[type=checkbox]{width:17px;height:17px;accent-color:#0066FF;flex-shrink:0}
.me-ab2{flex:1;min-width:0}
.me-ab2 b{display:flex;align-items:center;gap:7px;font:600 13px var(--f-disp);color:var(--ink)}
.me-ab2 b svg{width:15px;height:15px;color:#0066FF;flex-shrink:0}
html[data-theme="dark"] .me-ab2 b svg{color:#9CC2FF}
.me-ab2 small{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}
.me-cfo{position:sticky;top:calc(var(--me-hh) + 60px)}
.me-cfs{background:#0B132B;color:#fff;border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:10px;box-shadow:0 30px 60px -30px rgba(11,19,43,.8)}
html[data-theme="dark"] .me-cfs{background:#0E1A36;border:1px solid var(--line)}
.me-cfk{font:700 10.5px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:#FFB15C}
.me-cfs h3{margin:0;font:700 19px var(--f-disp);color:#fff}
.me-cfl{list-style:none;margin:0;padding:10px 0 0;display:flex;flex-direction:column;gap:6px;border-top:1px solid rgba(255,255,255,.12)}
.me-cfl li{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:#c9d6ee;animation:meIn .35s var(--ease-o)}
.me-cfl li span{min-width:0}
.me-cfl li b{color:#fff;font-weight:600;white-space:nowrap}
.me-cfl li.q b{color:#FFB15C}
.me-cft{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
.me-cft div{background:rgba(255,255,255,.06);border-radius:10px;padding:9px 11px}
.me-cft span{display:block;font:600 10px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:#9fb3d9}
.me-cft b{font:800 17px var(--f-disp);color:#fff}
.me-cfr{display:flex;justify-content:space-between;font-size:13px;color:#c9d6ee}
.me-cfr b{color:#fff;font-variant-numeric:tabular-nums}
.me-cfr.t{border-top:1px solid rgba(255,255,255,.14);padding-top:10px;font-weight:700;color:#fff}
.me-cfr.t b{font:800 24px var(--f-disp);color:#fff}
.me-cfr.t b.bump{animation:meBump .5s var(--ease-o)}
.me-cfb{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.me-cfb .btn{justify-content:center}
.me-cff{font-size:11px;color:#9fb3d9;line-height:1.5}
.me-num{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;font:600 14px var(--f-body);background:var(--surface);color:var(--ink)}
.me-num:focus{outline:none;border-color:#0066FF}
select.me-num{appearance:auto;cursor:pointer}

/* ---------- READINESS ---------- */
.me-rdw,.me-pcw{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:20px;align-items:start}
.me-rdw>*,.me-pcw>*{min-width:0}
.me-rdi,.me-pci{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:14px}
.me-fw{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.me-fw li{display:grid;grid-template-columns:76px minmax(0,1fr);gap:10px;align-items:start;font-size:12.5px;color:var(--text);line-height:1.45;background:var(--surface-2);border-radius:10px;padding:8px 10px;animation:meIn .4s var(--ease-o) both}
.me-fw li .me-rb{justify-self:start}
.me-fw li b{color:var(--ink);font-weight:700}
.me-fw li.na{opacity:.65}
.me-gq{display:flex;flex-direction:column;gap:6px}
.me-q{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:9px 12px;animation:meIn .4s var(--ease-o) both}
.me-q span{font-size:13px;color:var(--ink);line-height:1.4}
.me-q span small{display:block;font:500 10.5px var(--f-mono);color:var(--muted);margin-top:2px}
.me-yn{display:flex;gap:4px}
.me-yn button{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:5px 11px;font:700 12px var(--f-disp);cursor:pointer;min-width:44px}
.me-yn button.on[data-a="1"]{background:#16a34a;border-color:#16a34a;color:#fff}
.me-yn button.on[data-a="0"]{background:#c0392b;border-color:#c0392b;color:#fff}
.me-rdo,.me-pco{position:sticky;top:calc(var(--me-hh) + 60px);background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--sh)}
.me-gauge{position:relative;width:210px;max-width:100%;align-self:center}
.me-gauge svg{width:100%;display:block}
.me-gauge path{fill:none;stroke-width:14;stroke-linecap:round}
.me-gauge .t{stroke:var(--surface-2)}
.me-gauge .v{stroke:#0066FF;stroke-dasharray:263.9;stroke-dashoffset:263.9;transition:stroke-dashoffset .7s var(--ease-o),stroke .3s}
.me-gauge b{position:absolute;left:0;right:0;bottom:22px;text-align:center;font:800 30px var(--f-disp);color:var(--ink)}
.me-gauge small{position:absolute;left:0;right:0;bottom:2px;text-align:center;font:600 11px var(--f-mono);color:var(--muted)}
.me-gaps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.me-gaps li{display:flex;gap:9px;align-items:flex-start;font-size:12.5px;color:var(--text);background:var(--surface-2);border-radius:10px;padding:8px 10px;line-height:1.45;animation:meIn .4s var(--ease-o) both}
.me-gaps li i{flex-shrink:0;width:22px;height:22px;border-radius:6px;background:#c0392b;color:#fff;display:grid;place-items:center}
.me-gaps li.ok i{background:#16a34a}
.me-gaps li i svg{width:12px;height:12px}
.me-gaps li b{color:var(--ink)}
.me-rdf{display:flex;gap:8px;flex-wrap:wrap;border-top:1px dashed var(--line);padding-top:12px}
.me-rdf .btn{white-space:normal;text-align:center}

/* ---------- PACS CALCULATOR ---------- */
.me-mt{display:flex;flex-direction:column;gap:6px}
.me-mh,.me-mr{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:center}
.me-mh span{font:700 10px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.me-mr b{display:flex;align-items:center;gap:7px;font:700 13px var(--f-disp);color:var(--ink);min-width:0}
.me-mr b svg{width:15px;height:15px;color:#0066FF;flex-shrink:0}
html[data-theme="dark"] .me-mr b svg{color:#9CC2FF}
.me-mr .me-num{padding:7px 10px;font-size:13.5px}
.me-pci label b,.me-pci .fld label b{float:right;font:800 13px var(--f-mono);color:#0066FF}
html[data-theme="dark"] .me-pci label b{color:#9CC2FF}
.me-sw{position:relative;display:grid;grid-template-columns:42px minmax(0,1fr);gap:0 10px;align-items:center;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer}
.me-sw input{position:absolute;opacity:0;pointer-events:none}
.me-sw span{grid-row:span 2;width:40px;height:22px;border-radius:11px;background:var(--line-2);position:relative;transition:background .25s}
.me-sw span:after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .25s var(--ease-o)}
.me-sw input:checked+span{background:#0066FF}
.me-sw input:checked+span:after{transform:translateX(18px)}
.me-sw input:focus-visible+span{outline:2px solid #FF8A00;outline-offset:2px}
.me-sw b{font:600 13px var(--f-disp);color:var(--ink);float:none!important}
.me-sw small{font-size:11.5px;color:var(--muted)}
.me-tv{background:#0B132B;border-radius:14px;padding:14px 16px;color:#fff}
html[data-theme="dark"] .me-tv{background:#0066FF}
.me-tv small{display:block;font:600 10px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:#9fb3d9}
html[data-theme="dark"] .me-tv small{color:#dce8ff}
.me-tv b{display:block;font:800 28px/1.15 var(--f-disp);font-variant-numeric:tabular-nums;margin:4px 0 2px}
.me-tv b.bump{animation:meBump .5s var(--ease-o)}
.me-tv span{font-size:12.5px;color:#c9d6ee}
html[data-theme="dark"] .me-tv span{color:#eef4ff}
.me-yb{display:flex;gap:6px;align-items:flex-end;height:150px;padding:6px 2px 18px;border-bottom:1px solid var(--line);position:relative}
.me-yb div{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;position:relative}
.me-yb div i{display:block;width:100%;background:#0066FF;border-radius:5px 5px 0 0;transition:height .7s var(--ease-o);min-height:1px}
.me-yb div i.h{background:#FF8A00;border-radius:0}
.me-yb div span{position:absolute;left:0;right:0;bottom:-17px;text-align:center;font:600 10px var(--f-mono);color:var(--muted)}
.me-yb div em{position:absolute;left:-6px;right:-6px;text-align:center;font:700 9.5px var(--f-mono);font-style:normal;color:var(--ink);transform:translateY(-14px);transition:bottom .7s var(--ease-o)}
.me-lg{display:flex;gap:14px;flex-wrap:wrap;font:600 11.5px var(--f-disp);color:var(--muted)}
.me-lg span{display:inline-flex;align-items:center;gap:6px}
.me-lg i{width:10px;height:10px;border-radius:3px;background:#0066FF}
.me-lg .o i{background:#FF8A00}
.me-tb{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
.me-tb li{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--text);border-bottom:1px dashed var(--line);padding-bottom:5px}
.me-tb li b{color:var(--ink);font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.me-tb li.t{font-weight:700}
.me-esf{border:1px dashed var(--line-2);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.me-esf b{font:700 10.5px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink)}
.me-esf code{font:500 11.5px/1.45 var(--f-mono);color:var(--text);white-space:normal;word-break:break-word;background:none;padding:0}
.me-pco .btn{align-self:flex-start;white-space:normal;max-width:100%;text-align:center}
.me-pco .me-fine,.me-rdo .me-fine{margin:0}

/* ---------- VS rows ---------- */
.me-vsr{display:flex;flex-direction:column;gap:8px}
.me-vh,.me-v{display:grid;grid-template-columns:minmax(0,1.1fr) repeat(3,minmax(0,1fr));gap:10px;align-items:center}
.me-vh span{font:700 10.5px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:0 14px}
.me-vh span.hl{color:#0066FF}
html[data-theme="dark"] .me-vh span.hl{color:#8DB8FF}
.me-v{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px;transition:border-color .3s,transform .3s var(--ease-o)}
.me-v:hover{border-color:#0066FF;transform:translateY(-2px)}
.me-v b{display:flex;align-items:center;gap:7px;font:700 13.5px var(--f-disp);color:var(--ink);padding:8px}
.me-v b svg{width:15px;height:15px;color:#0066FF;flex-shrink:0}
html[data-theme="dark"] .me-v b svg{color:#9CC2FF}
.me-v span{font-size:13px;color:var(--text);padding:8px;line-height:1.45}
.me-v span.hl{background:var(--me-bs);border-radius:10px;color:var(--ink);font-weight:600}

/* ---------- STEPS (vertical timeline) ---------- */
.me-stp{list-style:none;margin:0 auto;padding:0;max-width:860px;position:relative;display:flex;flex-direction:column;gap:12px}
.me-stp:before{content:"";position:absolute;left:21px;top:10px;bottom:10px;width:3px;border-radius:2px;background:var(--line)}
.me-stp li{position:relative;display:grid;grid-template-columns:44px minmax(0,1fr) 112px;gap:14px;align-items:center;opacity:.35;transform:translateX(-8px);transition:opacity .5s var(--ease-o),transform .5s var(--ease-o)}
.me-stp li.on{opacity:1;transform:none}
.me-stp .n{position:relative;z-index:1;width:44px;height:44px;border-radius:50%;background:var(--surface);border:3px solid var(--line);color:var(--muted);display:grid;place-items:center;font:800 13px var(--f-mono);transition:background .4s,color .4s,border-color .4s}
.me-stp li.on .n{background:#0066FF;border-color:#0066FF;color:#fff}
.me-stp li.on:nth-child(even) .n{background:#FF8A00;border-color:#FF8A00}
.me-stp li>div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px}
.me-stp b{display:block;font:700 15px var(--f-disp);color:var(--ink)}
.me-stp small{display:block;font-size:12.5px;color:var(--text);margin-top:3px;line-height:1.45}
.me-stp em{justify-self:start;font:600 10.5px var(--f-mono);color:#0066FF;font-style:normal;background:var(--chip);border-radius:6px;padding:4px 8px;white-space:nowrap}
html[data-theme="dark"] .me-stp em{color:#9CC2FF}

/* ---------- RELATED ---------- */
.me-ind{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-bottom:34px}
.me-i{display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px;color:var(--ink);font:700 13px var(--f-disp);transition:transform .3s var(--ease-o),border-color .3s}
.me-i svg{width:17px;height:17px;color:#0066FF;flex-shrink:0}
html[data-theme="dark"] .me-i svg{color:#9CC2FF}
.me-i span{min-width:0}
.me-i:hover{transform:translateY(-3px);border-color:#0066FF;text-decoration:none}
.me-i.on{background:#0066FF;border-color:#0066FF;color:#fff}
.me-i.on svg{color:#fff}
.me-sh2 h2{font-size:clamp(24px,2.6vw,32px)}
.me-xs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.me-x{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 14px;color:var(--ink);transition:transform .3s var(--ease-o),border-color .3s,box-shadow .3s}
.me-x:hover{transform:translateY(-3px);border-color:#0066FF;text-decoration:none;box-shadow:var(--sh-s)}
.me-x i{width:36px;height:36px;border-radius:10px;background:var(--chip);color:#0066FF;display:grid;place-items:center;flex-shrink:0}

.me-x i svg{width:17px;height:17px}
.me-x span{flex:1;min-width:0}
.me-x small{display:block;font-size:11.5px;color:var(--muted)}
.me-x b{display:block;font:700 13.5px var(--f-disp)}
.me-x em{font-style:normal;color:#FF8A00;font-weight:700;transition:transform .3s var(--ease-o)}
.me-x:hover em{transform:translateX(4px)}

/* ---------- RESPONSIVE ---------- */
@media(max-width:1180px){
  .hero.lh .hero-grid.me-hg{grid-template-columns:minmax(0,1fr)}
  .me-stage{max-width:820px;width:100%;margin:0 auto}
  .me-xs{grid-template-columns:repeat(3,minmax(0,1fr))}
  .me-svc{grid-template-columns:repeat(2,minmax(0,1fr))}
  .me-dlg{grid-template-columns:repeat(2,minmax(0,1fr))}
  .me-ind{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media(max-width:960px){
  .me-cfw,.me-rdw,.me-pcw,.me-arw,.me-sgw,.me-jd{grid-template-columns:minmax(0,1fr)}
  .me-cfo,.me-rdo,.me-pco,.me-ard{position:static}
  .me-plg{grid-template-columns:minmax(0,1fr);max-width:520px;margin:0 auto}
  .me-chg,.me-skg{grid-template-columns:repeat(2,minmax(0,1fr))}
  .me-xs{grid-template-columns:repeat(2,minmax(0,1fr))}
  .me-dlw{grid-template-columns:minmax(0,1fr);justify-items:center}
  .me-vh{display:none}
  .me-v{grid-template-columns:minmax(0,1fr);gap:2px}
  .me-v span:before{content:attr(data-l);display:block;font:700 10px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
  .me-r{grid-template-columns:minmax(0,1fr)}
  .me-rh{border-left:0;border-top:3px solid #0066FF}
  .me-rmg:before{display:none}
  .me-arm{grid-template-columns:minmax(0,1fr);gap:14px}
  .me-js{grid-template-columns:repeat(3,minmax(0,1fr));row-gap:16px}
  .me-jl{display:none}
}
@media(max-width:640px){
  .hero.lh.me-hero{padding:26px 0 40px}
  .me-stage{padding:46px 0 6px}
  .me-mon{grid-template-columns:minmax(0,1fr)}
  .me-rail{flex-direction:row;gap:5px}
  .me-rail button[data-k]{padding:5px 2px;min-width:0}
  .me-rail .me-pz{flex:0 0 28px}
  .me-rail button[data-k] svg{width:24px;height:24px}
  .me-rail button[data-k] em{font-size:8.5px}
  .me-rail button[data-k] span{font-size:9.5px}
  .me-pz{flex:0 0 30px}
  .me-win{border-width:4px}
  .me-scr{height:300px}
  .me-vc{padding:8px 9px 6px}
  .me-vc b{font-size:15px}
  .me-vc small{letter-spacing:.02em;font-size:8.5px}
  .me-foot{grid-template-columns:minmax(0,1fr)}
  .me-log ol{grid-template-columns:minmax(0,1fr);min-height:0}
  .me-log li:nth-last-child(n+5){display:none}
  .me-pw.lh-powered{justify-self:start;order:2}
  .me-chip small{display:none}
  .me-chg,.me-skg,.me-xs,.me-svc,.me-dlg,.me-adds,.me-cf2,.me-cf3,.me-sgl{grid-template-columns:minmax(0,1fr)}
  .me-ind{grid-template-columns:repeat(2,minmax(0,1fr))}
  .me-js{grid-template-columns:repeat(2,minmax(0,1fr))}
  .me-cfi,.me-rdi,.me-pci{padding:18px}
  .me-q{grid-template-columns:minmax(0,1fr)}
  .me-stp li{grid-template-columns:44px minmax(0,1fr)}
  .me-stp em{grid-column:2;justify-self:start}
  .me-ring{width:220px;height:220px}
  .me-mh,.me-mr{grid-template-columns:minmax(0,1.2fr) minmax(0,.9fr) minmax(0,.9fr)}
}
@media(max-width:380px){
  .me-rail button[data-k] span{display:none}
  .me-vc small{font-size:8px}
}
@media(prefers-reduced-motion:reduce){
  .me-ecg path,.me-bpm path,.me-ring circle.v,.me-rt{animation:none}
  .me-live i,.me-logh span i{animation:none}
  .me-cv{transition:none}
  .me-stp li,.me-r,.me-skc li{transition:none}
}

/* ===================== MEDIA-specific layout ===================== */
.hero.lh.me-hero{background:#070D1F}
.me-strip{position:absolute;left:-5%;right:-5%;bottom:8%;height:58px;transform:rotate(-4deg);opacity:.32;overflow:hidden;pointer-events:none}
.me-strip-in{display:flex;gap:10px;height:100%;width:max-content;padding:9px 0;border-top:6px dotted rgba(255,255,255,.35);border-bottom:6px dotted rgba(255,255,255,.35);animation:meRoll 30s linear infinite}
.me-strip-in i{width:70px;height:100%;border-radius:4px;background:rgba(0,102,255,.35)}
.me-strip-in i:nth-child(3n){background:rgba(255,138,0,.35)}
@keyframes meRoll{to{transform:translateX(-640px)}}
.me-top{display:grid;grid-template-columns:minmax(0,1fr) 130px;gap:10px;align-items:stretch}
.me-top>.lh-tilt{min-width:0}
.me-view{background:#000;border-radius:14px;overflow:hidden;box-shadow:0 40px 80px -30px rgba(0,0,0,.8),0 0 0 1px rgba(255,255,255,.12)}
.me-spr{height:16px;background:#050B1A;display:block;position:relative}
.me-spr:before{content:"";position:absolute;left:8px;right:8px;top:4px;height:8px;border-top:8px dashed rgba(255,255,255,.28)}
.me-spr.b:before{top:4px}
.me-scr{position:relative;height:320px;background:var(--surface-2);overflow:hidden;touch-action:pan-y}
.me-cv{position:absolute;inset:0;width:100%;height:100%;display:block;opacity:0;transition:opacity .8s var(--ease-o)}
.me-cv.on{opacity:1}
.me-tc{position:absolute;right:10px;top:10px;font:700 11px var(--f-mono);color:#fff;background:rgba(5,11,26,.85);border-radius:6px;padding:4px 8px;letter-spacing:.06em;font-variant-numeric:tabular-nums}
.me-tc:before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#c0392b;margin-right:6px;vertical-align:0;animation:meBlink 1.2s steps(1) infinite}
.me-scopes{display:flex;flex-direction:column;gap:8px;min-width:0}
.me-sc{flex:1;background:rgba(14,26,54,.92);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:10px;color:#fff;min-width:0;display:flex;flex-direction:column;justify-content:center}
.me-sc small{display:block;font:600 9px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:#9fb3d9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me-sc b{display:block;font:800 18px var(--f-disp);color:#fff;font-variant-numeric:tabular-nums;margin:3px 0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me-sc b.bump{animation:meBump .5s var(--ease-o)}
.me-sc u{display:block;height:4px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden;text-decoration:none}
.me-sc u i{display:block;height:100%;background:#0066FF;transform-origin:left;transform:scaleX(0);transition:transform .5s var(--ease-o)}
.me-sc.o u i{background:#FF8A00}
/* NLE timeline */
.me-tl{position:relative;display:flex;gap:4px;align-items:stretch;background:#050B1A;border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:8px 8px 8px 8px}
.me-ph{position:absolute;top:2px;bottom:2px;left:8px;width:2px;background:#FF8A00;border-radius:1px;box-shadow:0 0 0 1px rgba(255,138,0,.25);z-index:2;pointer-events:none}
.me-ph:before{content:"";position:absolute;top:-2px;left:-5px;border:6px solid transparent;border-top-color:#FF8A00}
.me-tl button[data-k]{flex:1;min-width:0;display:flex;align-items:center;gap:6px;border:0;border-radius:6px;background:rgba(0,102,255,.25);color:#cfe0ff;cursor:pointer;padding:9px 8px;font:600 11.5px var(--f-disp);transition:background .3s,color .3s}
.me-tl button[data-k]:nth-of-type(even){background:rgba(255,138,0,.2)}
.me-tl button[data-k] em{font:700 9.5px var(--f-mono);font-style:normal;opacity:.8}
.me-tl button[data-k] span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me-tl button[data-k]:hover{color:#fff}
.me-tl button[data-k].on{background:#0066FF;color:#fff}
.me-pz{flex:0 0 32px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);border-radius:8px;color:#fff;display:grid;place-items:center;cursor:pointer}
.me-pz svg{width:12px;height:12px}
.me-pz .pl,.me-pz.paused .pa{display:none}.me-pz.paused .pl{display:block}
/* challenges */
.me-chg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.me-c{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;transition:transform .35s var(--ease-o),box-shadow .3s}
.me-c:hover{transform:translateY(-4px) rotate(-.4deg);box-shadow:var(--sh-s)}
.me-ct{display:flex;justify-content:space-between;align-items:center;background:#0B132B;color:#fff;padding:10px 14px;border-bottom:4px solid #FF8A00;border-top:6px dashed rgba(255,255,255,.22);position:relative}
html[data-theme="dark"] .me-ct{background:#16264A}
.me-ct span{font:700 11px var(--f-mono);letter-spacing:.14em}
.me-ct i{width:30px;height:30px;border-radius:8px;background:#0066FF;display:grid;place-items:center}
.me-ct i svg{width:16px;height:16px}
.me-c h3{margin:14px 16px 4px;font:700 16.5px var(--f-disp);color:var(--ink)}
.me-c p{margin:0 16px;font-size:13.5px;color:var(--text);line-height:1.55;flex:1}
.me-c em{margin:12px 16px 16px;font:700 12px var(--f-disp);font-style:normal;color:var(--me-ot)}
/* stack tabs */
.me-stg{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;border:1.5px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
.me-stg button{position:relative;border:0;border-right:1px solid var(--line);background:none;padding:13px 10px;font:700 13px var(--f-disp);color:var(--ink);cursor:pointer;text-align:left;transition:background .25s,color .25s}
.me-stg button:last-child{border-right:0}
.me-stg button em{display:block;font:700 10px var(--f-mono);font-style:normal;color:var(--muted)}
.me-stg button:after{content:"";position:absolute;right:-7px;top:50%;width:12px;height:12px;margin-top:-6px;background:inherit;transform:rotate(45deg);border-top:1px solid var(--line);border-right:1px solid var(--line);z-index:1}
.me-stg button:last-child:after{display:none}
.me-stg button.on{background:#0066FF;color:#fff}
.me-stg button.on em{color:#dce8ff}
.me-skp{margin-top:14px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.me-skc{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.me-skh{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.me-skh i{width:36px;height:36px;border-radius:10px;background:#0066FF;color:#fff;display:grid;place-items:center}
.me-skh.o i{background:#FF8A00}.me-skh.n i{background:#0B132B}
html[data-theme="dark"] .me-skh.n i{background:#2C3D68}
.me-skh i svg{width:17px;height:17px}
.me-skh b{font:700 16px var(--f-disp);color:var(--ink)}
.me-skc ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.me-skc li{display:flex;gap:9px;align-items:flex-start;font-size:13px;color:var(--text);line-height:1.45;border-left:3px solid #0066FF;background:var(--surface-2);border-radius:0 10px 10px 0;padding:8px 10px;animation:meIn .4s var(--ease-o) both}
.me-skc li b{color:var(--ink)}
/* pipeline */
.me-arw{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:18px;align-items:start}
.me-arm{position:relative;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:34px 28px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:var(--sh-s)}
.me-arcv{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.me-ab{position:relative;z-index:1;display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto auto;gap:2px 8px;align-items:center;border:1.5px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:12px;padding:10px 11px;cursor:pointer;text-align:left;transition:border-color .2s,background .2s,transform .2s var(--ease-o);min-width:0}
.me-ab em{grid-column:1/-1;font:700 9.5px var(--f-mono);font-style:normal;color:var(--muted)}
.me-ab svg{width:18px;height:18px;color:#0066FF}
html[data-theme="dark"] .me-ab svg{color:#9CC2FF}
.me-ab span{font:700 13px var(--f-disp);min-width:0}
.me-ab small{display:block;font:500 11px var(--f-body);color:var(--muted)}
.me-ab:hover{border-color:#0066FF;transform:translateY(-2px)}
.me-ab.o{border-color:#FF8A00}
.me-ab.on{background:#0066FF;border-color:#0066FF;color:#fff}
.me-ab.on svg,.me-ab.on em,.me-ab.on small{color:#fff}
.me-soc{position:relative;z-index:1;grid-column:1/-1;display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#0B132B;color:#fff;border-radius:12px;padding:10px 14px}
html[data-theme="dark"] .me-soc{background:#16264A}
.me-soc b{display:flex;align-items:center;gap:8px;font:700 13px var(--f-disp)}
.me-soc b svg{width:16px;height:16px;color:#FFB15C}
.me-soc span{font:500 11.5px var(--f-mono);color:#9fb3d9}
.me-soc .me-ab{margin-left:auto;display:inline-flex;padding:6px 12px;background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.2);color:#fff;font:700 12px var(--f-disp)}
.me-soc .me-ab.on{background:#FF8A00;border-color:#FF8A00}
/* reg cards */
.me-rf{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.me-rf button{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 14px;font:600 13px var(--f-disp);cursor:pointer;transition:border-color .2s,background .2s}
.me-rf button em{font:700 10.5px var(--f-mono);font-style:normal;color:var(--muted);background:var(--surface-2);border-radius:999px;padding:1px 7px}
.me-rf button:hover{border-color:#0066FF}
.me-rf button.on{background:#0066FF;border-color:#0066FF;color:#fff}
.me-rf button.on em{background:rgba(255,255,255,.2);color:#fff}
.me-rmg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.me-r{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:6px;transition:border-color .3s,transform .3s var(--ease-o)}
.me-r:hover{border-color:#0066FF;transform:translateY(-2px)}
.me-r.hid{display:none}
.me-r h3{margin:4px 0 0;font:700 15px var(--f-disp);color:var(--ink)}
.me-r>small{font:500 11.5px/1.5 var(--f-body);color:var(--muted)}
.me-rb{align-self:flex-start;display:inline-block;white-space:nowrap;font:800 10px var(--f-mono);letter-spacing:.08em;color:#fff;background:#0066FF;border-radius:999px;padding:3px 9px}
.me-rb.n{background:#0B132B}.me-rb.o{background:#FF8A00}
html[data-theme="dark"] .me-rb.n{background:#2C3D68}
.me-rh{background:var(--me-bs);border-radius:10px;padding:9px 11px;font-size:13px;color:var(--ink);line-height:1.55}
.me-rh b,.me-re b{display:block;font:700 10px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--me-ot);margin-bottom:2px}
.me-rh a{color:#0066FF;font-weight:600}
html[data-theme="dark"] .me-rh a{color:#9CC2FF}
.me-re{font-size:12.5px;color:var(--text);line-height:1.5;padding:0 2px}
/* segments */
.me-sgt{display:flex;flex-wrap:wrap;gap:8px}
.me-sgt button{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:9px 16px;font:700 13.5px var(--f-disp);cursor:pointer;transition:border-color .2s,background .2s,color .2s}
.me-sgt button svg{width:16px;height:16px;color:#0066FF}
html[data-theme="dark"] .me-sgt button svg{color:#9CC2FF}
.me-sgt button:hover{border-color:#0066FF}
.me-sgt button.on{background:#FF8A00;border-color:#FF8A00;color:#fff}
.me-sgt button.on svg{color:#fff}
.me-sgp{margin-top:14px;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) minmax(0,1fr);gap:16px;background:#0B132B;color:#fff;border-radius:20px;padding:22px}
html[data-theme="dark"] .me-sgp{background:#0E1A36;border:1px solid var(--line)}
.me-sgp .me-k{color:#FFB15C}
.me-sgp h3{margin:6px 0;font:700 20px var(--f-disp);color:#fff}
.me-sgp h3.sw{animation:meIn .45s var(--ease-o)}
.me-sgp p{margin:0 0 14px;font-size:13.5px;color:#c9d6ee;line-height:1.6}
.me-sgp ul{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:7px}
.me-sgp li{display:flex;gap:9px;align-items:flex-start;font-size:13px;color:#e3ebfa;line-height:1.45;animation:meIn .4s var(--ease-o) both}
.me-sgp li svg{width:15px;height:15px;color:#FFB15C;flex-shrink:0;margin-top:2px}
/* use cases */
.me-ucw{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.6fr);gap:16px;align-items:stretch}
.me-ucl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.me-ucl button{position:relative;width:100%;display:flex;align-items:center;gap:10px;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:14px;cursor:pointer;overflow:hidden;transition:border-color .25s,background .25s}
.me-ucl em{font:700 11px var(--f-mono);font-style:normal;color:var(--muted)}
.me-ucl b{font:700 14px var(--f-disp);color:var(--ink)}
.me-ucl i{position:absolute;left:0;bottom:0;height:3px;width:100%;background:#FF8A00;transform:scaleX(var(--p,0));transform-origin:left}
.me-ucl li.on button{border-color:#0066FF;background:var(--me-bs)}
.me-ucl li.on em{color:#0066FF}
html[data-theme="dark"] .me-ucl li.on em{color:#9CC2FF}
.me-ucd{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:10px}
.me-ucd h3{margin:0;font:700 20px var(--f-disp);color:var(--ink)}
.me-ucd h3.sw,.me-ucd p.sw{animation:meIn .45s var(--ease-o)}
.me-ucd p{margin:0;font-size:13.5px;color:var(--text);line-height:1.6}
.me-ucb{display:flex;flex-direction:column;gap:7px;background:#0B132B;border-radius:14px;padding:14px}
html[data-theme="dark"] .me-ucb{background:#070D1F;border:1px solid var(--line)}
.me-ucb div{display:grid;grid-template-columns:120px minmax(0,1fr) 128px;gap:10px;align-items:center;font:600 12px var(--f-disp);color:#c9d6ee}
.me-ucb div i{display:block;height:10px;border-radius:5px;background:rgba(255,255,255,.1);overflow:hidden}
