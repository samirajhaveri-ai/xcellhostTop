/* ---------- OVERVIEW · model alone vs grounded ---------- */
.rg-ov .prov svg{width:16px;height:16px;flex-shrink:0}
.rg-gap{display:grid;grid-template-columns:minmax(0,1fr) 110px minmax(0,1fr);gap:0;align-items:stretch;margin-top:28px}
.rg-gapc{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:8px}
.rg-gapc.yes{border:2px solid #0066FF;box-shadow:0 30px 60px -40px rgba(0,102,255,.6)}
.rg-gapc.no .rg-gk{color:var(--muted)}
.rg-gapc .q{margin:4px 0 0;align-self:flex-end;max-width:92%;background:#0066FF;color:#fff;border-radius:14px 14px 4px 14px;padding:9px 13px;font:600 13.5px var(--f-disp)}
.rg-gapc .a{margin:0;max-width:92%;background:var(--surface-2);border:1px solid var(--line);border-radius:14px 14px 14px 4px;padding:10px 13px;font-size:14px;color:var(--text);line-height:1.5}
.rg-gapc .a em{font:700 12px var(--f-mono);font-style:normal;color:#16a34a;background:rgba(22,163,74,.1);border-radius:5px;padding:1px 4px}
.rg-gapc.no .a{color:var(--muted)}
.rg-gapc ul{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:7px}
.rg-gapc li{display:flex;align-items:center;gap:9px;font-size:13.5px;color:var(--text)}
.rg-gapc li svg{width:15px;height:15px;flex-shrink:0}
.rg-gapc.no li svg{color:#c0392b}.rg-gapc.yes li svg{color:#16a34a}
.rg-gapm{position:relative;display:flex;align-items:center;justify-content:center}
.rg-gapm span{position:relative;z-index:1;font:700 11px var(--f-mono);color:#fff;background:#FF8A00;border-radius:999px;padding:6px 10px;white-space:nowrap;box-shadow:0 10px 24px -10px rgba(255,138,0,.8)}
.rg-gapm i{position:absolute;left:8px;right:8px;top:50%;height:2px;background:repeating-linear-gradient(90deg,#FF8A00 0 6px,transparent 6px 12px);background-size:24px 2px;animation:rgDash 1s linear infinite}
@keyframes rgDash{to{background-position:24px 0}}

/* ---------- WORKFLOW · 6 cards ---------- */
.rg-wfg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;counter-reset:w}
.rg-wfc{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px 22px 18px;display:flex;flex-direction:column;gap:10px;overflow:hidden;transition:transform .35s var(--ease-o),box-shadow .35s,border-color .3s;outline:none}
.rg-wfc:hover,.rg-wfc:focus-visible{transform:translateY(-5px);box-shadow:var(--sh);border-color:#0066FF}
.rg-wfc:hover .rg-ik,.rg-wfc:focus-visible .rg-ik{transform:rotate(-8deg) scale(1.06)}
.rg-wn{position:absolute;right:16px;top:12px;font:800 40px/1 var(--f-disp);color:var(--line);transition:color .35s}
.rg-wfc:hover .rg-wn{color:rgba(0,102,255,.22)}
.rg-wfc h3{margin:2px 0 0;font:700 17px var(--f-disp);color:var(--ink)}
.rg-wfc p{margin:0;font-size:14px;color:var(--text);line-height:1.55}
.rg-wfx{margin-top:auto;border-top:1px dashed var(--line-2);padding-top:10px;font-size:12.5px;color:var(--muted);line-height:1.5}
.rg-wfx b{display:block;font:700 10px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:#FF8A00;margin-bottom:2px}
.rg-wfc:after{content:"";position:absolute;left:0;bottom:0;height:3px;width:100%;background:#0066FF;transform:scaleX(0);transform-origin:left;transition:transform .5s var(--ease-o)}
.rg-wfc:hover:after,.rg-wfc:focus-visible:after{transform:scaleX(1)}

/* ---------- EVALUATE ---------- */
.rg-evw{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:22px;align-items:start}
.rg-evl{display:flex;flex-direction:column;gap:10px}
.rg-evl button{display:flex;align-items:center;gap:14px;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:16px;padding:14px 16px;cursor:pointer;color:var(--ink);transition:border-color .3s,transform .3s var(--ease-o),background .3s}
.rg-evl button:hover{transform:translateX(4px)}
.rg-evl button.on{border-color:#0066FF;background:rgba(0,102,255,.06)}
.rg-evl .n{width:38px;height:38px;border-radius:11px;background:var(--chip);color:#0066FF;display:grid;place-items:center;font:800 15px var(--f-disp);flex-shrink:0;transition:background .3s,color .3s}
.rg-evl button.on .n{background:#0066FF;color:#fff}
.rg-evl b{display:block;font:700 15px var(--f-disp)}
.rg-evl small{display:block;font-size:12.5px;color:var(--muted)}
.rg-evp{background:#0B132B;color:#fff;border-radius:22px;padding:22px;box-shadow:0 30px 60px -30px rgba(11,19,43,.7);min-height:300px;display:flex;flex-direction:column;gap:12px}
.rg-evq span{display:block;font:700 10px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:#FFB15C}
.rg-evq b{display:block;font:700 17px/1.35 var(--f-disp);margin-top:4px}
.rg-evs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.rg-evs li{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:9px 12px;font-size:13px;color:#c9d6ee;opacity:0;transform:translateX(-10px);transition:opacity .45s var(--ease-o),transform .45s var(--ease-o)}
.rg-evs li.in{opacity:1;transform:none}
.rg-evs li em{font:700 11px var(--f-mono);font-style:normal;color:#7FB0FF}
.rg-evs li b{color:#fff;font-weight:600}
.rg-evs li span.v{font:700 10.5px var(--f-mono);border-radius:6px;padding:3px 7px;white-space:nowrap}
.rg-evs .v.ok{background:rgba(95,224,141,.16);color:#5FE08D}
.rg-evs .v.bad{background:rgba(255,107,91,.16);color:#FF8A7A}
.rg-evs .v.wa{background:rgba(255,177,92,.16);color:#FFB15C}
.rg-evr{display:flex;align-items:center;gap:10px;margin-top:auto;background:rgba(95,224,141,.12);border:1px solid rgba(95,224,141,.35);border-radius:12px;padding:10px 12px;font-size:13.5px;color:#e6fbe9;opacity:0;transition:opacity .5s var(--ease-o)}
.rg-evr.in{opacity:1}
.rg-evr i{width:24px;height:24px;border-radius:50%;background:#16a34a;display:grid;place-items:center;flex-shrink:0}
.rg-evr i svg{width:13px;height:13px;color:#fff}
.rg-evn{font-size:11.5px;color:#9fb3d9}

/* ---------- BANNER ---------- */
.rg-ban{background:#0066FF;color:#fff;overflow:hidden;position:relative}
.rg-banw{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:28px;align-items:center;padding-top:30px;padding-bottom:30px}
.rg-banm{display:flex;gap:10px;align-items:baseline;font:800 46px/1 var(--f-disp);letter-spacing:-.02em}
.rg-banm span{display:inline-block;animation:rgWave 4.5s var(--ease-o) infinite}
.rg-banm span:nth-child(2){font-size:22px;font-weight:600;opacity:.8;animation-delay:.25s}
.rg-banm span.o{color:#0B132B;background:#fff;border-radius:12px;padding:4px 10px;animation-delay:.5s}
@keyframes rgWave{0%,70%,100%{transform:none}80%{transform:translateY(-6px)}}
.rg-bant b{display:block;font:700 19px/1.3 var(--f-disp)}
.rg-bant span{display:block;margin-top:4px;font-size:14.5px;color:rgba(255,255,255,.86)}
html[data-theme="dark"] .rg-ban{background:#0B3FA0}

/* ---------- PILOT ---------- */
.rg-pig{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) minmax(0,1.05fr);gap:14px;align-items:stretch}
.rg-pic{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:9px;transition:transform .35s var(--ease-o),box-shadow .3s}
.rg-pic:hover{transform:translateY(-5px);box-shadow:var(--sh)}
.rg-pin{position:absolute;right:16px;top:14px;width:26px;height:26px;border-radius:50%;border:2px solid #0066FF;color:#0066FF;display:grid;place-items:center;font:800 12px var(--f-mono)}
html[data-theme="dark"] .rg-pin{color:#9CC2FF;border-color:#7FB0FF}
.rg-pic b{font:700 16px var(--f-disp);color:var(--ink);margin-top:4px}
.rg-pic p{margin:0;font-size:13.5px;color:var(--text);line-height:1.55}
.rg-pic ul{list-style:none;margin:auto 0 0;padding:8px 0 0;display:flex;flex-direction:column;gap:6px;border-top:1px dashed var(--line-2)}
.rg-pic li{display:flex;align-items:center;gap:8px;font:600 12.5px var(--f-disp);color:var(--ink)}
.rg-pic li svg{width:14px;height:14px;color:#0066FF;flex-shrink:0}
html[data-theme="dark"] .rg-pic li svg{color:#9CC2FF}
.rg-pio{background:#0B132B;color:#fff;border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:10px}
.rg-pio .rg-gk{color:#FFB15C}
.rg-pio ol{margin:0 0 6px;padding:0 0 0 18px;display:flex;flex-direction:column;gap:7px;font-size:13.5px;color:#c9d6ee;line-height:1.45}
.rg-pio ol li::marker{color:#FFB15C;font-weight:700}
.rg-pio .btn{margin-top:auto}

/* ---------- RAG vs FINE-TUNING ---------- */
.rg-ftn{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.rg-ftn button{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 14px;font:600 13px var(--f-disp);cursor:pointer;transition:border-color .25s,background .25s,color .25s,transform .25s var(--ease-o)}
.rg-ftn button svg{width:15px;height:15px;color:#0066FF}
.rg-ftn button:hover{transform:translateY(-2px)}
.rg-ftn button.on{background:#0066FF;border-color:#0066FF;color:#fff}
.rg-ftn button.on svg{color:#fff}
.rg-ftn button[data-w="f"].on{background:#0B132B;border-color:#0B132B}
html[data-theme="dark"] .rg-ftn button[data-w="f"].on{background:#22325e;border-color:#3a4f86}
.rg-ftg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.rg-ftc{background:var(--surface);border:1.5px solid var(--line);border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:8px;transition:transform .45s var(--ease-o),border-color .35s,box-shadow .35s,opacity .35s}
.rg-ftc.dim{opacity:.55}
.rg-ftc.best{border-color:#FF8A00;transform:translateY(-6px);box-shadow:0 30px 60px -36px rgba(255,138,0,.65)}
.rg-ftb{align-self:flex-start;font:800 13px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:#fff;background:#0066FF;border-radius:8px;padding:5px 10px}
.rg-ftc[data-c="b"] .rg-ftb{background:#FF8A00}.rg-ftc[data-c="f"] .rg-ftb{background:#0B132B}
html[data-theme="dark"] .rg-ftc[data-c="f"] .rg-ftb{background:#22325e}
.rg-ftc h3{margin:4px 0 0;font:700 17px var(--f-disp);color:var(--ink)}
.rg-ftc p{margin:0;font-size:14px;color:var(--text);line-height:1.55}
.rg-ftc ul{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.rg-ftc li{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--text)}
.rg-ftc li svg{width:14px;height:14px;color:#16a34a;flex-shrink:0}
.rg-ftv{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:18px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 18px}
.rg-ftv b{flex:1;min-width:200px;font:700 16px var(--f-disp);color:var(--ink)}
.rg-ftv b.sw{animation:rgIn .5s var(--ease-o)}

/* ---------- HOW ---------- */
.rg-hwg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:26px;align-items:center}
.rg-hws{display:flex;flex-direction:column;gap:12px}
.rg-hwc{display:flex;gap:16px;background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:18px;transition:border-color .35s,box-shadow .35s,transform .35s var(--ease-o)}
.rg-hwc.on{border-color:#0066FF;box-shadow:0 24px 50px -34px rgba(0,102,255,.6);transform:translateX(6px)}
.rg-hwn{font:800 28px/1 var(--f-disp);color:var(--line-2);flex-shrink:0;transition:color .35s}
.rg-hwc.on .rg-hwn{color:#0066FF}
.rg-hwc h3{margin:0 0 4px;font:700 16.5px var(--f-disp);color:var(--ink)}
.rg-hwc p{margin:0;font-size:13.5px;color:var(--text);line-height:1.55}
.rg-hwt{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.rg-hwt span{font:600 10.5px var(--f-mono);color:var(--muted);background:var(--chip);border-radius:6px;padding:3px 7px}
.rg-hwc.on .rg-hwt span{color:#0066FF}
html[data-theme="dark"] .rg-hwc.on .rg-hwt span{color:#9CC2FF}
.rg-hwv{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px}
.rg-dia{width:100%;height:auto;display:block}
.rg-dia .bx{fill:var(--surface-2);stroke:var(--line-2);stroke-width:1.2}
.rg-dia .bb{fill:#0066FF}
.rg-dia .bo{fill:#FF8A00}
.rg-dia .bg{fill:#16a34a}
.rg-dia .ln{fill:none;stroke:var(--line-2);stroke-width:2;stroke-dasharray:5 5}
.rg-dia text{font:600 11px var(--f-disp);text-anchor:middle;fill:var(--ink)}
.rg-dia .tw{fill:#fff;font-weight:700}
.rg-dia .tm{font:600 10.5px var(--f-mono);fill:var(--muted)}
.rg-dia .z{opacity:.35;transition:opacity .5s var(--ease-o)}
.rg-dia .z.on,.rg-dia .z.seen{opacity:1}
.rg-dia .z.on .ln{stroke:#0066FF;animation:rgDashS 1s linear infinite}
@keyframes rgDashS{to{stroke-dashoffset:-20}}
.rg-dia .pk{fill:#FF8A00}
.rg-hwk{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;margin-top:8px;font:600 11.5px var(--f-mono);color:var(--muted)}
.rg-hwk i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.rg-hwk .a{background:#0066FF}.rg-hwk .b{background:#FF8A00}.rg-hwk .c{background:#16a34a}

/* ---------- USE CASES ---------- */
.rg-ucf{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
.rg-ucf button{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 15px;font:600 13px var(--f-disp);cursor:pointer;transition:all .25s}
.rg-ucf button.on{background:#0B132B;border-color:#0B132B;color:#fff}
html[data-theme="dark"] .rg-ucf button.on{background:#0066FF;border-color:#0066FF}
.rg-ucg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.rg-ucc{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:8px;transition:transform .4s var(--ease-o),opacity .4s,box-shadow .3s,border-color .3s}
.rg-ucc:hover{transform:translateY(-5px);box-shadow:var(--sh);border-color:#0066FF}
.rg-ucc.off{opacity:.28;transform:scale(.97)}
.rg-uch{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.rg-uct{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end}
.rg-uct em{font:700 10px var(--f-mono);font-style:normal;letter-spacing:.06em;text-transform:uppercase;color:#0066FF;background:var(--chip);border-radius:6px;padding:3px 7px}
html[data-theme="dark"] .rg-uct em{color:#9CC2FF}
.rg-ucc>b{font:700 16px var(--f-disp);color:var(--ink);margin-top:4px}
.rg-ucc p{margin:0;font-size:13.5px;color:var(--text);line-height:1.55}
.rg-ucx{margin-top:auto;display:flex;flex-direction:column;gap:5px;background:var(--surface-2);border-radius:12px;padding:10px 12px}
.rg-ucx span{font-size:12.5px;color:var(--text);line-height:1.4}
.rg-ucx em{display:inline-block;min-width:66px;font:700 10px var(--f-mono);font-style:normal;letter-spacing:.08em;text-transform:uppercase;color:#FF8A00}

/* ---------- DELIVERY ---------- */
.rg-raci{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:22px}
.rg-rc{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 20px;display:flex;flex-direction:column;gap:6px}
.rg-rc.x{border:2px solid #FF8A00}
.rg-rch{display:flex;align-items:center;gap:8px;font:800 15px var(--f-disp);color:var(--ink)}
.rg-rc>b{font:700 10.5px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.rg-rc ul{list-style:none;margin:4px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.rg-rc li{position:relative;padding-left:16px;font-size:13.5px;color:var(--text)}
.rg-rc li:before{content:"";position:absolute;left:2px;top:7px;width:7px;height:7px;border-radius:2px;background:#0066FF}
.rg-rc.x li:before{background:#FF8A00}

/* ---------- INDIA ---------- */
.rg-ing{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.rg-inc{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:8px}
.rg-inc b{font:700 15px var(--f-disp);color:var(--ink)}
.rg-inc p{margin:0;font-size:13.5px;color:var(--text);line-height:1.55}
.rg-inb{align-self:flex-start;font:800 17px var(--f-disp);color:#fff;background:#0066FF;border-radius:10px;padding:6px 11px}
.rg-inb.o{background:#FF8A00}.rg-inb.n{background:#0B132B}
html[data-theme="dark"] .rg-inb.n{background:#22325e}

/* ---------- PLANS ---------- */
.rg-plg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:stretch}
.rg-plc{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:24px;display:flex;flex-direction:column;gap:8px;transition:transform .35s var(--ease-o),box-shadow .3s}
.rg-plc:hover{transform:translateY(-6px);box-shadow:var(--sh)}
.rg-plc.pop{border:2px solid #0066FF;box-shadow:0 30px 60px -36px rgba(0,102,255,.6)}
.rg-flag{position:absolute;top:-12px;right:20px;background:#FF8A00;color:#fff;font:700 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;padding:5px 10px;border-radius:99px}
.rg-pt{font:700 11px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:#0066FF}
html[data-theme="dark"] .rg-pt{color:#9CC2FF}
.rg-plc h3{margin:0;font:700 19px var(--f-disp);color:var(--ink)}
.rg-pr{display:flex;align-items:baseline;gap:6px;margin-top:4px}
.rg-pr b{font:800 30px var(--f-disp);color:var(--ink)}
.rg-pr small{font-size:13px;color:var(--muted)}
.rg-pu{font:500 12px var(--f-mono);color:var(--muted)}
.rg-meter{height:6px;border-radius:4px;background:var(--line);overflow:hidden;margin:6px 0 4px}
.rg-meter i{display:block;height:100%;width:calc(var(--w)*100%);background:#0066FF;border-radius:4px;transform-origin:left;transform:scaleX(0);transition:transform 1.2s var(--ease-o)}
.rg-plg.in .rg-meter i{transform:scaleX(1)}
.rg-plc.pop .rg-meter i{background:#FF8A00}
.rg-plc ul{list-style:none;margin:6px 0 14px;padding:0;display:flex;flex-direction:column;gap:9px;flex:1}
.rg-plc li{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:var(--text);line-height:1.45}
.rg-plc li svg{width:16px;height:16px;color:#0066FF;flex-shrink:0;margin-top:1px}
html[data-theme="dark"] .rg-plc li svg{color:#9CC2FF}

/* ---------- CONFIGURE ---------- */
.rg-cfw{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:22px;align-items:start}
.rg-cfi,.rg-esi,.rg-mtq{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:16px;min-width:0}
.rg-cfi .fld,.rg-esi .fld{margin:0}
.rg-cfi .seg,.rg-esi .seg{flex-wrap:wrap}
.rg-cfi label small,.rg-esi label small{font-weight:500;color:var(--muted);margin-left:6px}
.rg-adds{display:grid;gap:8px}
.rg-adds label{display:flex;align-items:flex-start;gap:12px;border:1.5px solid var(--line);border-radius:14px;padding:11px 13px;cursor:pointer;transition:border-color .25s,background .25s}
.rg-adds label:hover{border-color:var(--line-2)}
.rg-adds label:has(input:checked){border-color:#0066FF;background:rgba(0,102,255,.06)}
.rg-adds input{margin-top:3px;accent-color:#0066FF;width:16px;height:16px;flex-shrink:0}
.rg-adds b{display:flex;align-items:center;gap:7px;font:600 13.5px var(--f-disp);color:var(--ink)}
.rg-adds b svg{width:15px;height:15px;color:#0066FF}
.rg-adds small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.rg-cfo{position:sticky;top:140px;min-width:0}
.rg-cfs{background:#0B132B;color:#fff;border-radius:22px;padding:22px;box-shadow:0 30px 60px -30px rgba(11,19,43,.75)}
.rg-cfk{font:700 10px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:#FFB15C}
.rg-cfs h3{margin:6px 0 12px;font:700 18px var(--f-disp);color:#fff}
.rg-cfl{list-style:none;margin:0 0 12px;padding:0;display:flex;flex-direction:column;gap:6px}
.rg-cfl li{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:#c9d6ee;animation:rgIn .35s var(--ease-o)}
.rg-cfl li b{color:#fff;font-weight:600;white-space:nowrap}
.rg-cft{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.rg-cft>div{background:rgba(255,255,255,.07);border-radius:12px;padding:10px 12px}
.rg-cft span{display:block;font:600 10px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:#9fb3d9}
.rg-cft b{font:800 18px var(--f-disp)}
.rg-cfr{display:flex;justify-content:space-between;font-size:13.5px;color:#c9d6ee;padding:5px 0;border-top:1px solid rgba(255,255,255,.1)}
.rg-cfr b{color:#fff}
.rg-cfr.t{font-size:15px;color:#fff}
.rg-cfr.t b{font:800 22px var(--f-disp);color:#FFB15C}
.rg-cfr.q b{color:#FFB15C}
.rg-cfr[hidden]{display:none}
#main .rg-cfb .btn-gw{background:transparent;border:1.5px solid rgba(255,255,255,.38);color:#fff}
#main .rg-cfb .btn-gw:hover{border-color:#fff;background:rgba(255,255,255,.08)}
#main .rg-cfb .btn-gw svg{width:16px;height:16px}
.rg-cfb{display:grid;gap:8px;margin-top:14px}
.rg-cfb .btn[disabled]{opacity:.45;cursor:not-allowed}
.rg-cff{display:block;margin-top:10px;font-size:11.5px;color:#9fb3d9;line-height:1.5}

/* ---------- ESTIMATOR ---------- */
.rg-esw{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:22px;align-items:start}
.rg-esgrp{display:flex;flex-direction:column;gap:12px;padding-bottom:14px;border-bottom:1px dashed var(--line-2)}
.rg-esgrp:last-child{border-bottom:0;padding-bottom:0}
.rg-esgrp.m{background:rgba(255,138,0,.06);border:1px solid rgba(255,138,0,.3);border-radius:14px;padding:12px 14px}
.rg-esh{display:flex;align-items:center;flex-wrap:wrap;gap:7px;font:700 13px var(--f-disp);color:var(--ink)}
.rg-esh svg{width:15px;height:15px;color:#0066FF}
.rg-esh em{font:500 11.5px var(--f-body,inherit);font-style:normal;color:var(--muted)}
.rg-es2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.rg-es3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.rg-esi .fld label,.rg-esi .fld .lb{font-size:12.5px}
.rg-num{width:100%;height:40px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);padding:0 10px;font:600 14px var(--f-mono);min-width:0}
.rg-num:focus{outline:none;border-color:#0066FF;box-shadow:0 0 0 3px rgba(0,102,255,.15)}
.rg-eso{position:sticky;top:140px;background:#0B132B;color:#fff;border-radius:22px;padding:22px;box-shadow:0 30px 60px -30px rgba(11,19,43,.75);min-width:0}
.rg-esk,.rg-mtk{font:700 10px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:#FFB15C}
.rg-flow{display:flex;align-items:stretch;gap:6px;margin:10px 0 14px}
.rg-flow>div{flex:1;min-width:0;background:rgba(255,255,255,.07);border-radius:12px;padding:9px 10px}
.rg-flow>div.o{background:rgba(255,138,0,.16)}
.rg-flow>i{align-self:center;font-style:normal;color:#7FB0FF;font-weight:700}
.rg-flow small{display:block;font:600 9px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:#9fb3d9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rg-flow b{display:block;font:800 16px var(--f-disp);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.rg-flow b.bump{animation:rgBump .5s var(--ease-o)}
.rg-stb{display:flex;height:12px;border-radius:6px;overflow:hidden;background:rgba(255,255,255,.1)}
.rg-stb i{display:block;height:100%;transition:width .6s var(--ease-o)}
.rg-stb .a,.rg-stl .a{background:#0066FF}.rg-stb .b,.rg-stl .b{background:#FF8A00}.rg-stb .c,.rg-stl .c{background:#7FB0FF}
.rg-stl{display:flex;flex-wrap:wrap;gap:12px;margin:8px 0 14px;font-size:12px;color:#c9d6ee}
.rg-stl i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.rg-stl b{color:#fff;margin-left:3px}
.rg-cost{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.rg-cost>div{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:10px 12px;min-width:0}
.rg-cost>div.t{background:rgba(255,138,0,.14);border-color:rgba(255,138,0,.4)}
.rg-cost small{display:block;font:600 9.5px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:#9fb3d9}
.rg-cost b{display:block;font:800 18px var(--f-disp);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rg-cost .t b{color:#FFB15C}
.rg-cost em{display:block;font:500 11px var(--f-mono);font-style:normal;color:#9fb3d9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rg-fit{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:12px;background:rgba(255,255,255,.07);border-radius:14px;padding:10px 12px}
.rg-fit span{font:700 13.5px var(--f-disp)}
.rg-esf{margin-top:12px;display:flex;flex-direction:column;gap:4px}
.rg-esf b{font:700 10px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:#9fb3d9}
.rg-esf code{display:block;font:500 11px/1.45 var(--f-mono);color:#c9d6ee;background:rgba(255,255,255,.05);border-radius:6px;padding:4px 8px;white-space:normal;word-break:break-word}
.rg-esf code.rg-esl{color:#FFB15C}
.rg-esn{display:block;margin-top:10px;font-size:11.5px;color:#9fb3d9;line-height:1.5}

/* ---------- MATCHER ---------- */
.rg-mtw{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:22px;align-items:start}
.rg-q{display:flex;flex-direction:column;gap:8px}
.rg-q>b{display:flex;align-items:center;gap:9px;font:700 14px var(--f-disp);color:var(--ink)}
.rg-q>b span{width:22px;height:22px;border-radius:7px;background:#0066FF;color:#fff;display:grid;place-items:center;font:800 11px var(--f-mono);flex-shrink:0}
.rg-q .opts{display:flex;flex-wrap:wrap;gap:6px}
.rg-q .opts button{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:7px 12px;font:600 12.5px var(--f-disp);cursor:pointer;transition:all .2s}
.rg-q .opts button:hover{border-color:var(--line-2)}
.rg-q .opts button.on{background:#0066FF;border-color:#0066FF;color:#fff}
.rg-mto{position:sticky;top:140px;background:#0B132B;color:#fff;border-radius:22px;padding:22px;box-shadow:0 30px 60px -30px rgba(11,19,43,.75);min-width:0}
.rg-mth{display:flex;align-items:center;gap:12px;margin:10px 0}
.rg-mth>div{flex:1;min-width:0}
.rg-mth b{display:block;font:700 18px var(--f-disp)}
.rg-mth small{display:block;font-size:12.5px;color:#9fb3d9}
.rg-mth.sw b,.rg-mth.sw small{animation:rgIn .5s var(--ease-o)}
.rg-mtp{font:800 20px var(--f-disp);color:#FFB15C}
.rg-mtd{margin:0 0 12px;font-size:13.5px;color:#c9d6ee;line-height:1.55}
.rg-mtg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.rg-mtg>div{background:rgba(255,255,255,.07);border-radius:12px;padding:9px 11px;min-width:0}
.rg-mtg span{display:block;font:600 9.5px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:#9fb3d9}
.rg-mtg b{display:block;font:600 13px/1.35 var(--f-disp);color:#fff;margin-top:2px}
.rg-mtr{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.rg-mtr li{display:grid;grid-template-columns:minmax(0,1fr) 44px;gap:8px;align-items:center;font-size:12.5px;color:#c9d6ee}
.rg-mtr li .bar{grid-column:1/-1;height:4px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden}
.rg-mtr li .bar i{display:block;height:100%;background:#0066FF;transform-origin:left;transition:transform .6s var(--ease-o)}
.rg-mtr li:first-child .bar i{background:#FF8A00}
.rg-mtr li em{font:700 11.5px var(--f-mono);font-style:normal;text-align:right;color:#fff}
.rg-mtf{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:14px}
.rg-mtlk{font:600 13px var(--f-disp);color:#9CC2FF}
.rg-mtlk:hover{color:#fff}

/* ---------- VS ---------- */
.rg-vt td:first-child{white-space:nowrap;font-weight:600}
.rg-vt td:first-child svg{display:inline-block;width:15px;height:15px;vertical-align:-2px;margin-right:6px;color:#0066FF}
.rg-vt tbody tr{opacity:0;transform:translateY(8px);transition:opacity .45s var(--ease-o),transform .45s var(--ease-o)}
.rg-vt.in tbody tr{opacity:1;transform:none}
.rg-vt td.hl{font-weight:600}

/* ---------- STEPS ---------- */
.rg-sts{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;position:relative}
.rg-sts:before{content:"";position:absolute;left:4%;right:4%;top:22px;height:3px;border-radius:3px;background:var(--line)}
.rg-sts:after{content:"";position:absolute;left:4%;right:4%;top:22px;height:3px;border-radius:3px;background:#0066FF;transform-origin:left;transform:scaleX(0);transition:transform 1.8s var(--ease-o)}
.rg-sts.in:after{transform:scaleX(1)}
.rg-sts li{position:relative;display:flex;flex-direction:column;gap:6px;opacity:0;transform:translateY(12px);transition:opacity .5s var(--ease-o),transform .5s var(--ease-o);transition-delay:calc(var(--i)*.22s)}
.rg-sts.in li{opacity:1;transform:none}
.rg-sts .n{width:46px;height:46px;border-radius:14px;background:var(--surface);border:2px solid #0066FF;color:#0066FF;display:grid;place-items:center;font:800 13px var(--f-mono);position:relative;z-index:1}
html[data-theme="dark"] .rg-sts .n{color:#9CC2FF}
.rg-sts li:last-child .n{background:#FF8A00;border-color:#FF8A00;color:#fff}
.rg-sts b{font:700 15px var(--f-disp);color:var(--ink)}
.rg-sts small{font-size:13px;color:var(--text);line-height:1.5}
.rg-sts em{align-self:flex-start;font:600 10.5px var(--f-mono);color:#0066FF;font-style:normal;background:var(--chip);border-radius:6px;padding:3px 7px}
html[data-theme="dark"] .rg-sts em{color:#9CC2FF}

/* ---------- RELATED ---------- */
.rg-xs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.rg-x{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;color:var(--ink);text-decoration:none;transition:transform .3s var(--ease-o),border-color .3s}
.rg-x:hover{transform:translateY(-3px);border-color:#0066FF;text-decoration:none}
.rg-x i{width:38px;height:38px;border-radius:11px;background:var(--chip);color:#0066FF;display:grid;place-items:center;flex-shrink:0}
html[data-theme="dark"] .rg-x i{color:#9CC2FF}
.rg-x i svg{width:18px;height:18px}
.rg-x>span{min-width:0;flex:1}
.rg-x small{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rg-x b{display:block;font:700 14px var(--f-disp)}
.rg-x em{font-style:normal;color:#0066FF;transition:transform .3s}
.rg-x:hover em{transform:translateX(4px)}

/* ---------- RESPONSIVE ---------- */
