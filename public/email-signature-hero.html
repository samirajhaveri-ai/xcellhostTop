.es-env{position:absolute;inset:0;overflow:hidden}
.es-env i{position:absolute;left:var(--x);bottom:0;width:46px;height:32px;border:1.5px solid rgba(127,176,255,.28);border-radius:6px;animation:esRise var(--s) linear infinite;animation-delay:var(--d)}
.es-env i:before{content:"";position:absolute;left:4px;right:4px;top:3px;height:16px;border-left:1.5px solid rgba(127,176,255,.28);border-bottom:1.5px solid rgba(127,176,255,.28);transform:skewY(0) rotate(-45deg) scale(.7);transform-origin:left top;width:20px;margin-left:1px}
.es-env i:nth-child(odd){border-color:rgba(255,138,0,.22)}
.hero.lh .hero-grid.es-hg{grid-template-columns:minmax(0,.86fr) minmax(0,1.14fr);gap:34px;align-items:center}
.es-copy{position:relative;z-index:3;min-width:0}
.es-hero .lh-title{color:#fff}
.hero.lh .es-stage{position:relative;z-index:3;display:flex;flex-direction:column;align-items:stretch;justify-items:stretch;gap:12px;padding:52px 0 6px;min-width:0;min-height:0}
.es-chip{max-width:270px;backdrop-filter:none!important;-webkit-backdrop-filter:none!important;background:rgba(11,19,43,.96)!important;z-index:7}
.es-chip b{display:block;font:700 12px var(--f-disp);color:#fff;white-space:nowrap}
.es-chip small{white-space:nowrap}
.es-chip.sw b,.es-chip.sw small{animation:esIn .55s var(--ease-o)}
#main .es-chO i{background:#FF8A00}
/* scene pills on top */
.es-dots{display:flex;gap:6px;align-items:stretch;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:5px}
.es-dots button[data-k]{position:relative;flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:6px;border:0;background:none;cursor:pointer;padding:8px 6px 10px;border-radius:10px;color:#9fb3d9;font:600 11.5px var(--f-disp);overflow:hidden;transition:background .3s,color .3s}
.es-dots button[data-k] em{font:700 9.5px var(--f-mono);font-style:normal;color:#7FB0FF;flex-shrink:0}
.es-dots button[data-k] span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.es-dots button[data-k] i{position:absolute;left:10px;right:10px;bottom:3px;height:3px;border-radius:2px;background:rgba(255,255,255,.12);overflow:hidden}
.es-dots button[data-k] i:after{content:"";position:absolute;inset:0;background:#FF8A00;transform-origin:left;transform:scaleX(var(--p,0))}
.es-dots button[data-k].past i:after{background:#0066FF;transform:scaleX(1)}
.es-dots button[data-k]:hover{color:#fff}
.es-dots button[data-k].on{background:#0066FF;color:#fff}
.es-dots button[data-k].on em{color:#fff}
.es-pz{flex-shrink:0;width:34px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);border-radius:10px;color:#fff;display:grid;place-items:center;cursor:pointer}
.es-pz svg{width:12px;height:12px}
.es-pz .pl,.es-pz.paused .pa{display:none}
.es-pz.paused .pl{display:block}
.es-body{display:grid;grid-template-columns:minmax(0,1fr) 140px;gap:12px;align-items:stretch}
.es-tilt{min-width:0}
.es-win{background:var(--es-card);border-radius:18px;box-shadow:0 40px 80px -30px rgba(0,0,0,.75),0 0 0 1px rgba(255,255,255,.1);overflow:hidden;color:var(--ink)}
.es-wh{display:flex;align-items:center;gap:10px;padding:9px 14px;background:#0B132B;color:#cfe0ff;border-bottom:1px solid rgba(255,255,255,.08)}
html[data-theme="dark"] .es-wh{background:#050B1A}
.es-tl{display:flex;gap:5px;flex-shrink:0}
.es-tl i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.22)}
.es-tl i:first-child{background:#FF8A00}.es-tl i:nth-child(2){background:#0066FF}
.es-wh b{min-width:0;font:600 12px var(--f-mono);color:#fff}
.es-wh b span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.es-wh b span.sw{animation:esIn .5s var(--ease-o)}
.es-live{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font:700 10px var(--f-mono);letter-spacing:.12em;color:#3DD47A;font-style:normal;flex-shrink:0}
.es-live i{width:7px;height:7px;border-radius:50%;background:#3DD47A;animation:esPulse 1.6s ease-in-out infinite}
.es-scr{position:relative;height:340px;background:var(--surface-2);overflow:hidden;touch-action:pan-y}
.es-cv{position:absolute;inset:0;width:100%;height:100%;display:block;opacity:0;transition:opacity .8s var(--ease-o)}
.es-cv.on{opacity:1}
.es-cap{position:absolute;left:10px;top:10px;display:inline-flex;align-items:center;gap:8px;background:var(--es-card);border:1px solid var(--line);border-radius:999px;padding:4px 12px 4px 4px;font:600 11.5px var(--f-disp);color:var(--ink);box-shadow:0 8px 18px -12px rgba(11,19,43,.4);max-width:calc(100% - 140px)}
.es-cap span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.es-cap b{font:700 10px var(--f-mono);background:#0066FF;color:#fff;border-radius:999px;padding:3px 7px;flex-shrink:0}
.es-cap.sw span{animation:esIn .6s var(--ease-o)}
.es-smp{position:absolute;right:10px;top:12px;font:600 9.5px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);background:var(--es-card);border:1px solid var(--line);border-radius:6px;padding:3px 7px}
.es-rail{display:flex;flex-direction:column;gap:10px;min-width:0}
.es-rc{flex:1;background:rgba(14,26,54,.92);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:12px;color:#fff;box-shadow:0 20px 40px -22px rgba(0,0,0,.9);min-width:0;display:flex;flex-direction:column;justify-content:center}
.es-rc small{display:block;font:600 9.5px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:#9fb3d9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.es-rc b{display:block;font:800 21px var(--f-disp);color:#fff;font-variant-numeric:tabular-nums;margin:3px 0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.es-rc b.bump{animation:esBump .5s var(--ease-o)}
.es-rc u{display:block;height:4px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden;text-decoration:none}
.es-rc u i{display:block;height:100%;background:#0066FF;transform-origin:left;transform:scaleX(0);transition:transform .5s var(--ease-o)}
.es-rc.o u i{background:#FF8A00}
.es-foot{display:grid;grid-template-columns:minmax(0,1fr) 190px;gap:12px}
.es-pw.lh-powered{position:relative;left:auto;bottom:auto;margin:0;background:#0B132B;max-width:none;min-width:0;display:flex;flex-direction:column;justify-content:center;border-radius:14px}
.es-pw.lh-powered>span{font-size:14px;line-height:1.25;align-items:center}
.es-pw em{display:block;font:500 9.5px/1.4 var(--f-mono);color:#9fb6de;font-style:normal;margin-top:4px}
.es-tile{width:26px;height:26px;border-radius:8px;background:#FF8A00;color:#fff;display:grid;place-items:center;flex-shrink:0;font:800 14px/1 var(--f-disp)}
.es-log{overflow:hidden;position:relative;z-index:5;background:#0B132B;border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:10px 12px;color:#fff;box-shadow:0 24px 50px -20px rgba(0,0,0,.85);min-width:0}
.es-logh{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:7px}
.es-logh span{display:flex;align-items:center;gap:6px;font:700 9.5px var(--f-mono);letter-spacing:.1em;min-width:0}
.es-logh span b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.es-logh span i{width:7px;height:7px;border-radius:50%;background:#FF8A00;flex-shrink:0;animation:esBlink 1.4s steps(1) infinite}
.es-logh em{font:500 9px var(--f-mono);color:#9fb3d9;font-style:normal}
.es-log ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px 14px;min-height:62px;align-content:start}
.es-log li{font:500 10px/1.35 var(--f-mono);color:#8a9bbd;border-left:2px solid rgba(127,176,255,.3);padding-left:7px;overflow-wrap:anywhere;min-width:0}
.es-log li b{font-weight:700;color:#7FB0FF;margin-right:5px}
.es-log li.go{color:#fff;border-left-color:#FF8A00}.es-log li.go b{color:#FFB15C}
.es-log li.ok{color:#d6e2f5;border-left-color:#3DD47A}.es-log li.ok b{color:#5FE08D}
.es-log li.bad{color:#fff;border-left-color:#FF6B5B}.es-log li.bad b{color:#FF8F82}
.es-log li.nw{animation:esIn .45s var(--ease-o) both}

/* proof + sub-nav */
.es-proof b{color:var(--ink)}
.es-sub{position:sticky;top:var(--es-hh);z-index:60;background:rgba(255,255,255,.97);border-bottom:1px solid var(--line);box-shadow:0 8px 20px -18px rgba(11,19,43,.5)}
html[data-theme="dark"] .es-sub{background:rgba(6,18,42,.95)}
.es-subt{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.es-subt::-webkit-scrollbar{display:none}
.es-subt a{position:relative;flex-shrink:0;font:600 12.5px var(--f-disp);color:var(--muted);padding:12px 12px 11px;transition:color .2s}
.es-subt a:after{content:"";position:absolute;left:12px;right:12px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:#FF8A00;transform:scaleX(0);transition:transform .3s var(--ease-o)}
.es-subt a:hover{color:var(--ink);text-decoration:none}
.es-subt a.on{color:var(--ink)}
.es-subt a.on:after{transform:scaleX(1)}

/* ---------- OVERVIEW ---------- */
.es-ovg{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:40px;align-items:center}
.es-ov .pp-ov{font-size:15.5px;line-height:1.7;color:var(--text);margin:0 0 14px}
.es-works{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:18px}
.es-works .pl{font:700 10.5px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-right:4px}
.es-works span:not(.pl){display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font:600 12.5px var(--f-disp);color:var(--ink)}
.es-works svg{width:14px;height:14px;color:#0066FF}
html[data-theme="dark"] .es-works svg{color:#9CC2FF}
.es-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:34px}
.es-stats div{background:var(--surface-2);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.es-stats b{display:block;font:800 26px var(--f-disp);color:var(--ink)}
.es-stats span{font-size:12.5px;color:var(--muted)}
/* device illustration */
.es-dev{position:relative;height:380px}
.es-mh{display:flex;align-items:center;gap:4px;padding:7px 10px;background:#0B132B;color:#fff}
.es-mh i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.3)}
.es-mh b{font:600 10px var(--f-mono);margin-left:6px;white-space:nowrap}
.es-mb{padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.es-mb p{height:6px;border-radius:3px;background:var(--line);margin:0}
.es-mb .l1{width:70%}.es-mb .l2{width:88%}.es-mb .l3{width:52%}
.es-sg{display:flex;gap:9px;align-items:center;margin-top:8px;padding-top:9px;border-top:1px solid var(--line)}
.es-sg .lg{width:30px;height:30px;border-radius:8px;background:#0066FF;color:#fff;display:grid;place-items:center;font:800 14px var(--f-disp);flex-shrink:0}
.es-sg .tx{min-width:0;display:flex;flex-direction:column}
.es-sg b{font:700 11.5px var(--f-disp);color:var(--ink);white-space:nowrap}
.es-sg small{font-size:9.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.es-sg small.c{color:#0066FF}
.es-bn{margin-top:6px;border-radius:7px;background:#0B132B;color:#fff;padding:7px 10px;font:600 9.5px var(--f-disp);position:relative;overflow:hidden}
.es-bn span{position:relative;z-index:1}
.es-bn:after{content:"";position:absolute;right:-10px;top:-10px;width:44px;height:44px;border-radius:50%;background:#FF8A00;opacity:.9}
.es-lap{position:absolute;left:0;top:20px;width:76%}
.es-lsc{background:var(--es-card);border:8px solid #0B132B;border-bottom-width:10px;border-radius:14px 14px 0 0;overflow:hidden;box-shadow:0 30px 60px -30px rgba(11,19,43,.55)}
.es-lbase{height:12px;background:#1d2a4d;border-radius:0 0 12px 12px;margin:0 -5%;width:110%}
.es-ph{position:absolute;right:0;top:110px;width:34%;max-width:170px;background:#0B132B;border-radius:24px;padding:8px;box-shadow:0 30px 60px -24px rgba(11,19,43,.7);animation:esFloat 7s ease-in-out infinite}
.es-pn{width:40%;height:5px;border-radius:3px;background:rgba(255,255,255,.25);margin:2px auto 7px}
.es-psc{background:var(--es-card);border-radius:16px;overflow:hidden}
.es-psc .es-mh{background:#0066FF}
.es-psc .es-sg small{font-size:9px}
.es-web{position:absolute;left:14%;bottom:0;width:58%;background:var(--es-card);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 24px 50px -26px rgba(11,19,43,.6);animation:esFloat 8s ease-in-out -3s infinite}
.es-web .es-mh{background:#1d2a4d}
.es-sync{position:absolute;right:4%;top:6px;display:inline-flex;align-items:center;gap:7px;background:#FF8A00;color:#fff;border-radius:999px;padding:6px 12px;font:700 11px var(--f-disp);box-shadow:0 12px 24px -12px rgba(255,138,0,.8)}
.es-sync i{display:grid}.es-sync svg{width:13px;height:13px;animation:esSpin 3s linear infinite}
.es-dev .es-sg,.es-dev .es-bn{animation:esGlow 6s ease-in-out infinite}
.es-ph .es-sg,.es-ph .es-bn{animation-delay:.4s}.es-web .es-sg,.es-web .es-bn{animation-delay:.8s}
@keyframes esFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes esSpin{to{transform:rotate(360deg)}}
@keyframes esGlow{0%,70%,100%{box-shadow:none}80%{box-shadow:0 0 0 3px rgba(0,102,255,.25)}}
html[data-theme="dark"] .es-lsc,html[data-theme="dark"] .es-ph{border-color:#1d2a4d}

/* ---------- CAPABILITIES ---------- */
.es-cx{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.4fr);gap:20px;align-items:stretch}
.es-cxl{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-content:start}
.es-cxl button{display:flex;align-items:center;gap:10px;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;color:var(--ink);transition:border-color .25s,transform .25s var(--ease-o),background .25s;min-width:0}
.es-cxl button:hover{border-color:var(--line-2);transform:translateY(-2px)}
.es-cxl button.on{border-color:#0066FF;background:var(--es-bs)}
.es-cxl button i{width:34px;height:34px;border-radius:10px;background:var(--chip);color:#0066FF;display:grid;place-items:center;flex-shrink:0}
.es-cxl button.on i{background:#0066FF;color:#fff}
html[data-theme="dark"] .es-cxl button i{color:#9CC2FF}
html[data-theme="dark"] .es-cxl button.on i{color:#fff}
.es-cxl button i svg{width:16px;height:16px}
.es-cxl button span{min-width:0}
.es-cxl b{display:block;font:700 13px var(--f-disp)}
.es-cxl small{display:block;font-size:11.5px;color:var(--muted)}
.es-cxd{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto auto auto 1fr auto;column-gap:22px}
.es-cxd>.es-k,.es-cxd>h3,.es-cxd>p,.es-cxd>ul,.es-cxd>a{grid-column:1}
.es-cxd h3{margin:4px 0 8px;font:700 21px var(--f-disp);color:var(--ink)}
.es-cxd h3.sw,.es-cxd p.sw{animation:esIn .45s var(--ease-o)}
.es-cxd p{font-size:14px;line-height:1.6;color:var(--text);margin:0 0 12px}
.es-cxu{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.es-cxu li{display:flex;gap:8px;font-size:13px;color:var(--text);align-items:flex-start;animation:esIn .4s var(--ease-o) both}
.es-cxu li svg{width:15px;height:15px;color:#16a34a;flex-shrink:0;margin-top:2px}
.es-cxa{align-self:end;margin-top:14px;font:700 13px var(--f-disp);color:#FF8A00}
.es-cxv{grid-column:2;grid-row:1/6;background:var(--surface-2);border:1px solid var(--line);border-radius:16px;padding:14px;min-height:260px;display:flex;flex-direction:column;gap:8px;overflow:hidden;position:relative}
.cv-h{display:flex;justify-content:space-between;align-items:center;font:700 10px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.cv-h em{font-style:normal;color:#0066FF}
html[data-theme="dark"] .cv-h em{color:#9CC2FF}
.cv-r{display:flex;align-items:center;gap:8px;background:var(--es-card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12px;color:var(--ink);animation:esIn .5s var(--ease-o) both;min-width:0}
.cv-r span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cv-r code{font:600 11px var(--f-mono);color:#0066FF;background:var(--es-bs);border-radius:5px;padding:2px 6px;white-space:nowrap}
html[data-theme="dark"] .cv-r code{color:#9CC2FF}
.cv-r b{font:700 11px var(--f-mono);white-space:nowrap}
.cv-r .g{color:#16a34a}.cv-r .o{color:var(--es-ot)}
.cv-t{font:700 9.5px var(--f-mono);border-radius:5px;padding:3px 6px;background:#0066FF;color:#fff;white-space:nowrap}
.cv-t.o{background:#FF8A00}.cv-t.n{background:#0B132B}
html[data-theme="dark"] .cv-t.n{background:#2C3D68}
.cv-bars{display:flex;align-items:flex-end;gap:8px;height:120px;padding:8px 4px 0;border-bottom:1px solid var(--line)}
.cv-bars i{flex:1;background:#0066FF;border-radius:5px 5px 0 0;transform-origin:bottom;animation:esGrow .8s var(--ease-o) both}
.cv-bars i:nth-child(3n){background:#FF8A00}
@keyframes esGrow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.cv-sig{background:var(--es-card);border:1px solid var(--line);border-radius:12px;padding:12px}
.cv-sig .es-sg{margin:0;padding:0;border:0}

/* ---------- HOW ---------- */
.es-mode{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.es-mnote{font:600 12.5px var(--f-mono);color:var(--muted)}
.es-hw{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:22px;align-items:center}
.es-flow{width:100%;height:auto;display:block;background:var(--surface-2);border:1px solid var(--line);border-radius:20px;padding:10px;overflow:visible}
.hw-n>rect{fill:var(--es-card);stroke:var(--line);stroke-width:1.5}
.hw-n.m>rect{stroke:#0066FF}
.hw-n.x>rect{fill:#0B132B;stroke:#0B132B}
.hw-n.x .t{fill:#fff}.hw-n.x .s{fill:#c9d6ee}
.hw-n.x .d{fill:rgba(255,255,255,.08);stroke:rgba(255,255,255,.2)}
.hw-n .d{fill:var(--surface-2);stroke:var(--line);stroke-width:1}
.hw-n .d.o{fill:rgba(255,138,0,.12);stroke:#FF8A00}
.es-flow text{font-family:var(--f-disp);text-anchor:middle}
.es-flow .t{font-size:13px;font-weight:700;fill:var(--ink)}
.es-flow .s{font-size:10.5px;fill:var(--muted);font-family:var(--f-mono)}
.es-flow .s.b{fill:var(--ink);font-weight:700}
.es-flow .env{fill:none;stroke:#0066FF;stroke-width:1.5}
.hw-l{fill:none;stroke:#0066FF;stroke-width:2;stroke-dasharray:6 6;animation:esDash 1.2s linear infinite;transition:opacity .4s}
@keyframes esDash{to{stroke-dashoffset:-24}}
.hw-l.cli{opacity:.12}.cli-t{opacity:0}
.es-hw.cli .hw-l.srv{opacity:.12}
.es-hw.cli .hw-l.cli,.es-hw.cli .cli-t{opacity:1}
.cli-t{fill:var(--es-ot)!important;font-weight:600;transition:opacity .4s}
.hw-pk{fill:#FF8A00;stroke:#fff;stroke-width:2}
.es-hwc{display:flex;flex-direction:column;gap:6px}
.es-hwp b{display:flex;align-items:center;gap:8px;font:700 18px var(--f-disp);color:var(--ink);margin-bottom:10px}
.es-hwp b svg{width:20px;height:20px;color:#0066FF}
.es-hwp{animation:esIn .45s var(--ease-o)}

/* ---------- USE CASES ---------- */
.es-ucg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.es-u{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:8px;transition:transform .3s var(--ease-o),border-color .3s,box-shadow .3s;overflow:hidden}
.es-u:hover{transform:translateY(-4px);border-color:#0066FF;box-shadow:var(--sh-s)}
.es-u i{width:40px;height:40px;border-radius:12px;background:#0066FF;color:#fff;display:grid;place-items:center}
.es-u i.o{background:#FF8A00}.es-u i.n{background:#0B132B}
html[data-theme="dark"] .es-u i.n{background:#2C3D68}
.es-u i svg{width:18px;height:18px}
.es-u b{font:700 15px var(--f-disp);color:var(--ink)}
.es-u p{font-size:13px;line-height:1.55;color:var(--text);margin:0;flex:1}
.es-ut{align-self:flex-start;font:700 10px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:#0066FF;background:var(--chip);border-radius:6px;padding:4px 8px}
html[data-theme="dark"] .es-ut{color:#9CC2FF}

/* ---------- DELIVERY ---------- */
.es-dlg{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:34px;align-items:center}
.es-dli{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.es-d{display:flex;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;transition:border-color .3s}
.es-d:hover{border-color:#0066FF}
.es-d i{width:36px;height:36px;border-radius:10px;background:var(--chip);color:#0066FF;display:grid;place-items:center;flex-shrink:0}
.es-d i.o{color:var(--es-ot)}.es-d i.n{color:var(--ink)}
html[data-theme="dark"] .es-d i{color:#9CC2FF}
.es-d i svg{width:17px;height:17px}
.es-d b{display:block;font:700 14px var(--f-disp);color:var(--ink);margin-bottom:3px}
.es-d p{font-size:12.5px;line-height:1.5;color:var(--text);margin:0}
.es-roll{background:#0B132B;border-radius:22px;padding:22px;color:#fff;box-shadow:0 30px 60px -30px rgba(11,19,43,.8)}
html[data-theme="dark"] .es-roll{background:#0E1A36;border:1px solid var(--line)}
.es-rh{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.es-rh b{font:700 12px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:#9fb3d9}
.es-rh em{font:800 26px var(--f-disp);font-style:normal;color:#fff;font-variant-numeric:tabular-nums}
.es-rg{display:grid;grid-template-columns:repeat(16,minmax(0,1fr));gap:4px}
.es-rg i{aspect-ratio:1;border-radius:3px;background:rgba(255,255,255,.08);transition:background .4s,transform .4s var(--ease-o)}
.es-rg i.p{background:#FF8A00}.es-rg i.s{background:#0066FF}.es-rg i.o{background:#5FA0FF}.es-rg i.f{background:#3DD47A}
.es-rg i.nw{transform:scale(1.25)}
.es-rk{display:flex;flex-wrap:wrap;gap:12px;margin:14px 0 10px;font-size:11.5px;color:#c9d6ee}
.es-rk span{display:inline-flex;align-items:center;gap:6px}
.es-rk i{width:10px;height:10px;border-radius:3px}
.es-rk i.p{background:#FF8A00}.es-rk i.s{background:#0066FF}.es-rk i.o{background:#5FA0FF}.es-rk i.f{background:#3DD47A}
.es-rbar{height:6px;border-radius:4px;background:rgba(255,255,255,.1);overflow:hidden;margin-bottom:10px}
.es-rbar i{display:block;height:100%;background:#FF8A00;transform-origin:left;transform:scaleX(0)}
.es-roll small{font-size:11.5px;color:#9fb3d9}

/* ---------- INDIA COMPLIANCE ---------- */
.es-ing{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px;align-items:start}
.es-inr{display:grid;gap:14px}
.es-law{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px}
.es-law.hi{background:#0B132B;border-color:#0B132B;color:#fff}
html[data-theme="dark"] .es-law.hi{background:#0E1A36;border-color:var(--line)}
.es-law.hi h3{color:#fff}
.es-law.hi p{color:#c9d6ee}
.es-law.sm{padding:18px 20px}
.es-lb{display:inline-block;font:700 10.5px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:#fff;background:#FF8A00;border-radius:6px;padding:4px 9px}
.es-law.sm .es-lb{background:var(--chip);color:var(--es-ot)}
.es-law h3{margin:10px 0 10px;font:700 18px var(--f-disp);color:var(--ink)}
.es-law p{font-size:13.5px;line-height:1.6;color:var(--text);margin:0}
.es-lf{list-style:none;margin:0 0 16px;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.es-lf li{display:grid;grid-template-columns:30px minmax(0,1fr);column-gap:10px;align-items:center;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:10px;opacity:.35;transform:translateX(-6px);transition:opacity .5s var(--ease-o),transform .5s var(--ease-o),border-color .4s}
.es-lf li.on{opacity:1;transform:none;border-color:rgba(61,212,122,.5)}
.es-lf i{grid-row:span 2;width:30px;height:30px;border-radius:9px;background:#0066FF;display:grid;place-items:center}
.es-lf i svg{width:15px;height:15px;color:#fff}
.es-lf b{font:700 12.5px var(--f-disp);color:#fff}
.es-lf small{font-size:11px;color:#9fb3d9}

/* ---------- PLANS ---------- */
.es-plg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;align-items:stretch}
.es-plc{position:relative;background:var(--surface);border:1.5px solid var(--line);border-radius:20px;padding:24px 22px;display:flex;flex-direction:column;gap:10px;transition:transform .35s var(--ease-o),box-shadow .35s,border-color .3s}
.es-plc:hover{transform:translateY(-6px);box-shadow:var(--sh)}
.es-plc.pop{background:#0B132B;border-color:#0B132B;box-shadow:0 30px 60px -34px rgba(11,19,43,.8)}
html[data-theme="dark"] .es-plc.pop{background:#0E1A36;border-color:#0066FF}
.es-plc.pop h3,.es-plc.pop .es-pr b{color:#fff}
.es-plc.pop .es-pr small{color:#9fb3d9}
.es-plc.pop li{color:#c9d6ee}
.es-plc.pop li svg{color:#FFB15C}
.es-plc.pop .es-pt{color:#FFB15C}
.es-flag{position:absolute;top:-12px;right:18px;background:#FF8A00;color:#fff;font:700 10.5px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;border-radius:999px;padding:5px 11px}
.es-pt{font:700 10.5px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--es-ot)}
.es-plc h3{margin:0;font:700 20px var(--f-disp);color:var(--ink)}
.es-pr{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.es-pr b{font:800 34px var(--f-disp);color:var(--ink);letter-spacing:-.01em}
.es-pr small{font-size:12.5px;color:var(--muted)}
.es-plc ul{list-style:none;margin:6px 0 10px;padding:0;display:flex;flex-direction:column;gap:8px;flex:1}
.es-plc li{display:flex;gap:9px;align-items:flex-start;font-size:13.5px;color:var(--text);line-height:1.4}
.es-plc li svg{width:16px;height:16px;color:#0066FF;flex-shrink:0;margin-top:1px}
html[data-theme="dark"] .es-plc li svg{color:#9CC2FF}
.es-plc .btn{justify-content:center}
.es-svc{margin-top:18px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.es-svc div{background:var(--surface);border:1px dashed var(--line-2);border-radius:14px;padding:12px 14px}
.es-svc b{display:block;font:800 18px var(--f-disp);color:var(--ink)}
.es-svc span{font-size:12px;color:var(--text);line-height:1.45}

/* ---------- CONFIGURE ---------- */
.es-cfw{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px;align-items:start}
.es-cfw>*{min-width:0}
.es-cfi{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px;display:flex;flex-direction:column;gap:18px}
.es-cfi .seg,.es-bdi .seg{flex-wrap:wrap}
.es-ur{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.es-ur .rng{flex:1;min-width:160px}
.es-adds{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.es-adds label{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;transition:border-color .2s,background .2s;min-width:0;flex-wrap:wrap}
.es-adds label:hover{border-color:var(--line-2)}
.es-adds label.ck{border-color:#0066FF;background:var(--es-bs)}
.es-adds input[type=checkbox]{width:17px;height:17px;accent-color:#0066FF;flex-shrink:0}
.es-ab{flex:1;min-width:160px}
.es-ab b{display:flex;align-items:center;gap:7px;font:600 13px var(--f-disp);color:var(--ink)}
.es-ab b svg{width:15px;height:15px;color:#0066FF;flex-shrink:0}
html[data-theme="dark"] .es-ab b svg{color:#9CC2FF}
.es-ab small{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}
.stp.sm button{width:30px;height:30px}
.stp.sm input{width:46px;height:30px}
.es-cfo{position:sticky;top:calc(var(--es-hh) + 60px)}
.es-cfs{background:#0B132B;color:#fff;border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:10px;box-shadow:0 30px 60px -30px rgba(11,19,43,.8)}
html[data-theme="dark"] .es-cfs{background:#0E1A36;border:1px solid var(--line)}
.es-cfk{font:700 10.5px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:#FFB15C}
.es-cfs h3{margin:0;font:700 19px var(--f-disp);color:#fff}
.es-cfl{list-style:none;margin:0;padding:10px 0 0;display:flex;flex-direction:column;gap:6px;border-top:1px solid rgba(255,255,255,.12)}
.es-cfl li{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:#c9d6ee;animation:esIn .35s var(--ease-o)}
.es-cfl li span{min-width:0}
.es-cfl li b{color:#fff;font-weight:600;white-space:nowrap}
.es-cft{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
.es-cft div{background:rgba(255,255,255,.06);border-radius:10px;padding:9px 11px}
.es-cft span{display:block;font:600 10px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:#9fb3d9}
.es-cft b{font:800 17px var(--f-disp);color:#fff}
.es-cfr{display:flex;justify-content:space-between;font-size:13px;color:#c9d6ee}
.es-cfr b{color:#fff;font-variant-numeric:tabular-nums}
.es-cfr.t{border-top:1px solid rgba(255,255,255,.14);padding-top:10px;font-weight:700;color:#fff}
.es-cfr.t b{font:800 24px var(--f-disp);color:#fff}
.es-cfr.t b.bump{animation:esBump .5s var(--ease-o)}
.es-cfb{display:grid;gap:8px;margin-top:6px}
.es-cfb .btn{justify-content:center}
.es-cff{font-size:11px;color:#9fb3d9;line-height:1.5}

/* ---------- BUILDER ---------- */
.es-bdw{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:20px;align-items:start}
.es-bdw>*{min-width:0}
.es-bdi{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:14px;margin:0}
.es-b2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.es-bdi .fld{margin:0}
.es-bdi input[type=text]{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;font:500 13.5px var(--f-body);background:var(--surface-2);color:var(--ink);transition:border-color .2s;min-width:0}
.es-bdi input[type=text]:focus{outline:none;border-color:#0066FF}
.es-bdi label,.es-bdi .lb{display:block;font:600 12px var(--f-disp);color:var(--ink);margin-bottom:6px}
.es-sw{display:flex;gap:8px}
.es-sw button{width:30px;height:30px;border-radius:50%;background:var(--c);border:3px solid var(--surface);box-shadow:0 0 0 1.5px var(--line-2);cursor:pointer}
.es-sw button.on{box-shadow:0 0 0 2.5px #0066FF}
.es-bdo{display:flex;flex-direction:column;gap:12px;position:sticky;top:calc(var(--es-hh) + 60px)}
.es-bdm{background:var(--es-card);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--sh-s)}
.es-bdh{display:flex;align-items:center;gap:10px;padding:8px 12px;background:#0B132B;color:#fff}
.es-bdh>b{font:600 12px var(--f-mono);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.es-pv{flex-wrap:nowrap}
.es-pv button{padding:5px 9px;font-size:11px;display:inline-flex;gap:5px;align-items:center;background:rgba(255,255,255,.08);color:#c9d6ee;border-color:rgba(255,255,255,.2)}
.es-pv button svg{width:13px;height:13px}
.es-bdmeta{display:flex;flex-wrap:wrap;gap:4px 18px;padding:10px 16px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--ink)}
.es-bdmeta em{font-style:normal;color:var(--muted);margin-right:6px}
.es-bdbody{padding:16px 18px 20px;font-size:13.5px;color:#0B132B;background:#fff;transition:max-width .4s var(--ease-o);margin:0 auto;width:100%}
.es-bdbody p{margin:0 0 10px}
.es-bdbody.mob{max-width:340px;border-left:1px solid var(--line);border-right:1px solid var(--line)}
.es-prev{margin-top:8px;overflow-x:auto}
.es-bdc{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.es-bdn{font:600 12px var(--f-mono);color:var(--muted)}
.es-bdn.ok{color:#16a34a}
.es-bdsrc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.es-bdsrc summary{cursor:pointer;font:600 13px var(--f-disp);color:var(--ink)}
.es-bdsrc pre{margin:10px 0 0;max-height:220px;overflow:auto;font:500 11px/1.5 var(--f-mono);color:var(--text);white-space:pre-wrap;word-break:break-all}

/* ---------- CALCULATOR ---------- */
.es-ccw{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:20px;align-items:start}
.es-ccw>*{min-width:0}
.es-cci{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:18px}
.es-cci label{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;font:600 13px var(--f-disp);color:var(--ink);margin-bottom:6px}
.es-cci label small{color:var(--muted);font-weight:500}
.es-cci label b{margin-left:auto;font:800 15px var(--f-mono);color:#0066FF}
html[data-theme="dark"] .es-cci label b{color:#9CC2FF}
.es-cci .rng{width:100%}
.es-cco{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:14px}
.es-ccp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.es-ccp div{background:var(--surface-2);border:1.5px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.es-ccp div.pop{border-color:#0066FF;background:var(--es-bs)}
.es-ccp span{font:700 10.5px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.es-ccp b{font:800 20px var(--f-disp);color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.es-ccp small{font-size:11px;color:var(--muted)}
.es-ccp em{font:600 11px var(--f-mono);font-style:normal;color:var(--es-ot);margin-top:4px}
.es-ccp u{display:block;height:5px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:8px;text-decoration:none}
.es-ccp u i{display:block;height:100%;background:#0066FF;transform-origin:left;transition:transform .6s var(--ease-o)}
.es-ccd{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.es-ccd div{background:#0B132B;color:#fff;border-radius:14px;padding:12px 14px;min-width:0}
html[data-theme="dark"] .es-ccd div{background:#0E1A36;border:1px solid var(--line)}
.es-ccd div.o{background:#FF8A00}
html[data-theme="dark"] .es-ccd div.o{background:#B85F00;border-color:#B85F00}
.es-ccd span{display:block;font:600 10px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:#c9d6ee}
.es-ccd div.o span{color:#fff}
.es-ccd b{font:800 19px var(--f-disp);font-variant-numeric:tabular-nums;white-space:nowrap}
.es-ccn{font-size:13.5px;line-height:1.55;color:var(--text);margin:0}

/* ---------- VS / STEPS / RELATED ---------- */
.es-vsr{display:flex;flex-direction:column;gap:8px}
.es-vh,.es-v{display:grid;grid-template-columns:minmax(0,1fr) repeat(3,minmax(0,1fr));gap:10px;align-items:center}
.es-vh span{font:700 10.5px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:0 14px}
.es-vh span.hl{color:#0066FF}
html[data-theme="dark"] .es-vh span.hl{color:#8DB8FF}
.es-v{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px;transition:border-color .3s,transform .3s var(--ease-o)}
.es-v:hover{border-color:#0066FF;transform:translateY(-2px)}
.es-v b{display:flex;align-items:center;gap:7px;font:700 13.5px var(--f-disp);color:var(--ink);padding:8px}
.es-v b svg{width:15px;height:15px;color:#0066FF;flex-shrink:0}
html[data-theme="dark"] .es-v b svg{color:#9CC2FF}
.es-v span{font-size:13px;color:var(--text);padding:8px;line-height:1.45}
.es-v span.hl{background:var(--es-bs);border-radius:10px;color:var(--ink);font-weight:600}
.es-stp{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;position:relative}
.es-stp li{display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;opacity:.35;transform:translateY(8px);transition:opacity .5s var(--ease-o),transform .5s var(--ease-o),border-color .3s}
.es-stp li.on{opacity:1;transform:none}
.es-stp li:hover{border-color:#0066FF}
.es-stp .n{width:40px;height:40px;border-radius:50%;background:var(--surface-2);color:var(--muted);display:grid;place-items:center;font:800 13px var(--f-mono);transition:background .4s,color .4s}
.es-stp li.on .n{background:#0066FF;color:#fff}
.es-stp li.on:nth-child(even) .n{background:#FF8A00}
.es-stp b{display:block;font:700 15px var(--f-disp);color:var(--ink)}
.es-stp small{display:block;font-size:12.5px;color:var(--text);margin-top:3px;line-height:1.45}
.es-stp em{margin-top:auto;align-self:flex-start;font:600 10.5px var(--f-mono);color:#0066FF;font-style:normal;background:var(--chip);border-radius:6px;padding:3px 7px}
html[data-theme="dark"] .es-stp em{color:#9CC2FF}
.es-xs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.es-x{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 14px;color:var(--ink);transition:transform .3s var(--ease-o),border-color .3s,box-shadow .3s}
.es-x:hover{transform:translateY(-3px);border-color:#0066FF;text-decoration:none;box-shadow:var(--sh-s)}
.es-x i{width:36px;height:36px;border-radius:10px;background:var(--chip);color:#0066FF;display:grid;place-items:center;flex-shrink:0}
html[data-theme="dark"] .es-x i{color:#9CC2FF}
.es-x i svg{width:17px;height:17px}
.es-x span{flex:1;min-width:0}
.es-x small{display:block;font-size:11.5px;color:var(--muted)}
.es-x b{display:block;font:700 13.5px var(--f-disp)}
.es-x em{font-style:normal;color:#FF8A00;font-weight:700;transition:transform .3s var(--ease-o)}
.es-x:hover em{transform:translateX(4px)}

/* ---------- RESPONSIVE ---------- */
@media(max-width:1180px){
  .hero.lh .hero-grid.es-hg{grid-template-columns:minmax(0,1fr)}
  .hero.lh .es-stage{max-width:820px;width:100%;margin:0 auto}
  .es-ucg,.es-xs{grid-template-columns:repeat(3,minmax(0,1fr))}
  .es-svc{grid-template-columns:repeat(3,minmax(0,1fr))}
  .es-stp{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media(max-width:960px){
  .es-ovg,.es-cx,.es-hw,.es-dlg,.es-ing,.es-cfw,.es-bdw,.es-ccw{grid-template-columns:minmax(0,1fr)}
  .es-cfo,.es-bdo{position:static}
