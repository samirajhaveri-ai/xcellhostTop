.il-tensor i:nth-child(5n){animation-delay:-1.2s}.il-tensor i:nth-child(5n+1){animation-delay:-2.4s}.il-tensor i:nth-child(5n+2){animation-delay:-3.6s}.il-tensor i:nth-child(5n+3){animation-delay:-4.8s}
.il-tensor i:nth-child(7n){background:rgba(255,138,0,.22);border-color:rgba(255,138,0,.3)}
@keyframes ilHeat{0%,100%{opacity:.25}50%{opacity:1}}
/* drifting code glyphs */
.il-glyphs{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.il-glyphs span{position:absolute;left:var(--x);bottom:-30px;font:500 12px var(--f-mono);color:rgba(127,176,255,.38);white-space:nowrap;animation:ilRise var(--s) linear infinite;animation-delay:var(--d);will-change:transform,opacity}
.il-glyphs span:nth-child(3n){color:rgba(255,177,92,.4)}
@keyframes ilRise{0%{transform:translateY(0);opacity:0}12%{opacity:1}85%{opacity:.6}100%{transform:translateY(-760px);opacity:0}}
.hero.lh .hero-grid.il-hg{grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:34px;align-items:center}
.il-copy{position:relative;z-index:3;min-width:0}
.il-hero .lh-title{color:#fff}
.il-stage{position:relative;z-index:3;display:flex;flex-direction:column;gap:12px;min-height:0;padding:34px 0 8px;min-width:0}
.il-stage>.lh-tilt{width:100%;min-width:0}
.il-stage .lh-orbit{opacity:.4}
.il-chip{max-width:260px;backdrop-filter:none!important;-webkit-backdrop-filter:none!important;background:rgba(11,19,43,.96)!important;z-index:7}
.il-chip b{display:block;font:700 12px var(--f-disp);color:#fff;white-space:nowrap}
.il-chip small{white-space:nowrap}
.il-chip.sw b,.il-chip.sw small{animation:ilIn .55s var(--ease-o)}
#main .il-chO i{background:#FF8A00}
/* browser-IDE window */
.il-win{background:var(--il-card);border-radius:16px;box-shadow:0 40px 80px -30px rgba(0,0,0,.75),0 0 0 1px rgba(255,255,255,.1);overflow:hidden;color:var(--ink)}
.il-wb{display:flex;align-items:center;gap:10px;padding:8px 12px;background:#0B132B;color:#fff;border-bottom:1px solid rgba(255,255,255,.08)}
html[data-theme="dark"] .il-wb{background:#050B1C}
.il-tl{display:flex;gap:5px;flex-shrink:0}
.il-tl i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.25)}
.il-tl i:first-child{background:#c0392b}.il-tl i:nth-child(2){background:#FF8A00}.il-tl i:nth-child(3){background:#16a34a}
.il-tab{display:flex;align-items:center;gap:7px;min-width:0;background:rgba(255,255,255,.08);border-radius:8px 8px 0 0;padding:5px 10px;font:600 11.5px var(--f-mono);color:#fff}
.il-tab>span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.il-tab>span:last-child.sw{animation:ilIn .5s var(--ease-o)}
.il-tg{width:18px;height:18px;border-radius:5px;background:#0066FF;display:grid;place-items:center;flex-shrink:0}
.il-tg svg{width:11px;height:11px}
.il-url{display:flex;align-items:center;gap:5px;margin-left:auto;font:500 10.5px var(--f-mono);color:#9fb3d9;background:rgba(255,255,255,.06);border-radius:999px;padding:3px 10px;white-space:nowrap}
.il-url svg{width:10px;height:10px;color:#5FE08D}
.il-live{display:inline-flex;align-items:center;gap:6px;font:700 10px var(--f-mono);letter-spacing:.12em;color:#5FE08D;font-style:normal;flex-shrink:0}
.il-live i{width:7px;height:7px;border-radius:50%;background:#16a34a;animation:ilPulse 1.6s ease-in-out infinite}
.il-scr{position:relative;height:350px;background:var(--surface-2);overflow:hidden;touch-action:pan-y}
.il-cv{position:absolute;inset:0;width:100%;height:100%;display:block;opacity:0;transition:opacity .8s var(--ease-o)}
.il-cv.on{opacity:1}
.il-cap{position:absolute;left:10px;bottom:10px;display:inline-flex;align-items:center;gap:8px;background:var(--il-card);border:1px solid var(--line);border-radius:999px;padding:4px 12px 4px 4px;font:600 11.5px var(--f-disp);color:var(--ink);box-shadow:0 8px 18px -12px rgba(11,19,43,.4);max-width:calc(100% - 120px)}
.il-cap span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.il-cap b{font:700 10px var(--f-mono);background:#FF8A00;color:#fff;border-radius:999px;padding:3px 7px;flex-shrink:0}
.il-cap.sw span{animation:ilIn .6s var(--ease-o)}
.il-smp{position:absolute;right:10px;bottom:12px;font:600 9.5px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);background:var(--il-card);border:1px solid var(--line);border-radius:6px;padding:3px 7px}
.il-dots{display:flex;align-items:center;gap:6px;padding:9px 12px;border-top:1px solid var(--line);background:var(--surface)}
.il-dots button[data-k]{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:5px;border:0;background:none;cursor:pointer;padding:2px 0;color:var(--muted);font:600 10.5px var(--f-mono);letter-spacing:.06em;text-transform:uppercase}
.il-dots button[data-k] i{display:block;width:100%;height:4px;border-radius:3px;background:var(--line);position:relative;overflow:hidden}
.il-dots button[data-k] i:after{content:"";position:absolute;inset:0;background:#0066FF;transform-origin:left;transform:scaleX(var(--p,0))}
.il-dots button[data-k].done i:after{background:var(--line-2);transform:scaleX(1)}
.il-dots button[data-k] span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;transition:color .3s}
.il-dots button[data-k]:hover span{color:var(--ink)}
.il-dots button[data-k].on span{color:#0066FF}
html[data-theme="dark"] .il-dots button[data-k].on span{color:#7FB0FF}
.il-pz{flex-shrink:0;width:30px;height:30px;border:1px solid var(--line);background:var(--surface-2);border-radius:9px;color:var(--ink);display:grid;place-items:center;cursor:pointer;margin-left:4px}
.il-pz svg{width:12px;height:12px}
.il-pz .pl,.il-pz.paused .pa{display:none}
.il-pz.paused .pl{display:block}
/* metrics + log under the window */
.il-under{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:12px}
.il-side{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.il-sc{background:rgba(14,26,54,.92);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:10px 11px;color:#fff;box-shadow:0 20px 40px -22px rgba(0,0,0,.9);min-width:0;display:flex;flex-direction:column;justify-content:space-between}
.il-sc small{display:block;font:600 9.5px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:#9fb3d9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.il-sc b{display:block;font:800 19px var(--f-disp);color:#fff;font-variant-numeric:tabular-nums;margin:3px 0 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.il-sc b.bump{animation:ilBump .5s var(--ease-o)}
.il-sc u{display:block;height:4px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden;text-decoration:none}
.il-sc u i{display:block;height:100%;background:#0066FF;transform-origin:left;transform:scaleX(0);transition:transform .5s var(--ease-o)}
.il-sc.o u i{background:#FF8A00}
.il-log{background:#0B132B;border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:9px 13px 7px;color:#fff;box-shadow:0 24px 50px -20px rgba(0,0,0,.85);min-width:0}
.il-logh{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:5px}
.il-logh span{display:flex;align-items:center;gap:6px;font:700 9.5px var(--f-mono);letter-spacing:.1em;min-width:0}
.il-logh span b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.il-logh span i{width:7px;height:7px;border-radius:50%;background:#FF8A00;flex-shrink:0;animation:ilPulseO 1.6s infinite}
.il-logh em{font:500 9px var(--f-mono);color:#9fb3d9;font-style:normal}
.il-log ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;min-height:64px}
.il-log li{font:500 10.5px/1.35 var(--f-mono);color:#7d8fb3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.il-log li b{font-weight:600;color:#7FB0FF;margin-right:6px}
.il-log li.go{color:#fff}.il-log li.go b{color:#FFB15C}
.il-log li.ok{color:#c9d6ee}.il-log li.ok b{color:#5FE08D}
.il-log li.nw{animation:ilIn .45s var(--ease-o) both}
.il-pw.lh-powered{position:relative;left:auto;bottom:auto;margin:0;align-self:flex-start;background:#0B132B;max-width:none}
.il-pw.lh-powered>span{font-size:12.5px;line-height:1.25;align-items:center}
.il-pw em{display:block;font:500 10px/1.4 var(--f-mono);color:#9fb6de;font-style:normal;margin-top:4px}
.il-tile{width:24px;height:24px;border-radius:7px;background:#0066FF;color:#fff;display:grid;place-items:center;flex-shrink:0;font:800 14px/1 var(--f-disp)}

/* proof strip + sticky sub-nav */
.il-proof b{color:var(--ink)}
.il-sub{position:sticky;top:var(--il-hh);z-index:60;background:rgba(255,255,255,.97);border-bottom:1px solid var(--line);box-shadow:0 8px 20px -18px rgba(11,19,43,.5)}
html[data-theme="dark"] .il-sub{background:rgba(6,18,42,.95)}
.il-subt{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:8px 0}
.il-subt::-webkit-scrollbar{display:none}
.il-subt a{flex-shrink:0;font:600 12.5px var(--f-disp);color:var(--muted);padding:6px 13px;border-radius:999px;border:1px solid transparent;transition:color .2s,background .25s,border-color .25s}
.il-subt a:hover{color:var(--ink);border-color:var(--line);text-decoration:none}
.il-subt a.on{color:#fff;background:#0066FF;border-color:#0066FF}
.il-fine,.il-tm{font-size:12px;color:var(--muted);margin:14px 0 0;line-height:1.6}
.il-fine a{color:#0066FF}
html[data-theme="dark"] .il-fine a{color:#9CC2FF}

/* ---------- OVERVIEW ---------- */
.il-ov .prov svg{width:16px;height:16px;flex-shrink:0}

/* ---------- HIGHLIGHTS · notebook cells ---------- */
.il-nb{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 18px}
.il-cell{display:grid;grid-template-columns:62px minmax(0,1fr);gap:10px;align-items:start}
.il-in{font:600 12px var(--f-mono);color:#0066FF;padding-top:18px;text-align:right}
html[data-theme="dark"] .il-in{color:#7FB0FF}
.il-cb{position:relative;display:flex;gap:14px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line-2);border-radius:12px;padding:16px 18px;transition:border-color .3s,transform .35s var(--ease-o),box-shadow .3s}
.il-cell:hover .il-cb{border-left-color:#0066FF;transform:translateX(4px);box-shadow:var(--sh-s)}
.il-cb>div{min-width:0;flex:1}
.il-cb b{display:block;font:700 15.5px var(--f-disp);color:var(--ink);margin-bottom:4px}
.il-cb p{margin:0 0 9px;font-size:13.5px;color:var(--text);line-height:1.55}
.il-cb code{display:inline-block;font:500 11.5px var(--f-mono);color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:3px 8px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.il-ci{width:40px;height:40px;border-radius:12px;background:#0066FF;color:#fff;display:grid;place-items:center;flex-shrink:0;transition:transform .4s var(--ease-o)}
.il-cell:hover .il-ci{transform:rotate(-8deg) scale(1.08)}
.il-ci svg{width:19px;height:19px}
.il-ci.o{background:#FF8A00}.il-ci.n{background:#0B132B}
html[data-theme="dark"] .il-ci.n{background:#22325e}

/* ---------- ENVIRONMENTS · stack illustration ---------- */
.il-envw{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:26px;align-items:center}
.il-stack{position:relative;display:flex;flex-direction:column;gap:8px;padding:18px;background:#0B132B;border-radius:20px;overflow:hidden;box-shadow:0 30px 60px -34px rgba(11,19,43,.8)}
html[data-theme="dark"] .il-stack{background:#0E1A36;border:1px solid var(--line)}
.il-sl{position:relative;z-index:1;display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:11px 14px;color:#fff;opacity:0;transform:translateY(-14px);transition:opacity .5s var(--ease-o),transform .5s var(--ease-o),background .3s;transition-delay:calc((5 - var(--i))*110ms)}
.il-stack.in .il-sl{opacity:1;transform:none}
.il-sl span{width:30px;height:30px;border-radius:9px;background:#0066FF;display:grid;place-items:center;flex-shrink:0}
.il-sl span svg{width:15px;height:15px}
.il-sl.o span{background:#FF8A00}
.il-sl.n span{background:#fff;color:#0B132B}
.il-sl b{flex:1;min-width:0;font:600 13px var(--f-disp)}
.il-sl b.sw{animation:ilIn .45s var(--ease-o)}
.il-sl em{font:600 10px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:#9fb3d9;font-style:normal;white-space:nowrap}
.il-scanb{position:absolute;left:0;right:0;top:0;height:46px;background:rgba(0,102,255,.2);border-top:2px solid rgba(127,176,255,.7);z-index:0;animation:ilScan 4.5s var(--ease-o) infinite;pointer-events:none}
@keyframes ilScan{0%{transform:translateY(-50px);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateY(400px);opacity:0}}
.il-envs{display:flex;flex-direction:column;gap:10px}
.il-ev{display:flex;align-items:center;gap:14px;text-align:left;width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;cursor:pointer;color:var(--ink);transition:border-color .3s,transform .3s var(--ease-o),box-shadow .3s}
.il-ev:hover{transform:translateY(-3px);box-shadow:var(--sh-s)}
.il-ev.on{border-color:#0066FF;box-shadow:0 20px 40px -28px rgba(0,102,255,.7)}
.il-ev>span:nth-child(2){flex:1;min-width:0}
.il-ev b{display:block;font:700 15px var(--f-disp)}
.il-ev small{display:block;font-size:12.5px;color:var(--text);line-height:1.45;margin-top:2px}
.il-ev em{font:700 12px var(--f-mono);color:var(--il-ot);font-style:normal;white-space:nowrap}
.il-evk{width:42px;height:42px;border-radius:12px;background:#0066FF;color:#fff;display:grid;place-items:center;flex-shrink:0}
.il-evk svg{width:20px;height:20px}
.il-evk.o{background:#FF8A00}.il-evk.n{background:#0B132B}
html[data-theme="dark"] .il-evk.n{background:#22325e}

/* ---------- TRAIN BAND ---------- */
.il-band{padding:10px 0 56px}
.il-bandi{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:28px;align-items:center;background:#0066FF;color:#fff;border-radius:24px;padding:34px 36px;overflow:hidden;position:relative}
.il-bandi:before{content:"";position:absolute;right:-120px;top:-120px;width:340px;height:340px;border-radius:50%;border:1px dashed rgba(255,255,255,.35);animation:ilSpin 60s linear infinite}
@keyframes ilSpin{to{transform:rotate(360deg)}}
.il-bk{font:700 10.5px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:#FFD9A8}
.il-bandt h2{margin:8px 0 10px;font:700 clamp(21px,2.5vw,29px)/1.2 var(--f-disp);color:#fff}
.il-bandt p{margin:0;font-size:14.5px;line-height:1.6;color:#E6EFFF}
.il-bandc{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.il-gpus{position:relative;display:flex;flex-direction:column;gap:12px;background:#0B132B;border-radius:18px;padding:18px 20px}
.il-g{display:grid;grid-template-columns:110px auto;align-items:center;gap:4px 10px}
.il-g b{font:700 14px var(--f-disp)}
.il-g small{font:600 12px var(--f-mono);color:#9fb3d9;text-align:right}
.il-g u{grid-column:1/-1;display:block;height:10px;border-radius:6px;background:rgba(255,255,255,.1);overflow:hidden}
.il-g u i{display:block;height:100%;width:var(--w);background:#FF8A00;border-radius:6px;transform-origin:left;transform:scaleX(0);transition:transform 1.1s var(--ease-o)}
.il-g:nth-child(2) u i{transition-delay:.15s;background:#7FB0FF}.il-g:nth-child(3) u i{transition-delay:.3s;background:#fff}
.il-bandi.in .il-g u i{transform:scaleX(1)}
.il-gk{font:500 10.5px var(--f-mono);color:#9fb3d9}

/* ---------- HOW · flow ---------- */
.il-flow{position:relative;padding-top:4px}
.il-fsv{position:absolute;left:4%;right:4%;top:6px;width:92%;height:60px;overflow:visible}
.il-fsv path{stroke:var(--line-2);stroke-width:2;stroke-dasharray:6 7;vector-effect:non-scaling-stroke}
.il-fd{fill:#FF8A00}
.il-fs{position:relative;display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.il-fs button{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;border:0;background:none;cursor:pointer;padding:0 4px;color:var(--ink)}
.il-fs button>span{width:62px;height:62px;border-radius:50%;background:var(--surface);border:2px solid var(--line-2);display:grid;place-items:center;color:#0066FF;transition:transform .35s var(--ease-o),background .3s,color .3s,border-color .3s,box-shadow .3s}
html[data-theme="dark"] .il-fs button>span{color:#9CC2FF}
.il-fs button>span svg{width:24px;height:24px}
.il-fs button:hover>span{transform:translateY(-4px);border-color:#0066FF}
.il-fs button.on>span{background:#0066FF;border-color:#0066FF;color:#fff;box-shadow:0 14px 30px -14px rgba(0,102,255,.8)}
.il-fs button.seen:not(.on)>span{border-color:#0066FF}
.il-fs b{font:700 14px var(--f-disp)}
.il-fs small{font:500 11px var(--f-mono);color:var(--muted)}
.il-fd2{margin-top:22px;background:var(--surface);border:1px solid var(--line);border-left:5px solid #FF8A00;border-radius:16px;padding:20px 22px;display:grid;grid-template-columns:190px minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start;box-shadow:var(--sh-s)}
.il-fdk span{display:inline-block;font:800 12px var(--f-mono);color:#fff;background:#0066FF;border-radius:8px;padding:4px 8px}
.il-fdk b{display:block;font:700 22px var(--f-disp);color:var(--ink);margin-top:8px}
.il-fd2 p{margin:0;font-size:14px;color:var(--text);line-height:1.6}
.il-fd2 ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.il-fd2 li{display:flex;gap:9px;align-items:flex-start;font-size:13px;color:var(--text);line-height:1.45}
.il-fd2 li i{flex-shrink:0;width:22px;height:22px;border-radius:6px;background:var(--chip);color:#0066FF;display:grid;place-items:center}
html[data-theme="dark"] .il-fd2 li i{color:#9CC2FF}
.il-fd2 li i svg{width:12px;height:12px}
.il-fd2 .sw{animation:ilIn .45s var(--ease-o) both}

/* ---------- USE CASES ---------- */
.il-ucg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.il-u{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:8px;overflow:hidden;transition:transform .35s var(--ease-o),border-color .3s,box-shadow .3s}
.il-u:after{content:"";position:absolute;left:0;bottom:0;height:3px;width:100%;background:#0066FF;transform:scaleX(0);transform-origin:left;transition:transform .45s var(--ease-o)}
.il-u:hover{transform:translateY(-5px);border-color:#0066FF;box-shadow:var(--sh)}
.il-u:hover:after{transform:scaleX(1)}
.il-u b{font:700 15.5px var(--f-disp);color:var(--ink)}
.il-u p{margin:0;font-size:13.5px;color:var(--text);line-height:1.55;flex:1}
.il-uk{width:42px;height:42px;border-radius:12px;background:var(--chip);color:#0066FF;display:grid;place-items:center}
html[data-theme="dark"] .il-uk{color:#9CC2FF}
.il-uk svg{width:20px;height:20px}
.il-uk.o{background:rgba(255,138,0,.14);color:var(--il-ot)}
.il-uk.n{background:#0B132B;color:#fff}
html[data-theme="dark"] .il-uk.n{background:#22325e}
.il-ut{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.il-ut span{font:600 10.5px var(--f-mono);color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:3px 7px}

/* ---------- CLASSROOM ---------- */
.il-clsw{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:30px;align-items:center}
.il-clsl{list-style:none;margin:0 0 18px;padding:0;display:flex;flex-direction:column;gap:10px}
.il-clsl li{display:flex;gap:12px;align-items:flex-start;font-size:14px;color:var(--text);line-height:1.5}
.il-clsl li i{flex-shrink:0;width:32px;height:32px;border-radius:10px;background:#0066FF;color:#fff;display:grid;place-items:center}
.il-clsl li i svg{width:16px;height:16px}
.il-clsl li b{color:var(--ink)}
.il-edu{display:flex;flex-direction:column;gap:8px}
.il-edk{font:700 10.5px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--il-ot)}
.il-edu a{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 14px;color:var(--ink);transition:border-color .3s,transform .3s var(--ease-o)}
.il-edu a:hover{border-color:#0066FF;transform:translateX(4px);text-decoration:none}
.il-edu a b{font:700 13.5px var(--f-disp)}
.il-edu a small{font:600 11.5px var(--f-mono);color:var(--il-ot);white-space:nowrap}
.il-room{background:#0B132B;border-radius:22px;padding:18px;color:#fff;box-shadow:0 30px 60px -30px rgba(11,19,43,.8)}
html[data-theme="dark"] .il-room{background:#0E1A36;border:1px solid var(--line)}
.il-roomh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.il-roomh b{font:700 14px var(--f-disp)}
.il-roomh span{font:600 9.5px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:#9fb3d9;border:1px solid rgba(255,255,255,.2);border-radius:6px;padding:2px 7px}
.il-seats{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.il-seat{aspect-ratio:4/3;border-radius:9px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);display:grid;place-items:center;font:600 10px var(--f-mono);color:#7d8fb3;transition:background .45s,border-color .45s,color .45s,transform .45s var(--ease-o)}
.il-seat.a{background:rgba(0,102,255,.35);border-color:#4D94FF;color:#fff;animation:ilBlink 1s ease-in-out infinite}
.il-seat.b{background:#0066FF;border-color:#0066FF;color:#fff}
.il-seat.c{background:#16a34a;border-color:#16a34a;color:#fff;transform:scale(.94)}
.il-seat.d{background:#FF8A00;border-color:#FF8A00;color:#fff;animation:ilPulseO 1.2s infinite}
@keyframes ilBlink{50%{opacity:.55}}
.il-roomf{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px;font:500 10.5px var(--f-mono);color:#9fb3d9}
.il-roomf span{display:flex;align-items:center;gap:5px}
.il-roomf i{width:10px;height:10px;border-radius:3px}
.il-roomf i.a{background:rgba(0,102,255,.5)}.il-roomf i.b{background:#0066FF}.il-roomf i.c{background:#16a34a}.il-roomf i.d{background:#FF8A00}

/* ---------- INDIA ---------- */
.il-ing{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.il-inc{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:8px;border-bottom:4px solid #0066FF;transition:transform .35s var(--ease-o),box-shadow .3s}
.il-inc:nth-child(2){border-bottom-color:#FF8A00}.il-inc:nth-child(3){border-bottom-color:#0B132B}
html[data-theme="dark"] .il-inc:nth-child(3){border-bottom-color:#7FB0FF}
.il-inc:hover{transform:translateY(-4px);box-shadow:var(--sh)}
.il-inb{align-self:flex-start;font:800 19px var(--f-disp);color:#0066FF}
html[data-theme="dark"] .il-inb{color:#7FB0FF}
.il-inb.o{color:var(--il-ot)}.il-inb.n{color:var(--ink)}
.il-inc b{font:700 15px var(--f-disp);color:var(--ink)}
.il-inc p{margin:0;font-size:13px;color:var(--text);line-height:1.55}

/* ---------- PLANS ---------- */
.il-plg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;align-items:stretch}
.il-pc{position:relative;background:var(--surface);border:1.5px solid var(--line);border-radius:20px;padding:22px 20px;display:flex;flex-direction:column;gap:10px;transition:transform .35s var(--ease-o),box-shadow .35s,border-color .3s}
.il-pc:hover{transform:translateY(-6px);box-shadow:var(--sh)}
.il-pc.pop{border-color:#0066FF;box-shadow:0 30px 60px -34px rgba(0,102,255,.6)}
.il-pc.gpu{background:#0B132B;border-color:#0B132B;color:#fff}
html[data-theme="dark"] .il-pc.gpu{background:#0E1A36;border-color:#2C3D68}
.il-pc.gpu h3,.il-pc.gpu .il-pr b{color:#fff}
.il-pc.gpu .il-pr small{color:#9fb3d9}
.il-pc.gpu li{color:#c9d6ee}
.il-pc.gpu li svg{color:#FFB15C}
.il-pc.gpu .il-spec span{background:rgba(255,255,255,.08);color:#fff;border-color:rgba(255,255,255,.14)}
.il-pc.gpu .il-pt{color:#FFB15C}
.il-pc.gpu .btn-line2{background:transparent;color:#fff;border-color:rgba(255,255,255,.4)}
.il-pc.gpu .btn-line2:hover{border-color:#FF8A00;color:#FFB15C}
.il-flag{position:absolute;top:-12px;right:18px;background:#FF8A00;color:#fff;font:700 10.5px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;border-radius:999px;padding:5px 11px}
.il-pt{font:700 10.5px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--il-ot)}
.il-pc h3{margin:0;font:700 21px var(--f-disp);color:var(--ink)}
.il-pr{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.il-pr b{font:800 30px var(--f-disp);color:var(--ink);letter-spacing:-.01em}
.il-pr small{font-size:12px;color:var(--muted)}
.il-spec{display:flex;flex-wrap:wrap;gap:5px}
.il-spec span{font:600 11px var(--f-mono);color:#0066FF;background:var(--chip);border:1px solid var(--line);border-radius:7px;padding:3px 8px}
html[data-theme="dark"] .il-spec span{color:#9CC2FF}
.il-pc ul{list-style:none;margin:4px 0 10px;padding:0;display:flex;flex-direction:column;gap:8px;flex:1}
.il-pc li{display:flex;gap:9px;align-items:flex-start;font-size:13.5px;color:var(--text);line-height:1.4}
.il-pc li svg{width:16px;height:16px;color:#0066FF;flex-shrink:0;margin-top:1px}
html[data-theme="dark"] .il-pc li svg{color:#9CC2FF}
.il-pc .btn{justify-content:center}

/* ---------- CONFIGURATOR ---------- */
.il-cfw,.il-esw,.il-pkw{display:grid;gap:20px}
.il-cfw>*,.il-esw>*,.il-pkw>*{min-width:0}
.il-cfw{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);align-items:start}
.il-cfi,.il-esi,.il-pki{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px;display:flex;flex-direction:column;gap:18px}
.il-cf2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.il-cf2>*{min-width:0}
.il-cfi .seg,.il-esi .seg,.il-pki .seg{flex-wrap:wrap}
.il-gq{display:flex;flex-direction:column;gap:10px;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;transition:border-color .2s,background .2s}
.il-gq.ck{border-color:#0066FF;background:var(--il-bs)}
.il-gq label{display:flex;align-items:center;gap:10px;cursor:pointer}
.il-gq input[type=checkbox],.il-adds input[type=checkbox]{width:17px;height:17px;accent-color:#0066FF;flex-shrink:0}
.il-gqb b,.il-ab b{display:flex;align-items:center;gap:7px;font:600 13px var(--f-disp);color:var(--ink)}
.il-gqb b svg,.il-ab b svg{width:15px;height:15px;color:#0066FF;flex-shrink:0}
html[data-theme="dark"] .il-gqb b svg,html[data-theme="dark"] .il-ab b svg{color:#9CC2FF}
.il-gqb small,.il-ab small{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}
.il-gqo{display:none;align-items:center;gap:10px;flex-wrap:wrap;padding-left:27px}
.il-gq.ck .il-gqo{display:flex}
.il-adds{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.il-adds label{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;transition:border-color .2s,background .2s;min-width:0}
.il-adds label:hover{border-color:var(--line-2)}
.il-adds label.ck{border-color:#0066FF;background:var(--il-bs)}
.il-ab{flex:1;min-width:0}
.stp.sm{flex-shrink:0;height:32px}
.stp.sm input{width:40px;padding:0;font-size:13px}
.stp.sm button{width:26px;min-width:26px;height:30px;padding:0}
.il-cfo{position:sticky;top:calc(var(--il-hh) + 60px)}
.il-cfs{background:#0B132B;color:#fff;border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:10px;box-shadow:0 30px 60px -30px rgba(11,19,43,.8)}
html[data-theme="dark"] .il-cfs{background:#0E1A36;border:1px solid var(--line)}
.il-cfk{font:700 10.5px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:#FFB15C}
.il-cfs h3{margin:0;font:700 19px var(--f-disp);color:#fff}
.il-cfl{list-style:none;margin:0;padding:10px 0 0;display:flex;flex-direction:column;gap:6px;border-top:1px solid rgba(255,255,255,.12)}
.il-cfl li{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:#c9d6ee;animation:ilIn .35s var(--ease-o)}
.il-cfl li b{color:#fff;font-weight:600;white-space:nowrap}
.il-cfl li.q b{color:#FFB15C}
.il-cft{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
.il-cft div{background:rgba(255,255,255,.06);border-radius:10px;padding:9px 11px;min-width:0}
.il-cft span{display:block;font:600 10px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:#9fb3d9}
.il-cft b{font:800 17px var(--f-disp);color:#fff}
.il-cfr{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:#c9d6ee}
.il-cfr b{color:#fff;font-variant-numeric:tabular-nums;white-space:nowrap}
.il-cfr.t{border-top:1px solid rgba(255,255,255,.14);padding-top:10px;font-weight:700;color:#fff}
.il-cfr.t b{font:800 24px var(--f-disp);color:#fff}
.il-cfr.t b.bump{animation:ilBump .5s var(--ease-o)}
.il-cfr.q b{color:#FFB15C}
.il-cfr.q[hidden]{display:none}
.il-cfb{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.il-cfb .btn{justify-content:center}
.il-cfb .btn:disabled{opacity:.5;cursor:not-allowed}
.il-cff{font-size:11px;color:#9fb3d9;line-height:1.5}

/* ---------- ESTIMATOR ---------- */
.il-esw{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);align-items:start}
.il-eso,.il-pko{position:sticky;top:calc(var(--il-hh) + 60px);background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--sh)}
.il-esk,.il-pkk{font:700 10.5px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--il-ot)}
.il-esh{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.il-esh div{background:#0B132B;border-radius:12px;padding:10px 12px;color:#fff;min-width:0}
html[data-theme="dark"] .il-esh div{background:#16264A}
.il-esh div.g{background:#0066FF}
.il-esh small{display:block;font:600 9.5px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:#c9d6ee}
.il-esh b{display:block;font:800 20px var(--f-disp);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.il-esh b.bump{animation:ilBump .5s var(--ease-o)}
.il-esh em{font:600 9.5px var(--f-mono);color:#FFD9A8;font-style:normal}
.il-esbar{display:flex;height:12px;border-radius:7px;overflow:hidden;background:var(--surface-2)}
.il-esbar i{display:block;height:100%;background:#0B132B;transition:flex-grow .6s var(--ease-o);flex:1 1 0}
html[data-theme="dark"] .il-esbar i{background:#7FB0FF}
.il-esbar i.g{background:#0066FF}
.il-esg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.il-esg div{background:var(--surface-2);border-radius:12px;padding:10px 12px;min-width:0}
.il-esg small{display:block;font:600 10px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.il-esg b{display:block;font:800 18px var(--f-disp);color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.il-esg div.k{background:var(--il-bs)}
.il-esg div.k b{color:#0066FF}
html[data-theme="dark"] .il-esg div.k b{color:#9CC2FF}
.il-esf{border:1px dashed var(--line-2);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.il-esf b{font:700 10.5px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink)}
.il-esf code{font:500 11.5px/1.45 var(--f-mono);color:var(--text);white-space:normal;word-break:break-word}
.il-esa{display:flex;gap:8px;flex-wrap:wrap}
.il-esn{font-size:11.5px;color:var(--muted);line-height:1.5}

/* ---------- STACK PICKER ---------- */
.il-pkw{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);align-items:start}
.il-pko h3{margin:0;font:700 19px var(--f-disp);color:var(--ink)}
.il-pko h3.sw{animation:ilIn .4s var(--ease-o)}
.il-pkr{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.il-pkr div{background:var(--surface-2);border-radius:12px;padding:10px 12px;min-width:0}
.il-pkr small{display:flex;align-items:center;gap:6px;font:600 10px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.il-pkr small svg{width:13px;height:13px;color:#0066FF}
html[data-theme="dark"] .il-pkr small svg{color:#9CC2FF}
.il-pkr b{display:block;font:700 13.5px/1.35 var(--f-disp);color:var(--ink);margin-top:3px}
.il-pkr b.sw{animation:ilIn .4s var(--ease-o)}
.il-pkc{margin:0;background:#0B132B;color:#c9d6ee;border-radius:12px;padding:12px 14px;font:500 12px/1.6 var(--f-mono);white-space:pre-wrap;word-break:break-word;min-height:90px}
html[data-theme="dark"] .il-pkc{background:#050B1C;border:1px solid var(--line)}
.il-pkc .k{color:#FFB15C}.il-pkc .c{color:#7d8fb3}
.il-pkn{margin:0;font-size:13px;color:var(--text);line-height:1.55}

/* ---------- VS ---------- */
.il-vt tbody tr{transition:opacity .5s var(--ease-o),transform .5s var(--ease-o)}
.il-vt.pre tbody tr{opacity:0;transform:translateY(10px)}
.il-vt td:first-child{white-space:nowrap;font-weight:600;color:var(--ink)}
.il-vt td svg{display:inline-block;width:15px;height:15px;vertical-align:-3px;color:#0066FF;margin-right:6px}
html[data-theme="dark"] .il-vt td svg{color:#9CC2FF}
.il-vt td:nth-child(2){color:#c0392b}
html[data-theme="dark"] .il-vt td:nth-child(2){color:#FF7A6B}

/* ---------- STEPS · vertical timeline ---------- */
.il-sts{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;counter-reset:s}
.il-sts li{display:flex;gap:14px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;opacity:.35;transform:translateY(10px);transition:opacity .5s var(--ease-o),transform .5s var(--ease-o),border-color .3s}
.il-sts li.on{opacity:1;transform:none}
.il-sts li.on .n{background:#0066FF;color:#fff}
.il-sts li.on:nth-child(even) .n{background:#FF8A00}
.il-sts .n{flex-shrink:0;display:grid;place-items:center;width:42px;height:42px;border-radius:50%;background:var(--surface-2);color:var(--muted);font:800 13px var(--f-mono);transition:background .4s,color .4s}
.il-sts b{display:block;font:700 15px var(--f-disp);color:var(--ink)}
.il-sts small{display:block;font-size:12.5px;color:var(--text);margin:4px 0 8px;line-height:1.45}
.il-sts em{font:600 10.5px var(--f-mono);color:#0066FF;font-style:normal;background:var(--chip);border-radius:6px;padding:3px 7px}
html[data-theme="dark"] .il-sts em{color:#9CC2FF}

/* ---------- RELATED ---------- */
.il-xs{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.il-x{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 14px;color:var(--ink);transition:transform .3s var(--ease-o),border-color .3s,box-shadow .3s}
.il-x:hover{transform:translateY(-3px);border-color:#0066FF;text-decoration:none;box-shadow:var(--sh-s)}
.il-x i{width:36px;height:36px;border-radius:10px;background:var(--chip);color:#0066FF;display:grid;place-items:center;flex-shrink:0}
html[data-theme="dark"] .il-x i{color:#9CC2FF}
.il-x i svg{width:17px;height:17px}
.il-x span{flex:1;min-width:0}
.il-x small{display:block;font-size:11.5px;color:var(--muted)}
.il-x b{display:block;font:700 13.5px var(--f-disp)}
.il-x em{font-style:normal;color:#FF8A00;font-weight:700;transition:transform .3s var(--ease-o)}
.il-x:hover em{transform:translateX(4px)}

/* ---------- RESPONSIVE ---------- */
@media(max-width:1180px){
  .hero.lh .hero-grid.il-hg{grid-template-columns:minmax(0,1fr)}
  .il-stage{max-width:780px;width:100%;margin:0 auto}
  .il-ing{grid-template-columns:repeat(2,1fr)}
  .il-plg{grid-template-columns:repeat(2,minmax(0,1fr))}
  .il-xs{grid-template-columns:repeat(3,1fr)}
  .il-fd2{grid-template-columns:160px minmax(0,1fr)}
  .il-fd2 ul{grid-column:2}
}
@media(max-width:960px){
  .il-cfw,.il-esw,.il-pkw,.il-envw,.il-clsw,.il-bandi{grid-template-columns:minmax(0,1fr)}
  .il-cfo,.il-eso,.il-pko{position:static}
  .il-nb{grid-template-columns:minmax(0,1fr)}
  .il-ucg{grid-template-columns:repeat(2,minmax(0,1fr))}
  .il-sts{grid-template-columns:repeat(2,minmax(0,1fr))}
  .il-xs{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:760px){
  .il-fs{grid-template-columns:repeat(3,1fr);row-gap:16px}
  .il-fsv{display:none}
  .il-fd2{grid-template-columns:minmax(0,1fr)}
  .il-fd2 ul{grid-column:auto}
  .il-adds{grid-template-columns:minmax(0,1fr)}
  .il-under{grid-template-columns:minmax(0,1fr)}
}
@media(max-width:640px){
  .hero.lh.il-hero{padding:26px 0 46px}
  .il-stage{padding:40px 0 6px}
  .il-scr{height:310px}
  .il-url{display:none}
  .il-dots{gap:4px;padding:8px 10px}
  .il-dots button[data-k] span{font-size:9px;letter-spacing:0}
  .il-chip small{display:none}
  .il-chip{max-width:48%}
  .il-chip b{font-size:11px}
  .il-sc{padding:9px 9px}
  .il-sc b{font-size:15px}
  .il-cell{grid-template-columns:minmax(0,1fr)}
  .il-in{text-align:left;padding:0}
  .il-cb{padding:14px}
  .il-ucg,.il-ing,.il-xs,.il-plg,.il-sts{grid-template-columns:minmax(0,1fr)}
  .il-plg{max-width:460px;margin:0 auto}
  .il-cf2,.il-esh{grid-template-columns:minmax(0,1fr)}
  .il-cfi,.il-esi,.il-pki{padding:18px}
  .il-pkr{grid-template-columns:minmax(0,1fr)}
  .il-vt td:first-child{white-space:normal}
  .il-tensor{display:none}
  .il-bandi{padding:24px 20px}
  .il-ev{flex-wrap:wrap}
  .il-ev>span:nth-child(2){flex:1 1 calc(100% - 60px)}
  .il-ev em{margin-left:56px}
  .il-sl em{display:none}
}
@media(max-width:380px){
  .il-dots button[data-k] span{display:none}
}
@media(prefers-reduced-motion:reduce){
  .il-tensor i,.il-glyphs,.il-scanb,.il-bandi:before{animation:none!important}
  .il-glyphs{display:none}
  .il-live i,.il-logh span i,.il-seat{animation:none!important}
  .il-fd{display:none}
  .il-cv,.il-sts li,.il-vt tbody tr,.il-sl,.il-g u i{transition:none}
}
