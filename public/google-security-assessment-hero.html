.ga-orbs i:before{content:"";position:absolute;top:-5px;left:50%;width:9px;height:9px;border-radius:50%;background:#FF8A00;box-shadow:0 0 12px #FF8A00}
.ga-orbs i:nth-child(2):before{background:#0066FF;box-shadow:0 0 12px #0066FF}
.hero.lh .hero-grid.ga-hg{grid-template-columns:minmax(0,.86fr) minmax(0,1.14fr);gap:34px;align-items:center}
.ga-copy{position:relative;z-index:3;min-width:0}
.ga-hero .lh-title{color:#fff}
.hero.lh .ga-stage{position:relative;z-index:3;display:flex;flex-direction:column;align-items:stretch;gap:12px;padding:52px 0 6px;min-width:0;min-height:0}
.ga-chip{max-width:270px;backdrop-filter:none!important;-webkit-backdrop-filter:none!important;background:rgba(11,19,43,.96)!important;z-index:7}
.ga-chip b{display:block;font:700 12px var(--f-disp);color:#fff;white-space:nowrap}
.ga-chip small{white-space:nowrap}
.ga-chip.sw b,.ga-chip.sw small{animation:gaIn .55s var(--ease-o)}
#main .ga-chO i{background:#FF8A00}
.ga-dots{display:flex;gap:6px;align-items:stretch;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:5px}
.ga-dots button[data-k]{position:relative;flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:6px;border:0;background:none;cursor:pointer;padding:8px 6px 10px;border-radius:10px;color:#9fb3d9;font:600 11.5px var(--f-disp);overflow:hidden;transition:background .3s,color .3s}
.ga-dots button[data-k] em{font:700 9.5px var(--f-mono);font-style:normal;color:#7FB0FF;flex-shrink:0}
.ga-dots button[data-k] span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ga-dots button[data-k] i{position:absolute;left:10px;right:10px;bottom:3px;height:3px;border-radius:2px;background:rgba(255,255,255,.12);overflow:hidden}
.ga-dots button[data-k] i:after{content:"";position:absolute;inset:0;background:#FF8A00;transform-origin:left;transform:scaleX(var(--p,0))}
.ga-dots button[data-k].past i:after{background:#0066FF;transform:scaleX(1)}
.ga-dots button[data-k]:hover{color:#fff}
.ga-dots button[data-k].on{background:#0066FF;color:#fff}
.ga-dots button[data-k].on em{color:#fff}
.ga-pz{flex-shrink:0;width:34px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);border-radius:10px;color:#fff;display:grid;place-items:center;cursor:pointer}
.ga-pz svg{width:12px;height:12px}
.ga-pz .pl,.ga-pz.paused .pa{display:none}
.ga-pz.paused .pl{display:block}
.ga-body{display:grid;grid-template-columns:minmax(0,1fr) 140px;gap:12px;align-items:stretch}
.ga-tilt{min-width:0}
.ga-win{background:var(--ga-card);border-radius:18px;box-shadow:0 40px 80px -30px rgba(0,0,0,.75),0 0 0 1px rgba(255,255,255,.1);overflow:hidden;color:var(--ink)}
.ga-wh{display:flex;align-items:center;gap:10px;padding:9px 14px;background:#0B132B;color:#cfe0ff;border-bottom:1px solid rgba(255,255,255,.08)}
html[data-theme="dark"] .ga-wh{background:#050B1A}
.ga-tl{display:flex;gap:5px;flex-shrink:0}
.ga-tl i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.22)}
.ga-tl i:first-child{background:#FF8A00}.ga-tl i:nth-child(2){background:#0066FF}
.ga-wh b{min-width:0;font:600 12px var(--f-mono);color:#fff}
.ga-wh b span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ga-wh b span.sw{animation:gaIn .5s var(--ease-o)}
.ga-live{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font:700 10px var(--f-mono);letter-spacing:.12em;color:#3DD47A;font-style:normal;flex-shrink:0}
.ga-live i{width:7px;height:7px;border-radius:50%;background:#3DD47A;animation:gaPulse 1.6s ease-in-out infinite}
.ga-scr{position:relative;height:340px;background:var(--surface-2);overflow:hidden;touch-action:pan-y}
.ga-cv{position:absolute;inset:0;width:100%;height:100%;display:block;opacity:0;transition:opacity .8s var(--ease-o)}
.ga-cv.on{opacity:1}
.ga-cap{position:absolute;left:10px;top:10px;display:inline-flex;align-items:center;gap:8px;background:var(--ga-card);border:1px solid var(--line);border-radius:999px;padding:4px 12px 4px 4px;font:600 11.5px var(--f-disp);color:var(--ink);box-shadow:0 8px 18px -12px rgba(11,19,43,.4);max-width:calc(100% - 130px)}
.ga-cap span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ga-cap b{font:700 10px var(--f-mono);background:#0066FF;color:#fff;border-radius:999px;padding:3px 7px;flex-shrink:0}
.ga-cap.sw span{animation:gaIn .6s var(--ease-o)}
.ga-smp{position:absolute;right:10px;top:12px;font:600 9.5px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);background:var(--ga-card);border:1px solid var(--line);border-radius:6px;padding:3px 7px}
.ga-rail{display:flex;flex-direction:column;gap:10px;min-width:0}
.ga-rc{flex:1;background:rgba(14,26,54,.92);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:12px;color:#fff;box-shadow:0 20px 40px -22px rgba(0,0,0,.9);min-width:0;display:flex;flex-direction:column;justify-content:center}
.ga-rc small{display:block;font:600 9.5px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:#9fb3d9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ga-rc b{display:block;font:800 21px var(--f-disp);color:#fff;font-variant-numeric:tabular-nums;margin:3px 0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ga-rc b.bump{animation:gaBump .5s var(--ease-o)}
.ga-rc u{display:block;height:4px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden;text-decoration:none}
.ga-rc u i{display:block;height:100%;background:#0066FF;transform-origin:left;transform:scaleX(0);transition:transform .5s var(--ease-o)}
.ga-rc.o u i{background:#FF8A00}
.ga-foot{display:grid;grid-template-columns:minmax(0,1fr) 200px;gap:12px}
.ga-pw.lh-powered{position:relative;left:auto;bottom:auto;margin:0;background:#0B132B;max-width:none;min-width:0;display:flex;flex-direction:column;justify-content:center;border-radius:14px}
.ga-pw.lh-powered>span{font-size:14px;line-height:1.25;align-items:center}
.ga-tile{width:26px;height:26px;border-radius:8px;background:#fff;color:#0066FF;display:grid;place-items:center;flex-shrink:0;font:800 14px/1 var(--f-disp);box-shadow:inset 0 0 0 2px #0066FF}
.ga-pw em{display:block;font:500 9.5px/1.4 var(--f-mono);color:#9fb6de;font-style:normal;margin-top:4px}
.ga-log{overflow:hidden;position:relative;z-index:5;background:#0B132B;border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:10px 12px;color:#fff;box-shadow:0 24px 50px -20px rgba(0,0,0,.85);min-width:0}
.ga-logh{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:7px}
.ga-logh span{display:flex;align-items:center;gap:6px;font:700 9.5px var(--f-mono);letter-spacing:.1em;min-width:0}
.ga-logh span b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ga-logh span i{width:7px;height:7px;border-radius:50%;background:#FF8A00;flex-shrink:0;animation:gaBlink 1.4s steps(1) infinite}
.ga-logh em{font:500 9px var(--f-mono);color:#9fb3d9;font-style:normal}
.ga-log ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px 14px;min-height:62px;align-content:start}
.ga-log li{font:500 10px/1.35 var(--f-mono);color:#8a9bbd;border-left:2px solid rgba(127,176,255,.3);padding-left:7px;overflow-wrap:anywhere;min-width:0}
.ga-log li b{font-weight:700;color:#7FB0FF;margin-right:5px}
.ga-log li.go{color:#fff;border-left-color:#FF8A00}.ga-log li.go b{color:#FFB15C}
.ga-log li.ok{color:#d6e2f5;border-left-color:#3DD47A}.ga-log li.ok b{color:#5FE08D}
.ga-log li.bad{color:#fff;border-left-color:#FF6B5B}.ga-log li.bad b{color:#FF8F82}
.ga-log li.nw{animation:gaIn .45s var(--ease-o) both}

/* proof + sub-nav */
.ga-proof b{color:var(--ink)}
.ga-sub{position:sticky;top:var(--ga-hh);z-index:60;background:rgba(255,255,255,.97);border-bottom:1px solid var(--line);box-shadow:0 8px 20px -18px rgba(11,19,43,.5)}
html[data-theme="dark"] .ga-sub{background:rgba(6,18,42,.95)}
.ga-subt{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.ga-subt::-webkit-scrollbar{display:none}
.ga-subt a{position:relative;flex-shrink:0;font:600 12.5px var(--f-disp);color:var(--muted);padding:12px 12px 11px;transition:color .2s}
.ga-subt a:after{content:"";position:absolute;left:12px;right:12px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:#FF8A00;transform:scaleX(0);transition:transform .3s var(--ease-o)}
.ga-subt a:hover{color:var(--ink);text-decoration:none}
.ga-subt a.on{color:var(--ink)}
.ga-subt a.on:after{transform:scaleX(1)}


/* ---------- OVERVIEW ---------- */
.ga-ovg{display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,1.05fr);gap:48px;align-items:center}
.ga-ov .pp-ov{font-size:15.5px;line-height:1.7;color:var(--text);margin:0 0 14px}
.ga-works{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:18px}
.ga-works .pl{font:700 10.5px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-right:4px}
.ga-works span:not(.pl){display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font:600 12.5px var(--f-disp);color:var(--ink)}
.ga-works svg{width:14px;height:14px;color:#0066FF}
html[data-theme="dark"] .ga-works svg{color:#9CC2FF}
.ga-con{position:relative;background:var(--ga-card);border:1px solid var(--line);border-radius:20px;box-shadow:0 40px 70px -40px rgba(11,19,43,.55);overflow:visible}
.ga-cnh{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ga-cnh b{font:700 14px var(--f-disp);color:var(--ink)}
.ga-crumb{font:500 11.5px var(--f-mono);color:var(--muted)}
.ga-cnh em{margin-left:auto;font:600 9.5px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-style:normal}
.ga-cnb{padding:6px 16px}
.ga-cnr{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 0;border-bottom:1px dashed var(--line);font-size:13.5px;color:var(--text)}
.ga-cnr:last-child{border-bottom:0}
.ga-sw{position:relative;width:38px;height:22px;border-radius:999px;background:var(--line-2);flex-shrink:0;transition:background .4s}
.ga-sw:after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:transform .4s var(--ease-o)}
.ga-sw.on{background:#0066FF}
.ga-sw.on:after{transform:translateX(16px)}
.ga-sw.bad.on{background:#c0392b}
.ga-val{font:700 11.5px var(--f-mono);color:#c0392b;background:rgba(192,57,43,.1);border-radius:6px;padding:3px 8px;white-space:nowrap}
.ga-val.ok{color:#16a34a;background:rgba(22,163,74,.12)}
.ga-cnf{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:12px 16px;background:var(--surface-2);border-top:1px solid var(--line);border-radius:0 0 20px 20px}
.ga-cnf em{margin-left:auto;font:600 11px var(--f-mono);color:var(--muted);font-style:normal}
.ga-pin{position:absolute;width:40px;height:40px;border-radius:12px;background:#FF8A00;color:#fff;display:grid;place-items:center;box-shadow:0 14px 26px -10px rgba(255,138,0,.8);animation:gaBob 5s ease-in-out infinite}
.ga-pin svg{width:20px;height:20px}
.ga-rk{display:inline-block;font:700 9.5px var(--f-mono);letter-spacing:.1em;color:#fff;border-radius:6px;padding:3px 8px}
.ga-rk.h{background:#c0392b}.ga-rk.m{background:#FF8A00}.ga-rk.l{background:#0066FF}
.ga-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;margin-top:40px;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--surface)}
.ga-stats div{padding:18px 20px;border-left:1px solid var(--line)}
.ga-stats div:first-child{border-left:0}
.ga-stats b{display:block;font:800 26px var(--f-disp);color:#0066FF}
html[data-theme="dark"] .ga-stats b{color:#8DB8FF}
.ga-stats span{font-size:12.5px;color:var(--muted)}

/* ---------- CAPABILITIES · tiles ---------- */
.ga-flt{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.ga-flt button{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 15px;font:600 12.5px var(--f-disp);cursor:pointer;transition:all .2s}
.ga-flt button svg{width:14px;height:14px}
.ga-flt button.on{background:#0066FF;border-color:#0066FF;color:#fff}
.ga-tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.ga-t{position:relative;background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:18px;cursor:pointer;text-align:left;font:inherit;color:inherit;display:flex;flex-direction:column;gap:8px;min-height:170px;transition:transform .35s var(--ease-o),border-color .25s,box-shadow .3s,opacity .3s}
.ga-t:hover{transform:translateY(-3px);border-color:#0066FF;box-shadow:0 20px 36px -26px rgba(0,102,255,.7)}
.ga-t.dim{opacity:.28;transform:scale(.97)}
.ga-t.open{grid-column:span 2;grid-row:span 2;border-color:#0066FF;background:var(--ga-card);box-shadow:0 30px 50px -30px rgba(0,102,255,.6);cursor:default}
.ga-ti{width:40px;height:40px;border-radius:12px;background:var(--ga-tint);color:#0066FF;display:grid;place-items:center}
html[data-theme="dark"] .ga-ti{color:#8DB8FF}
.ga-ti svg{width:20px;height:20px}
.ga-t.open .ga-ti{background:#0066FF;color:#fff}
.ga-th{font:700 15px var(--f-disp);color:var(--ink)}
.ga-ts{font-size:12.5px;color:var(--muted);line-height:1.5}
.ga-tg2{position:absolute;top:16px;right:16px;font:700 9px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ga-ot)}
.ga-tx{display:none}
.ga-t.open .ga-tx{display:block;animation:gaIn .45s var(--ease-o)}
.ga-tx ul{list-style:none;margin:6px 0 12px;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:6px 14px}
.ga-tx li{display:flex;gap:7px;font-size:13px;color:var(--text);line-height:1.45}
.ga-tx li svg{width:15px;height:15px;color:#16a34a;flex-shrink:0;margin-top:2px}
.ga-tf{display:flex;gap:10px;align-items:flex-start;background:#0B132B;color:#fff;border-radius:12px;padding:12px 14px}
.ga-tf b{font:600 13px/1.45 var(--f-disp)}
.ga-tf small{display:block;font:500 10.5px var(--f-mono);color:#9fb3d9;margin-top:2px}
.ga-tc{position:absolute;bottom:14px;right:16px;font:700 11px var(--f-mono);color:#0066FF}
html[data-theme="dark"] .ga-tc{color:#8DB8FF}
.ga-t.open .ga-tc{display:none}
.ga-tx .ga-ed{font:600 11px var(--f-mono);color:var(--muted);margin-top:8px;display:block}

/* ---------- HOW ---------- */
.ga-hwg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:40px;align-items:start}
.ga-hwl{position:sticky;top:140px}
.ga-bk{display:grid;gap:12px}
.ga-bkc{display:grid;grid-template-columns:54px minmax(0,1fr);gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.ga-bkt{width:54px;height:54px;border-radius:14px;background:#0066FF;color:#fff;display:grid;place-items:center;font:800 13px var(--f-mono)}
.ga-bkc.o .ga-bkt{background:#FF8A00}.ga-bkc.n .ga-bkt{background:#0B132B}
html[data-theme="dark"] .ga-bkc.n .ga-bkt{background:#1B2D57}
.ga-bkc b{font:700 15px/1.35 var(--f-disp);color:var(--ink)}
.ga-bkc b em{font:700 11px var(--f-mono);font-style:normal;background:var(--ga-tint);color:#0066FF;border-radius:6px;padding:2px 6px;margin-left:4px}
html[data-theme="dark"] .ga-bkc b em{color:#8DB8FF}
.ga-bkc p{font-size:13px;line-height:1.6;color:var(--text);margin:4px 0}
.ga-bkc small{font:500 10.5px var(--f-mono);color:var(--muted)}
.ga-tl2{list-style:none;margin:0;padding:0 0 0 8px;position:relative}
.ga-tl2:before{content:"";position:absolute;left:27px;top:20px;bottom:20px;width:3px;border-radius:3px;background:var(--line)}
.ga-tl2:after{content:"";position:absolute;left:27px;top:20px;width:3px;height:calc((100% - 40px) * var(--p,0));border-radius:3px;background:#0066FF;transition:height .2s linear}
.ga-tl2 li{position:relative;display:grid;grid-template-columns:42px minmax(0,1fr);gap:16px;padding:0 0 26px}
.ga-tl2 .n{position:relative;z-index:1;width:42px;height:42px;border-radius:50%;background:var(--surface);border:3px solid var(--line);display:grid;place-items:center;font:800 15px var(--f-disp);color:var(--muted);transition:all .4s var(--ease-o)}
.ga-tl2 li.on .n{border-color:#0066FF;background:#0066FF;color:#fff;box-shadow:0 0 0 6px rgba(0,102,255,.15)}
.ga-tl2 b{display:block;font:700 16px var(--f-disp);color:var(--ink);margin:9px 0 4px}
.ga-tl2 p{font-size:13.5px;line-height:1.6;color:var(--text);margin:0}

/* ---------- USE CASES ---------- */
.ga-ucl{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ga-u{display:grid;grid-template-columns:auto 44px minmax(0,1fr);grid-template-rows:auto auto;gap:4px 14px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 20px;transition:border-color .25s,transform .3s var(--ease-o)}
.ga-u:hover{border-color:#0066FF;transform:translateX(4px)}
.ga-un{grid-row:span 2;font:800 28px/1 var(--f-disp);color:var(--line-2);padding-top:6px}
.ga-u i{grid-row:span 2;width:44px;height:44px;border-radius:13px;background:#0066FF;color:#fff;display:grid;place-items:center}
.ga-u i.o{background:#FF8A00}.ga-u i.n{background:#0B132B}
html[data-theme="dark"] .ga-u i.n{background:#1B2D57}
.ga-u i svg{width:20px;height:20px}
.ga-u b{display:block;font:700 15.5px var(--f-disp);color:var(--ink);margin-bottom:3px}
.ga-u p{font-size:13.5px;line-height:1.55;color:var(--text);margin:0}
.ga-ut{grid-column:3;justify-self:start;font:700 10.5px var(--f-mono);color:var(--ga-ot);background:rgba(255,138,0,.1);border-radius:6px;padding:4px 8px;margin-top:6px}

/* ---------- DELIVERY ---------- */
.ga-dlg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.ga-dc{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:8px;transition:transform .3s var(--ease-o),border-color .25s}
.ga-dc:hover{transform:translateY(-4px);border-color:#0066FF}
.ga-dc b{display:flex;align-items:center;gap:7px;font:700 15px var(--f-disp);color:var(--ink)}
.ga-dc b svg{width:16px;height:16px;color:#0066FF}
.ga-dc p{font-size:13px;line-height:1.6;color:var(--text);margin:0}
.ga-dv{height:96px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:7px;overflow:hidden}
.ga-dv i{display:block;height:7px;border-radius:4px;background:var(--line-2);width:90%}
.ga-dv i.s{width:55%}
.ga-dv.rm{flex-direction:row;align-items:flex-end}
.ga-dv.rm i{flex:1;width:auto;border-radius:8px 8px 4px 4px;height:40%;background:#c0392b;opacity:.85}
.ga-dv.rm i:nth-child(2){height:65%;background:#FF8A00}.ga-dv.rm i:nth-child(3){height:90%;background:#0066FF}
.ga-dv.qw{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ga-dv.qw i{width:auto;height:auto;border-radius:8px;background:rgba(22,163,74,.18);border:1.5px solid rgba(22,163,74,.5);position:relative}
.ga-dv.qw i:after{content:"✓";position:absolute;inset:0;display:grid;place-items:center;color:#16a34a;font:700 13px var(--f-disp)}
.ga-dv.ro{flex-direction:row;align-items:center;justify-content:center;gap:16px}
.ga-dv.ro i{width:50px;height:50px;border-radius:50%;background:none;border:7px solid #0066FF;border-right-color:var(--line)}
.ga-dv.ro i:nth-child(2){border-color:#16a34a}
.ga-prom{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.ga-prom span{display:inline-flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:9px 15px;font-size:13px;color:var(--text)}
.ga-prom svg{width:15px;height:15px;color:#0066FF}
html[data-theme="dark"] .ga-prom svg,html[data-theme="dark"] .ga-dc b svg{color:#8DB8FF}
.ga-prom b{color:var(--ink)}

/* ---------- INDIA ---------- */
.ga-lt{border:1px solid var(--line);border-radius:20px;overflow:hidden;background:var(--surface)}
.ga-lr{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr) minmax(0,1.2fr);border-top:1px solid var(--line)}
.ga-lr:first-child{border-top:0}
.ga-lr>*{padding:18px 20px;font-size:13.5px;line-height:1.6;color:var(--text)}
.ga-lr b{display:flex;align-items:flex-start;gap:10px;font:700 14px/1.4 var(--f-disp);color:var(--ink)}
.ga-lr b svg{width:18px;height:18px;color:#FF8A00;flex-shrink:0;margin-top:1px}
.ga-lr span:last-child{background:var(--ga-tint);color:var(--ink)}
.ga-lr.hd>*{padding:12px 20px;font:700 10.5px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:#fff;background:#0B132B}
html[data-theme="dark"] .ga-lr.hd>*{background:#050B1A}

/* ---------- PLANS · ladder ---------- */
.ga-lad{display:grid;gap:14px}
.ga-row{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) 200px;gap:24px;align-items:center;background:var(--surface);border:1.5px solid var(--line);border-radius:22px;padding:22px 24px;transition:transform .3s var(--ease-o),box-shadow .3s}
.ga-row:hover{transform:translateX(4px);box-shadow:0 24px 40px -30px rgba(11,19,43,.5)}
.ga-row.pop{background:#0B132B;border-color:#0B132B}
html[data-theme="dark"] .ga-row.pop{background:#0A1430;border-color:#0066FF}
.ga-flag{position:absolute;top:-11px;left:24px;background:#FF8A00;color:#fff;font:700 10px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;border-radius:999px;padding:4px 11px}
.ga-pt{font:700 10.5px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ga-ot)}
.ga-row.pop .ga-pt{color:#FFB15C}
.ga-rn h3{font:800 18px/1.3 var(--f-disp);margin:4px 0 4px;color:var(--ink)}
.ga-row.pop h3{color:#fff}
.ga-rn small{font-size:12px;color:var(--muted)}
.ga-row.pop .ga-rn small{color:#9fb3d9}
.ga-row ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:8px 16px}
.ga-row li{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--text);line-height:1.45}
.ga-row.pop li{color:#dbe7fb}
.ga-row li svg{width:15px;height:15px;color:#0066FF;flex-shrink:0;margin-top:2px}
.ga-row.pop li svg{color:#7FB0FF}
html[data-theme="dark"] .ga-row li svg{color:#8DB8FF}
.ga-rp{display:flex;flex-direction:column;align-items:flex-end;gap:2px;text-align:right}
.ga-rp b{font:800 30px var(--f-disp);letter-spacing:-.02em;color:var(--ink)}
.ga-row.pop .ga-rp b{color:#fff}
.ga-rp small{font-size:12px;color:var(--muted);margin-bottom:8px}
.ga-row.pop .ga-rp small{color:#9fb3d9}
.ga-addp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:16px}
.ga-addp div{background:var(--surface-2);border:1px dashed var(--line-2);border-radius:16px;padding:14px 16px}
.ga-addp b{display:flex;align-items:center;gap:7px;font:700 14px var(--f-disp);color:var(--ink);margin-bottom:3px}
.ga-addp b svg{width:16px;height:16px;color:#FF8A00}
.ga-addp span{font-size:12.5px;line-height:1.55;color:var(--text)}
#main .ga-addp a,#main .ga-fine a,#main .ga-tm a{color:#0066FF;font-weight:600}
html[data-theme="dark"] #main .ga-addp a,html[data-theme="dark"] #main .ga-fine a{color:#9CC2FF}

/* ---------- CONFIGURE ---------- */
.ga-cfw{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:22px;align-items:start}
.ga-cfi{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;min-width:0}
.ga-step{display:grid;grid-template-columns:34px minmax(0,1fr);gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;min-width:0}
.ga-sn{width:34px;height:34px;border-radius:50%;background:#0B132B;color:#fff;display:grid;place-items:center;font:800 14px var(--f-disp)}
html[data-theme="dark"] .ga-sn{background:#0066FF}
.ga-step .lb,.ga-step label{display:block;font:700 13px var(--f-disp);color:var(--ink);margin-bottom:8px}
.ga-step label small{font:500 11.5px var(--f-body);color:var(--muted);display:block}
.ga-step .seg{display:flex;flex-wrap:wrap;max-width:100%}
.ga-step .seg button{flex:1 1 auto}
.ga-c3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.ga-hint{margin:8px 0 0;font-size:12.5px;color:var(--ga-ot);font-weight:600}
.ga-adds{display:grid;gap:8px}
.ga-adds label{display:flex!important;align-items:center;gap:12px;border:1.5px solid var(--line);border-radius:14px;padding:11px 13px;cursor:pointer;margin:0!important;flex-wrap:wrap;min-width:0;transition:border-color .2s,background .2s}
.ga-adds label.ck{border-color:#0066FF;background:var(--ga-tint)}
.ga-adds label.inc{opacity:.6}
.ga-adds input[type=checkbox]{width:18px;height:18px;accent-color:#0066FF;flex-shrink:0}
.ga-ab{flex:1 1 150px;min-width:0}
.ga-ab b{display:flex;align-items:center;gap:6px;font:700 13.5px var(--f-disp);color:var(--ink)}
.ga-ab b svg{width:15px;height:15px;color:#0066FF}
.ga-ab small{display:block;font:500 12px var(--f-body);color:var(--muted)}
.ga-adds .stp.sm{transform:scale(.85);transform-origin:right center}
.ga-cfo{position:sticky;top:140px}
.ga-rcpt{position:relative;background:var(--ga-card);border:1.5px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 30px 60px -36px rgba(11,19,43,.55)}
.ga-rcpt:before{content:"";position:absolute;left:0;right:0;top:0;height:6px;border-radius:22px 22px 0 0;background:#0066FF}
.ga-rch{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.ga-rch small{font:700 10px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ga-ot)}
.ga-rch h3{font:800 17px var(--f-disp);color:var(--ink);margin:2px 0 0}
.ga-cfl{list-style:none;margin:0 0 10px;padding:0;display:grid;gap:7px}
.ga-cfl li{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--text);border-bottom:1px dashed var(--line-2);padding-bottom:7px}
.ga-cfl li b{font:600 12.5px var(--f-mono);color:var(--ink);white-space:nowrap}
.ga-cfl li.inc b{color:#16a34a}
.ga-cfr{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);padding:5px 0}
.ga-cfr b{font:700 14px var(--f-mono);color:var(--ink)}
.ga-cfr.t{border-top:2px solid var(--ink);margin-top:6px;padding-top:12px}
.ga-cfr.t span{font:700 14px var(--f-disp);color:var(--ink)}
.ga-cfr.t b{font:800 26px var(--f-disp);color:#0066FF}
html[data-theme="dark"] .ga-cfr.t b{color:#8DB8FF}
.ga-cfr b.bump{animation:gaBump .5s var(--ease-o)}
.ga-cfb{display:grid;gap:8px;margin:16px 0 10px}
.ga-cff{display:block;font-size:11px;color:var(--muted);line-height:1.5}

/* ---------- QUIZ · board ---------- */
.ga-qzw{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:22px;align-items:start}
.ga-board{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.ga-q{position:relative;background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px;transition:border-color .3s,background .3s;overflow:hidden}
.ga-q:before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--line-2);transition:background .3s}
.ga-q.s10:before{background:#16a34a}.ga-q.s5:before{background:#FF8A00}.ga-q.s0:before{background:#c0392b}.ga-q.su:before{background:#5B6782}
.ga-q.s10{background:rgba(22,163,74,.05)}.ga-q.s0,.ga-q.su{background:rgba(192,57,43,.04)}
.ga-qh{display:flex;gap:10px;align-items:flex-start}
.ga-qh i{width:32px;height:32px;border-radius:10px;background:var(--ga-tint);color:#0066FF;display:grid;place-items:center;flex-shrink:0}
html[data-theme="dark"] .ga-qh i{color:#8DB8FF}
.ga-qh i svg{width:16px;height:16px}
.ga-qh p{margin:0;font:600 13.5px/1.45 var(--f-disp);color:var(--ink)}
.ga-qh small{display:block;font:500 10.5px var(--f-mono);color:var(--muted);margin-top:2px}
.ga-ql{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}
.ga-ql button{border:1.5px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:9px;padding:6px 4px;font:600 11.5px var(--f-disp);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;transition:all .2s}
.ga-ql button:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.ga-ql button:hover{border-color:var(--c)}
.ga-ql button.on{background:var(--c);border-color:var(--c);color:#fff}
.ga-ql button.on:before{background:#fff}
.ga-qzo{position:sticky;top:140px;background:#0B132B;color:#fff;border-radius:22px;padding:22px;display:grid;gap:14px}
html[data-theme="dark"] .ga-qzo{background:#0A1430;border:1px solid #1e2e52}
.ga-qs b{display:block;font:800 52px/1 var(--f-disp);letter-spacing:-.03em}
.ga-qs span{font:600 13px var(--f-disp);color:#9fb3d9}
.ga-heat{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.ga-heat i{height:26px;border-radius:6px;background:rgba(255,255,255,.1);transition:background .4s,transform .4s var(--ease-o)}
.ga-heat i.s10{background:#16a34a}.ga-heat i.s5{background:#FF8A00}.ga-heat i.s0{background:#c0392b}.ga-heat i.su{background:#5B6782}
.ga-heat i.pop{transform:scaleY(1.25)}
.ga-qn{display:flex;justify-content:space-between;font-size:13px;color:#9fb3d9;border-bottom:1px solid rgba(255,255,255,.12);padding-bottom:10px}
.ga-qn b{font:700 13px var(--f-mono);color:#fff}
.ga-qgap b{font:700 13px var(--f-disp)}
.ga-qgap ol{margin:8px 0 0;padding:0 0 0 18px;display:grid;gap:6px}
.ga-qgap li{font-size:12.5px;color:#dbe7fb;line-height:1.45;animation:gaIn .4s var(--ease-o) both}
.ga-qgap li small{display:block;color:#9fb3d9;font-size:11px}
.ga-qgap li.ph{list-style:none;margin-left:-18px;color:#9fb3d9}
.ga-qb{display:grid;gap:8px}
.ga-qb .btn-line2{background:transparent;color:#fff;border-color:rgba(255,255,255,.35)}
.ga-qzo .ga-fine{color:#9fb3d9;margin:0}

/* ---------- ESTIMATOR ---------- */
.ga-esw{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:22px;align-items:start}
.ga-esi,.ga-eso{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:24px;display:grid;grid-template-columns:minmax(0,1fr);gap:18px;min-width:0}
.ga-esi label{display:flex;justify-content:space-between;gap:10px;font:700 13px var(--f-disp);color:var(--ink);margin-bottom:8px}
.ga-esi label b{font:700 13px var(--f-mono);color:#0066FF}
html[data-theme="dark"] .ga-esi label b{color:#8DB8FF}
.ga-esi .lb{display:block;font:700 13px var(--f-disp);color:var(--ink);margin-bottom:8px}
.ga-esi .seg{display:flex;flex-wrap:wrap;max-width:100%}
.ga-esi .seg button{flex:1 1 auto}
.ga-tg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ga-tg label{display:flex!important;justify-content:flex-start!important;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:12px;padding:10px 11px;cursor:pointer;margin:0!important;font:600 12.5px var(--f-disp)!important;transition:border-color .2s,background .2s}
.ga-tg label.ck{border-color:#0066FF;background:var(--ga-tint)}
.ga-tg input{accent-color:#0066FF;width:16px;height:16px;flex-shrink:0}
.ga-tg span{display:flex;align-items:center;gap:6px}
.ga-tg svg{width:14px;height:14px;color:#0066FF;flex-shrink:0}
.ga-erec{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#0066FF;color:#fff;border-radius:16px;padding:16px 18px;flex-wrap:wrap}
.ga-erec small{display:block;font:700 10px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.8)}
.ga-erec b{display:block;font:800 21px var(--f-disp)}
.ga-erec b.sw{animation:gaIn .45s var(--ease-o)}
.ga-epr{text-align:right}
.ga-epr b.bump{animation:gaBump .5s var(--ease-o)}
.ga-ewhy{margin:0;font-size:13.5px;color:var(--text);line-height:1.55}
.ga-gantt{display:grid;gap:7px}
.ga-gr{display:grid;grid-template-columns:110px minmax(0,1fr);gap:10px;align-items:center;font:600 12px var(--f-disp);color:var(--ink)}
.ga-gt{position:relative;height:18px;border-radius:6px;background:var(--surface-2)}
.ga-gt i{position:absolute;top:0;bottom:0;border-radius:6px;transition:left .5s var(--ease-o),width .5s var(--ease-o)}
.ga-gax{display:grid;grid-template-columns:110px minmax(0,1fr);gap:10px}
.ga-gax div{display:flex;justify-content:space-between;font:500 10.5px var(--f-mono);color:var(--muted)}
.ga-ebr{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.ga-ebr li{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--text);border-bottom:1px dashed var(--line);padding-bottom:6px}
.ga-ebr li b{font:600 12.5px var(--f-mono);color:var(--ink);white-space:nowrap}

/* ---------- VS ---------- */
.ga-vsr{display:grid;gap:10px}
.ga-vh,.ga-v{display:grid;grid-template-columns:minmax(0,.85fr) repeat(3,minmax(0,1fr));gap:10px;align-items:stretch}
.ga-vh span{font:700 10.5px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:0 14px}
.ga-vh span.hl{color:#0066FF}
html[data-theme="dark"] .ga-vh span.hl{color:#8DB8FF}
.ga-v>*{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 14px;font-size:13.5px;color:var(--text);line-height:1.5}
.ga-v b{display:flex;align-items:center;gap:8px;font:700 13.5px var(--f-disp);color:var(--ink);background:var(--surface-2)}
.ga-v b svg{width:16px;height:16px;color:#FF8A00;flex-shrink:0}
.ga-v .hl{border:1.5px solid #0066FF;background:var(--ga-tint);color:var(--ink);font-weight:600}

/* ---------- STEPS · path ---------- */
.ga-path{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;position:relative}
.ga-path:before{content:"";position:absolute;left:8%;right:8%;top:30px;border-top:2px dashed var(--line-2)}
.ga-path li{position:relative;text-align:center;display:flex;flex-direction:column;align-items:center;gap:5px;opacity:0;transform:scale(.9);transition:opacity .5s var(--ease-o),transform .5s var(--ease-o)}
.ga-path li.on{opacity:1;transform:none}
.ga-path i{width:60px;height:60px;border-radius:50%;background:var(--surface);border:2px solid #0066FF;color:#0066FF;display:grid;place-items:center;margin-bottom:6px;box-shadow:0 0 0 6px var(--surface-2)}
html[data-theme="dark"] .ga-path i{color:#8DB8FF;border-color:#8DB8FF}
.ga-path li:nth-child(even) i{border-color:#FF8A00;color:#FF8A00}
.ga-path i svg{width:24px;height:24px}
.ga-path b{font:700 14px var(--f-disp);color:var(--ink)}
.ga-path small{font-size:12.5px;color:var(--muted);line-height:1.45}
.ga-path em{font:700 10.5px var(--f-mono);color:var(--ga-ot);font-style:normal}

/* ---------- RELATED ---------- */
.ga-xs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.ga-rl2{margin:34px 0 14px}
.ga-x{position:relative;display:flex;flex-direction:column;gap:3px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 16px 14px;color:var(--ink);overflow:hidden;transition:border-color .2s,transform .25s var(--ease-o)}
.ga-x:after{content:"→";position:absolute;right:14px;top:14px;color:var(--muted);transition:transform .25s var(--ease-o)}
.ga-x:hover{border-color:#0066FF;transform:translateY(-3px);text-decoration:none}
.ga-x:hover:after{transform:translateX(3px);color:#0066FF}
.ga-x i{width:34px;height:34px;border-radius:10px;background:var(--ga-tint);color:#0066FF;display:grid;place-items:center;margin-bottom:6px}
html[data-theme="dark"] .ga-x i{color:#8DB8FF}
.ga-x i svg{width:17px;height:17px}
.ga-x b{font:700 14px var(--f-disp)}
.ga-x small{font-size:12px;color:var(--muted)}
.ga-x.me{border-color:#0066FF;background:var(--ga-tint)}
.ga-x.me:after{content:"•";color:#FF8A00}

/* ---------- RESPONSIVE ---------- */
@media(max-width:1180px){
  .hero.lh .hero-grid.ga-hg{grid-template-columns:minmax(0,1fr)}
  .hero.lh .ga-stage{max-width:820px;width:100%;margin:0 auto}
  .ga-tiles{grid-template-columns:repeat(3,minmax(0,1fr))}
  .ga-dlg{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ga-path{grid-template-columns:repeat(3,minmax(0,1fr));row-gap:26px}
  .ga-path:before{display:none}
  .ga-xs{grid-template-columns:repeat(3,minmax(0,1fr))}
  .ga-row{grid-template-columns:minmax(0,1fr) 180px}
  .ga-row ul{grid-column:1/-1;grid-row:2}
}
@media(max-width:960px){
  .ga-ovg,.ga-hwg,.ga-cfw,.ga-qzw,.ga-esw,.ga-ucl{grid-template-columns:minmax(0,1fr)}
  .ga-hwl,.ga-cfo,.ga-qzo{position:static}
  .ga-tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ga-stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ga-stats div:nth-child(3){border-left:0}
  .ga-stats div:nth-child(n+3){border-top:1px solid var(--line)}
  .ga-addp{grid-template-columns:minmax(0,1fr)}
  .ga-lr.hd{display:none}
  .ga-lr{grid-template-columns:minmax(0,1fr)}
  .ga-lr>*{padding:10px 18px}
  .ga-lr b{padding-top:16px}
  .ga-lr span:before{content:attr(data-l);display:block;font:700 10px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
  .ga-vh{display:none}
  .ga-v{grid-template-columns:minmax(0,1fr);gap:4px}
  .ga-v span:before{content:attr(data-l);display:block;font:700 10px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
  .ga-xs{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ga-con{max-width:560px;width:100%;margin:0 auto}
}
@media(max-width:640px){
  .hero.lh.ga-hero{padding:24px 0 40px}
  .hero.lh .ga-stage{padding:50px 0 6px}
  .ga-body{grid-template-columns:minmax(0,1fr)}
  .ga-rail{flex-direction:row;gap:8px}
  .ga-rc{padding:9px 10px}
