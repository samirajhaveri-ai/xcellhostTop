<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mailbox Migration Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--acc:#2563EB;--mono:"IBM Plex Mono",monospace;--pop:"Poppins",sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:transparent;width:100%;overflow-x:hidden}
main{width:100%;padding:24px;font-family:var(--pop)}
img{max-width:100%}
.xg-ico{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.glass{background:rgba(9,24,52,.85);backdrop-filter:blur(10px);border:1px solid rgba(156,200,255,.22);border-radius:20px;padding:18px;box-shadow:0 30px 70px rgba(0,0,0,.4)}
.glass-h{display:flex;justify-content:space-between;font:700 11.5px var(--mono);letter-spacing:.1em;color:#9CC8FF;margin-bottom:12px}.glass-h b{color:#4ADE80}
img.lg{flex:none;object-fit:contain;display:inline-block;vertical-align:middle}
.ph-ic{display:inline-grid;place-items:center;flex:none;color:#2563EB}.ph-ic svg{width:100%;height:100%}
.ai-hero .wrap>*{min-width:0}.glass-h{flex-wrap:wrap;gap:4px 10px}
/* hero console */
.mc{border-radius:14px;overflow:hidden;background:#fff;color:#0B1B33;box-shadow:0 20px 50px rgba(0,0,0,.4)}
.mc-b{padding:12px 14px;display:grid;gap:10px}
.pk{display:grid;grid-template-columns:44px minmax(0,1fr);gap:8px;align-items:center}
.pk small{font:700 10px var(--mono);letter-spacing:.1em;color:#64748B}
.pk div{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none}.pk div::-webkit-scrollbar{display:none}
.pk button{display:inline-grid;place-items:center;flex:none;width:34px;height:34px;border-radius:9px;border:1.5px solid #E2E8F0;background:#fff;cursor:pointer;padding:0}
.pk button img,.pk button .ph-ic{width:20px;height:20px}.pk button[aria-pressed=true]{border-color:var(--acc);box-shadow:0 0 0 3px rgba(37,99,235,.18)}
.pt{display:grid;grid-template-columns:minmax(0,1fr) 60px minmax(0,1fr);gap:6px;align-items:center}
.pt>div{border:1.5px solid #E2E8F0;border-radius:12px;padding:8px 10px;display:flex;align-items:center;gap:8px;min-width:0;font:700 12.5px var(--pop)}
.pt>div span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pt>div img,.pt>div .ph-ic{width:22px;height:22px}.pt>div.t{border-color:var(--acc);background:#EFF6FF}
.pt .ar{height:4px;border-radius:99px;background:linear-gradient(90deg,transparent 0 10%,var(--acc) 10% 30%,transparent 30% 50%,var(--acc) 50% 70%,transparent 70%);background-size:24px 100%;animation:mbf .8s linear infinite;position:relative}
.pt .ar:after{content:"";position:absolute;right:-2px;top:-4px;border:6px solid transparent;border-left-color:var(--acc)}
@keyframes mbf{to{background-position:24px 0}}
.ml{list-style:none;display:grid;gap:5px}
.ml li{display:grid;grid-template-columns:minmax(0,1fr) 90px 64px;gap:8px;align-items:center;font:600 12px var(--pop)}
.ml li span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ml li i{height:7px;border-radius:99px;background:#E2E8F0;overflow:hidden}.ml li i u{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),#16A34A);transition:width .35s}
.ml li em{font-style:normal;font:600 10.5px var(--mono);color:#64748B;text-align:right;white-space:nowrap}
.ph{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}.ph div{border-radius:8px;padding:6px 2px;text-align:center;font:700 9.5px var(--mono);background:#F1F5F9;color:#94A3B8;transition:.3s}
.ph div.on{background:#DBEAFE;color:#1D4ED8}.ph div.ok{background:#DCFCE7;color:#166534}
.ms{font:600 11.5px var(--pop);color:#166534;min-height:16px}
@media(max-width:400px){.ml li{grid-template-columns:minmax(0,1fr) 64px}.ml li i{grid-column:1/-1;grid-row:2}.pt{grid-template-columns:minmax(0,1fr) 26px minmax(0,1fr)}.pt>div img,.pt>div .ph-ic{display:none}.pt>div{font-size:11px;padding:7px 8px}}
@media(max-width:400px){main{padding:14px 10px}.glass{padding:12px}.mc-b{padding:12px 10px}.glass-h{font-size:10px;letter-spacing:.04em}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
