.lg-trk{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lg-trk i{position:absolute;top:var(--y);left:-60px;width:34px;height:12px;border-radius:3px;background:rgba(255,138,0,.4);animation:lgDrive var(--s) linear infinite;animation-delay:var(--d)}
.lg-trk i:after{content:"";position:absolute;right:-10px;top:3px;width:9px;height:9px;border-radius:2px;background:rgba(127,176,255,.45)}
@keyframes lgDrive{to{transform:translateX(calc(100vw + 120px))}}
.hero.lh .hero-grid.lg-hg{grid-template-columns:minmax(0,.84fr) minmax(0,1.16fr);gap:34px;align-items:center}
.lg-copy{position:relative;z-index:3;min-width:0}
.lg-hero .lh-title{color:#fff}
.lg-stage{position:relative;z-index:3;display:grid;grid-template-columns:minmax(0,1fr) 190px;grid-template-rows:auto auto auto;gap:10px;align-items:stretch;min-height:0;padding:44px 0 10px;min-width:0}
.lg-stage>.lh-tilt{grid-column:1 / -1;grid-row:2;width:100%;min-width:0}
.lg-stage .lh-orbit{opacity:.35}
.lg-chip{max-width:270px;backdrop-filter:none!important;-webkit-backdrop-filter:none!important;background:rgba(11,19,43,.96)!important;z-index:7}
.lg-chip b{display:block;font:700 12px var(--f-disp);color:#fff;white-space:nowrap}
.lg-chip small{white-space:nowrap}
.lg-chip.sw b,.lg-chip.sw small{animation:lgIn .55s var(--ease-o)}
#main .lg-chO i{background:#FF8A00}
/* manifest ticket rail */
.lg-rail{grid-column:1 / -1;grid-row:1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:rgba(14,26,54,.94);border:1px solid rgba(255,255,255,.14);border-radius:12px;overflow:hidden;min-width:0}
.lg-rc{position:relative;padding:9px 14px;color:#fff;min-width:0}
.lg-rc+.lg-rc{border-left:2px dashed rgba(255,255,255,.18)}
.lg-rc small{display:block;font:600 9.5px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:#9fb3d9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lg-rc b{display:block;font:800 19px var(--f-disp);color:#fff;font-variant-numeric:tabular-nums;margin:2px 0 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lg-rc b.bump{animation:lgBump .5s var(--ease-o)}
.lg-rc u{display:block;height:3px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden;text-decoration:none}
.lg-rc u i{display:block;height:100%;background:#0066FF;transform-origin:left;transform:scaleX(0);transition:transform .5s var(--ease-o)}
.lg-rc.o u i{background:#FF8A00}
/* window */
.lg-win{background:var(--lg-card);border-radius:14px;box-shadow:0 40px 80px -30px rgba(0,0,0,.75),0 0 0 1px rgba(255,255,255,.1);overflow:hidden;color:var(--ink)}
.lg-wh{display:flex;align-items:center;gap:10px;padding:9px 14px;background:#0B132B;color:#cfe0ff}
html[data-theme="dark"] .lg-wh{background:#050B1A}
.lg-wi{width:22px;height:22px;border-radius:6px;background:#0066FF;color:#fff;display:grid;place-items:center;flex-shrink:0}
.lg-wi svg{width:13px;height:13px}
.lg-wh b{min-width:0;font:600 12px var(--f-mono);color:#fff}
.lg-wh b span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lg-wh b span.sw{animation:lgIn .5s var(--ease-o)}
.lg-live{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font:700 10px var(--f-mono);letter-spacing:.12em;color:#3DD47A;font-style:normal;flex-shrink:0}
.lg-live i{width:7px;height:7px;border-radius:50%;background:#3DD47A;animation:lgPulse 1.6s ease-in-out infinite}
.lg-scr{position:relative;height:320px;background:var(--surface-2);overflow:hidden;touch-action:pan-y}
.lg-cv{position:absolute;inset:0;width:100%;height:100%;display:block;opacity:0;transition:opacity .8s var(--ease-o)}
.lg-cv.on{opacity:1}
.lg-cap{position:absolute;left:10px;top:10px;display:inline-flex;align-items:center;gap:8px;background:var(--lg-card);border:1px solid var(--line);border-radius:8px;padding:4px 12px 4px 4px;font:600 11.5px var(--f-disp);color:var(--ink);box-shadow:0 8px 18px -12px rgba(11,19,43,.4);max-width:calc(100% - 140px)}
.lg-cap span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lg-cap b{font:700 10px var(--f-mono);background:#0B132B;color:#fff;border-radius:6px;padding:3px 7px;flex-shrink:0}
html[data-theme="dark"] .lg-cap b{background:#0066FF}
.lg-cap.sw span{animation:lgIn .6s var(--ease-o)}
.lg-smp{position:absolute;right:10px;top:12px;font:600 9.5px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);background:var(--lg-card);border:1px solid var(--line);border-radius:6px;padding:3px 7px}
/* route-stop tabs */
.lg-stops{position:relative;display:flex;align-items:flex-start;gap:0;padding:10px 8px 8px;border-top:1px solid var(--line);background:var(--surface)}
.lg-sl{position:absolute;left:calc(8px + 9%);right:calc(48px + 9%);top:17px;height:3px;background:var(--line);border-radius:3px;overflow:hidden}
.lg-sl:after{content:"";position:absolute;inset:0;background:#FF8A00;transform-origin:left;transform:scaleX(var(--p,0))}
.lg-stops button[data-k]{position:relative;flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:5px;border:0;background:none;cursor:pointer;color:var(--muted);font:600 11px var(--f-disp);padding:0 2px}
.lg-stops button[data-k] i{width:17px;height:17px;border-radius:50%;background:var(--surface);border:3px solid var(--line-2);transition:border-color .3s,background .3s,transform .3s var(--ease-o)}
.lg-stops button[data-k] span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.lg-stops button[data-k].past i{border-color:#FF8A00;background:#FF8A00}
.lg-stops button[data-k].on i{border-color:#0066FF;background:var(--surface);transform:scale(1.25);box-shadow:0 0 0 4px rgba(0,102,255,.18)}
.lg-stops button[data-k].on,.lg-stops button[data-k]:hover{color:var(--ink)}
.lg-pz{flex-shrink:0;width:32px;height:32px;margin-left:6px;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;color:var(--ink);display:grid;place-items:center;cursor:pointer;align-self:center}
.lg-pz svg{width:12px;height:12px}
.lg-pz .pl,.lg-pz.paused .pa{display:none}
.lg-pz.paused .pl{display:block}
/* row 3 */
.lg-log{grid-column:1;grid-row:3;overflow:hidden;position:relative;z-index:5;background:#0B132B;border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:10px 12px;color:#fff;box-shadow:0 24px 50px -20px rgba(0,0,0,.85);min-width:0}
.lg-logh{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:7px}
.lg-logh span{display:flex;align-items:center;gap:6px;font:700 9.5px var(--f-mono);letter-spacing:.1em;min-width:0}
.lg-logh span b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lg-logh span i{width:7px;height:7px;border-radius:2px;background:#FF8A00;flex-shrink:0;animation:lgBlink 1.4s steps(1) infinite}
.lg-logh em{font:500 9px var(--f-mono);color:#9fb3d9;font-style:normal}
.lg-log ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px 14px;min-height:62px;align-content:start}
.lg-log li{font:500 10px/1.35 var(--f-mono);color:#8a9bbd;border-left:2px solid rgba(127,176,255,.3);padding-left:7px;overflow-wrap:anywhere;min-width:0}
.lg-log li b{font-weight:700;color:#7FB0FF;margin-right:5px}
.lg-log li.go{color:#fff;border-left-color:#FF8A00}.lg-log li.go b{color:#FFB15C}
.lg-log li.ok{color:#d6e2f5;border-left-color:#3DD47A}.lg-log li.ok b{color:#5FE08D}
.lg-log li.bad{color:#fff;border-left-color:#FF6B5B}.lg-log li.bad b{color:#FF8F82}
.lg-log li.nw{animation:lgIn .45s var(--ease-o) both}
.lg-pw.lh-powered{grid-column:2;grid-row:3;position:relative;left:auto;bottom:auto;align-self:stretch;margin:0;background:#0B132B;max-width:none;min-width:0;display:flex;flex-direction:column;justify-content:center;border-radius:12px}
.lg-pw.lh-powered>span{font-size:12px;line-height:1.25;align-items:center}
.lg-pw em{display:block;font:500 9.5px/1.4 var(--f-mono);color:#9fb6de;font-style:normal;margin-top:4px}
.lg-tile{width:24px;height:24px;border-radius:6px;background:#FF8A00;color:#fff;display:grid;place-items:center;flex-shrink:0;font:800 14px/1 var(--f-disp)}

/* proof + sub-nav */
.lg-proof b{color:var(--ink)}
.lg-sub{position:sticky;top:var(--lg-hh);z-index:60;background:rgba(255,255,255,.97);border-bottom:1px solid var(--line);box-shadow:0 8px 20px -18px rgba(11,19,43,.5)}
html[data-theme="dark"] .lg-sub{background:rgba(6,18,42,.95)}
.lg-subt{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.lg-subt::-webkit-scrollbar{display:none}
.lg-subt a{position:relative;flex-shrink:0;font:600 12.5px var(--f-disp);color:var(--muted);padding:12px 12px 11px;transition:color .2s}
.lg-subt a:before{content:"";position:absolute;left:50%;bottom:4px;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:#FF8A00;transform:scale(0);transition:transform .3s var(--ease-o)}
.lg-subt a:hover{color:var(--ink);text-decoration:none}
.lg-subt a.on{color:var(--ink)}
.lg-subt a.on:before{transform:scale(1)}

/* ---------- OVERVIEW ---------- */
.lg-ovg{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.6fr);gap:26px;align-items:center}
.lg-ovc.pp-cols{margin:0}
.lg-ovs{display:grid;grid-template-columns:1fr 1fr;gap:0;border:2px solid #0B132B;border-radius:14px;overflow:hidden}
html[data-theme="dark"] .lg-ovs{border-color:var(--line-2)}
.lg-ovs div{padding:16px;border-right:1px dashed var(--line-2);border-bottom:1px dashed var(--line-2);background:var(--surface)}
.lg-ovs div:nth-child(2n){border-right:0}.lg-ovs div:nth-child(n+3){border-bottom:0}
.lg-ovs b{display:block;font:800 24px var(--f-disp);color:var(--ink);font-variant-numeric:tabular-nums}
.lg-ovs span{font:600 10.5px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.lg-ov .prov svg{width:16px;height:16px;flex-shrink:0}

/* ---------- CHALLENGES · departures board ---------- */
.lg-board{background:#0B132B;border-radius:14px;padding:10px;box-shadow:0 30px 60px -34px rgba(11,19,43,.8);overflow:hidden}
html[data-theme="dark"] .lg-board{background:#050B1A;border:1px solid var(--line)}
.lg-bh,.lg-br{display:grid;grid-template-columns:70px minmax(0,1.1fr) minmax(0,1.4fr) 100px minmax(0,1fr);gap:14px;align-items:center;padding:10px 14px}
.lg-bh span{font:700 10px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:#FFB15C}
.lg-br{border-top:1px solid rgba(255,255,255,.08);transition:background .3s}
.lg-br:hover{background:rgba(255,255,255,.04)}
.lg-ln{font:800 13px var(--f-mono);color:#7FB0FF}
.lg-br b{display:flex;align-items:center;gap:8px;font:700 14px var(--f-disp);color:#fff}
.lg-br b svg{width:16px;height:16px;color:#FFB15C;flex-shrink:0}
.lg-br p{margin:0;font-size:12.5px;line-height:1.5;color:#c9d6ee}
.lg-br em{justify-self:start;font:800 10.5px var(--f-mono);letter-spacing:.1em;font-style:normal;padding:4px 8px;border-radius:4px;animation:lgBlink 2.4s steps(1) infinite}
.lg-br em.d{background:rgba(255,138,0,.18);color:#FFB15C}.lg-br em.x{background:rgba(255,107,91,.18);color:#FF8F82}
.lg-br a{font:700 12.5px var(--f-disp);color:#8DB8FF}
.lg-br a:hover{color:#fff;text-decoration:none}
.lg-board.pre .lg-br{opacity:0;transform:rotateX(70deg)}
.lg-br{transition:opacity .5s var(--ease-o),transform .5s var(--ease-o),background .3s;transform-origin:top}

/* ---------- SOLUTION STACK · conveyors ---------- */
.lg-cvy{display:flex;flex-direction:column;gap:16px}
.lg-belt{display:grid;grid-template-columns:150px minmax(0,1fr);gap:0;align-items:stretch;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
.lg-bk{display:flex;flex-direction:column;justify-content:center;gap:6px;padding:16px;background:#0066FF;color:#fff}
.lg-belt.o .lg-bk{background:#FF8A00}.lg-belt.n .lg-bk{background:#0B132B}
html[data-theme="dark"] .lg-belt.n .lg-bk{background:#2C3D68}
.lg-bk b{font:700 17px var(--f-disp)}
.lg-bk svg{width:22px;height:22px;order:-1}
.lg-bt{position:relative;display:flex;gap:10px;padding:16px 14px 22px;overflow-x:auto;scrollbar-width:thin}
.lg-bt:after{content:"";position:absolute;left:0;right:0;bottom:6px;height:8px;background:repeating-linear-gradient(90deg,var(--line-2) 0 14px,transparent 14px 22px);background-size:44px 8px;animation:lgBelt 1.2s linear infinite}
@keyframes lgBelt{to{background-position:44px 0}}
.lg-bt a{flex:1 0 150px;position:relative;display:flex;flex-direction:column;gap:3px;background:var(--surface-2);border:1.5px solid var(--line);border-radius:6px;padding:12px;color:var(--ink);transition:transform .3s var(--ease-o),border-color .3s}
.lg-bt a:before{content:"";position:absolute;left:50%;top:-1px;width:30px;height:5px;margin-left:-15px;background:rgba(255,138,0,.5);border-radius:0 0 3px 3px}
.lg-bt a:hover{transform:translateY(-4px);border-color:#0066FF;text-decoration:none}
.lg-bt a b{font:700 13px var(--f-disp)}
.lg-bt a small{font:600 11px var(--f-mono);color:var(--lg-ot)}
.lg-cvy.pre .lg-bt a{opacity:0;transform:translateX(-30px)}
.lg-bt a{transition:opacity .5s var(--ease-o),transform .5s var(--ease-o),border-color .3s}

/* ---------- ARCHITECTURE · route stations ---------- */
.lg-rt{position:relative;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;align-items:start;padding:30px 0 6px}
.lg-rline{position:absolute;left:5%;right:5%;top:44px;height:4px;background:var(--line-2);border-radius:4px;overflow:hidden}
.lg-rline i{position:absolute;top:0;left:-20%;width:20%;height:100%;background:#FF8A00;border-radius:4px;animation:lgRun 4s linear infinite}
@keyframes lgRun{to{left:100%}}
.lg-stn{position:relative;display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:30px 12px 12px;min-width:0}
.lg-stn.dc{border:2px solid #0066FF;background:var(--lg-bs)}
.lg-stn.ext{border-style:dashed;border-color:#FF8A00}
.lg-sn{position:absolute;top:-16px;left:50%;margin-left:-16px;width:32px;height:32px;border-radius:50%;background:#0B132B;color:#fff;display:grid;place-items:center;font:800 11px var(--f-mono);border:3px solid var(--surface-2)}
.lg-stn.dc .lg-sn{background:#0066FF}.lg-stn.ext .lg-sn{background:#FF8A00}
.lg-cl{font:700 10.5px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink);text-align:center}
.lg-ab{display:flex;align-items:center;gap:7px;width:100%;border:1.5px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:8px;padding:9px 10px;font:600 12.5px var(--f-disp);cursor:pointer;text-align:left;transition:border-color .2s,background .2s,transform .2s var(--ease-o)}
.lg-ab svg{width:15px;height:15px;color:#0066FF;flex-shrink:0}
html[data-theme="dark"] .lg-ab svg{color:#9CC2FF}
.lg-ab:hover{border-color:#0066FF;transform:translateY(-1px)}
.lg-ab.on{border-color:#0066FF;background:#0066FF;color:#fff}
.lg-ab.on svg{color:#fff}
.lg-ard{margin-top:14px;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) auto;gap:18px;align-items:center;background:#0B132B;color:#fff;border-radius:14px;padding:20px 22px}
html[data-theme="dark"] .lg-ard{background:#0E1A36;border:1px solid var(--line)}
.lg-ard .lg-k{color:#FFB15C}
.lg-ard h3{margin:4px 0 6px;font:700 19px var(--f-disp);color:#fff}
.lg-ard h3.sw,.lg-ard p.sw{animation:lgIn .45s var(--ease-o)}
.lg-ard p{margin:0;font-size:13.5px;color:#c9d6ee;line-height:1.6}
.lg-arl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.lg-arl li{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:#e3ebfa;background:rgba(255,255,255,.06);border-radius:8px;padding:8px 10px;line-height:1.45;animation:lgIn .4s var(--ease-o) both}
.lg-arl li svg{width:14px;height:14px;color:#FFB15C;flex-shrink:0;margin-top:2px}
.lg-arx{font:700 13px var(--f-disp);color:#FFB15C;white-space:nowrap}
.lg-arx:hover{text-decoration:none;color:#fff}

/* ---------- REG TABLE ---------- */
.lg-ct{min-width:760px}
.lg-ct td{font-size:13px;line-height:1.5;vertical-align:top}
.lg-ct td:first-child{white-space:normal;width:32%}
.lg-ct td:first-child b{display:block;font:700 13.5px var(--f-disp);color:var(--ink);margin-top:5px}
.lg-ct td:first-child small{display:block;font:500 11.5px/1.45 var(--f-body);color:var(--muted);margin-top:3px}
.lg-ct td a{color:#0066FF;font-weight:600}
html[data-theme="dark"] .lg-ct td a{color:#9CC2FF}
.lg-ct td:last-child{font-size:12.5px;color:var(--text)}
.lg-ct tbody tr{transition:opacity .5s var(--ease-o),transform .5s var(--ease-o)}
.lg-ct.pre tbody tr{opacity:0;transform:translateY(8px)}
.lg-ct tbody tr.hid{display:none}
.lg-rb{display:inline-block;white-space:nowrap;font:800 10px var(--f-mono);letter-spacing:.08em;color:#fff;background:#0066FF;border-radius:3px;padding:3px 8px}
.lg-rb.n{background:#0B132B}.lg-rb.o{background:#FF8A00}
html[data-theme="dark"] .lg-rb.n{background:#2C3D68}
.lg-rf{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.lg-rf button{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;padding:7px 14px;font:600 13px var(--f-disp);cursor:pointer;transition:border-color .2s,background .2s}
.lg-rf button em{font:700 10.5px var(--f-mono);font-style:normal;color:var(--muted);background:var(--surface-2);border-radius:4px;padding:1px 7px}
.lg-rf button:hover{border-color:#0066FF}
.lg-rf button.on{background:#0B132B;border-color:#0B132B;color:#fff}
html[data-theme="dark"] .lg-rf button.on{background:#0066FF;border-color:#0066FF}
.lg-rf button.on em{background:rgba(255,255,255,.2);color:#fff}
.lg-note{display:flex;gap:12px;align-items:flex-start;margin-top:16px;background:var(--surface);border:1px solid var(--line);border-left:4px solid #FF8A00;border-radius:8px;padding:14px 16px}
.lg-note i{color:var(--lg-ot);flex-shrink:0;margin-top:2px}.lg-note i svg{width:18px;height:18px}
.lg-note p{margin:0;font-size:13px;color:var(--text);line-height:1.6}

/* e-way bill quick check */
.lg-ewb{margin-top:16px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 150px;gap:20px;align-items:center;background:var(--surface);border:2px dashed #FF8A00;border-radius:14px;padding:18px 20px}
.lg-ewb h3{margin:4px 0 6px;font:700 17px var(--f-disp);color:var(--ink)}
.lg-ewb p{margin:0;font-size:12.5px;line-height:1.55;color:var(--text)}
.lg-ewi{display:flex;flex-direction:column;gap:12px;min-width:0}
.lg-ewi label b{float:right;font:800 13px var(--f-mono);color:#0066FF}
html[data-theme="dark"] .lg-ewi label b{color:#9CC2FF}
.lg-ewo{text-align:center;background:#0B132B;border-radius:12px;padding:14px 10px;color:#fff}
html[data-theme="dark"] .lg-ewo{background:#0066FF}
.lg-ewo b{display:block;font:800 40px/1 var(--f-disp);font-variant-numeric:tabular-nums}
.lg-ewo b.bump{animation:lgBump .5s var(--ease-o)}
.lg-ewo span{font:600 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:#c9d6ee}
.lg-ewd{display:flex;gap:3px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.lg-ewd i{width:10px;height:10px;border-radius:2px;background:#FF8A00;animation:lgIn .3s var(--ease-o) both}

/* ---------- SEGMENTS (card picker) ---------- */
.lg-sgt{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.lg-sgt button{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:14px;cursor:pointer;transition:border-color .2s,background .2s,transform .2s var(--ease-o)}
.lg-sgt button em{position:absolute;right:12px;top:10px;font:700 10px var(--f-mono);font-style:normal;color:var(--muted)}
.lg-sgt button svg{width:22px;height:22px;color:#0066FF}
html[data-theme="dark"] .lg-sgt button svg{color:#9CC2FF}
.lg-sgt button span{font:700 14px var(--f-disp);color:var(--ink)}
.lg-sgt button:hover{transform:translateY(-3px);border-color:var(--line-2)}
.lg-sgt button.on{border-color:#0066FF;background:var(--lg-bs);box-shadow:inset 0 -4px 0 #FF8A00}
.lg-sgp{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1.1fr);gap:14px;margin-top:14px}
.lg-sgc{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px}
.lg-sgc.hl{border:2px solid #0066FF;background:var(--lg-bs)}
.lg-sgc ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.lg-sgc li{display:flex;gap:9px;align-items:flex-start;font-size:13px;color:var(--text);line-height:1.45;animation:lgIn .4s var(--ease-o) both}
.lg-sgc li svg{width:15px;height:15px;color:#0066FF;flex-shrink:0;margin-top:2px}
html[data-theme="dark"] .lg-sgc li svg{color:#9CC2FF}
.lg-sgc h3{margin:0;font:700 18px var(--f-disp);color:var(--ink)}
.lg-sgc p{margin:0;font-size:13.5px;color:var(--text);line-height:1.55}
.lg-sgc .btn{align-self:flex-start;margin-top:auto}

/* ---------- USE CASES · day timeline ---------- */
.lg-tl{position:relative;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 40px}
.lg-tl:before{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;margin-left:-1px;background:repeating-linear-gradient(180deg,var(--line-2) 0 8px,transparent 8px 14px)}
.lg-u{position:relative;display:grid;grid-template-columns:70px minmax(0,1fr);gap:14px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;transition:transform .35s var(--ease-o),border-color .3s}
.lg-u:hover{transform:translateY(-3px);border-color:#0066FF}
.lg-ut{font:800 16px var(--f-mono);color:#fff;background:#0B132B;border-radius:8px;padding:8px 6px;text-align:center}
html[data-theme="dark"] .lg-ut{background:#0066FF}
.lg-u:nth-child(even) .lg-ut{background:#FF8A00}
.lg-u h3{margin:0 0 4px;font:700 15.5px var(--f-disp);color:var(--ink)}
.lg-u p{margin:0 0 6px;font-size:13px;line-height:1.55;color:var(--text)}
.lg-u a{font:700 12.5px var(--f-disp);color:#0066FF}
html[data-theme="dark"] .lg-u a{color:#9CC2FF}

/* ---------- DELIVERY ---------- */
.lg-dlg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
.lg-d{position:relative;padding:20px 22px 18px 18px;display:flex;flex-direction:column;gap:8px}
.lg-d+.lg-d{border-left:1px solid var(--line)}
.lg-d:after{content:"";position:absolute;right:-9px;top:50%;width:16px;height:16px;margin-top:-8px;background:var(--surface);border-top:1px solid var(--line);border-right:1px solid var(--line);transform:rotate(45deg);z-index:1}
.lg-d:last-child:after{display:none}
.lg-d b{display:flex;align-items:center;gap:8px;font:700 15px var(--f-disp);color:var(--ink)}
.lg-d b svg{width:18px;height:18px;color:#FF8A00}
.lg-d p{margin:0;flex:1;font-size:13px;color:var(--text);line-height:1.55}
.lg-d em{align-self:flex-start;font:600 10.5px var(--f-mono);font-style:normal;color:#0066FF;background:var(--chip);border-radius:4px;padding:3px 7px}
html[data-theme="dark"] .lg-d em{color:#9CC2FF}

/* ---------- PLANS ---------- */
.lg-plg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:stretch}
.lg-plc{position:relative;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:24px 22px;display:flex;flex-direction:column;gap:10px;transition:transform .35s var(--ease-o),box-shadow .35s,border-color .3s}
.lg-plc:hover{transform:translateY(-6px);box-shadow:var(--sh)}
.lg-plc.pop{background:#0B132B;border-color:#0B132B;box-shadow:0 30px 60px -34px rgba(11,19,43,.8)}
html[data-theme="dark"] .lg-plc.pop{background:#0E1A36;border-color:#0066FF}
.lg-plc.pop h3,.lg-plc.pop .lg-pr b{color:#fff}
.lg-plc.pop .lg-pr small{color:#9fb3d9}
.lg-plc.pop li{color:#c9d6ee}
.lg-plc.pop li svg{color:#FFB15C}
.lg-plc.pop .lg-pt{color:#FFB15C}
.lg-flag{position:absolute;top:-12px;right:18px;background:#FF8A00;color:#fff;font:700 10.5px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;border-radius:4px;padding:5px 11px}
.lg-pt{font:700 10.5px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--lg-ot)}
.lg-plc h3{margin:0;font:700 20px var(--f-disp);color:var(--ink)}
.lg-pr{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.lg-pr b{font:800 32px var(--f-disp);color:var(--ink);letter-spacing:-.01em}
.lg-pr small{font-size:12.5px;color:var(--muted)}
.lg-plc ul{list-style:none;margin:6px 0 10px;padding:0;display:flex;flex-direction:column;gap:8px;flex:1}
.lg-plc li{display:flex;gap:9px;align-items:flex-start;font-size:13.5px;color:var(--text);line-height:1.4}
.lg-plc li svg{width:16px;height:16px;color:#0066FF;flex-shrink:0;margin-top:1px}
html[data-theme="dark"] .lg-plc li svg{color:#9CC2FF}
.lg-plc .btn{justify-content:center}
.lg-svc{margin-top:18px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.lg-svc div{background:var(--surface);border:1px dashed var(--line-2);border-radius:8px;padding:12px 14px}
.lg-svc b{display:block;font:800 17px var(--f-disp);color:var(--ink)}
.lg-svc span{font-size:12.5px;color:var(--text);line-height:1.45}

/* ---------- CONFIGURATOR ---------- */
.lg-cfw{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px;align-items:start}
.lg-cfw>*{min-width:0}
.lg-cfi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:24px;display:flex;flex-direction:column;gap:18px}
.lg-cfi .seg{flex-wrap:wrap}
.lg-lb{margin-bottom:-8px}
.lg-cf2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.lg-cf3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.lg-cf2>*,.lg-cf3>*{min-width:0}
.lg-cf3[hidden],.fld[hidden]{display:none}
.lg-adds{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.lg-adds label{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;transition:border-color .2s,background .2s;min-width:0}
.lg-adds label:hover{border-color:var(--line-2)}
.lg-adds label.ck{border-color:#0066FF;background:var(--lg-bs)}
.lg-adds input[type=checkbox]{width:17px;height:17px;accent-color:#0066FF;flex-shrink:0}
.lg-ab2{flex:1;min-width:0}
.lg-ab2 b{display:flex;align-items:center;gap:7px;font:600 13px var(--f-disp);color:var(--ink)}
.lg-ab2 b svg{width:15px;height:15px;color:#0066FF;flex-shrink:0}
html[data-theme="dark"] .lg-ab2 b svg{color:#9CC2FF}
.lg-ab2 small{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}
.lg-cfo{position:sticky;top:calc(var(--lg-hh) + 60px)}
.lg-cfs{background:#0B132B;color:#fff;border-radius:12px;padding:22px;display:flex;flex-direction:column;gap:10px;box-shadow:0 30px 60px -30px rgba(11,19,43,.8)}
html[data-theme="dark"] .lg-cfs{background:#0E1A36;border:1px solid var(--line)}
.lg-cfk{font:700 10.5px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:#FFB15C}
.lg-cfs h3{margin:0;font:700 19px var(--f-disp);color:#fff}
.lg-cfl{list-style:none;margin:0;padding:10px 0 0;display:flex;flex-direction:column;gap:6px;border-top:1px solid rgba(255,255,255,.12)}
.lg-cfl li{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:#c9d6ee;animation:lgIn .35s var(--ease-o)}
.lg-cfl li span{min-width:0}
.lg-cfl li b{color:#fff;font-weight:600;white-space:nowrap}
.lg-cfl li.q b{color:#FFB15C}
.lg-cft{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
.lg-cft div{background:rgba(255,255,255,.06);border-radius:8px;padding:9px 11px}
.lg-cft span{display:block;font:600 10px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:#9fb3d9}
.lg-cft b{font:800 17px var(--f-disp);color:#fff}
.lg-cfr{display:flex;justify-content:space-between;font-size:13px;color:#c9d6ee}
.lg-cfr b{color:#fff;font-variant-numeric:tabular-nums}
.lg-cfr.t{border-top:1px solid rgba(255,255,255,.14);padding-top:10px;font-weight:700;color:#fff}
.lg-cfr.t b{font:800 24px var(--f-disp);color:#fff}
.lg-cfr.t b.bump{animation:lgBump .5s var(--ease-o)}
.lg-cfb{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.lg-cfb .btn{justify-content:center}
.lg-cff{font-size:11px;color:#9fb3d9;line-height:1.5}
.lg-num{width:100%;border:1.5px solid var(--line);border-radius:8px;padding:9px 12px;font:600 14px var(--f-body);background:var(--surface);color:var(--ink)}
.lg-num:focus{outline:none;border-color:#0066FF}
select.lg-num{appearance:auto;cursor:pointer}

/* ---------- READINESS ---------- */
.lg-rdw,.lg-sw{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:20px;align-items:start}
.lg-rdw>*,.lg-sw>*{min-width:0}
.lg-rdi,.lg-swi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px;display:flex;flex-direction:column;gap:14px}
.lg-fw{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.lg-fw li{display:grid;grid-template-columns:72px minmax(0,1fr);gap:10px;align-items:start;font-size:12.5px;color:var(--text);line-height:1.45;background:var(--surface-2);border-radius:8px;padding:8px 10px;animation:lgIn .4s var(--ease-o) both}
.lg-fw li .lg-rb{justify-self:start}
.lg-fw li b{color:var(--ink);font-weight:700}
.lg-fw li.na{opacity:.65}
.lg-gq{display:flex;flex-direction:column;gap:6px}
.lg-q{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:9px 12px;animation:lgIn .4s var(--ease-o) both}
.lg-q span{font-size:13px;color:var(--ink);line-height:1.4}
.lg-q span small{display:block;font:500 10.5px var(--f-mono);color:var(--muted);margin-top:2px}
.lg-yn{display:flex;gap:4px}
.lg-yn button{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;padding:5px 11px;font:700 12px var(--f-disp);cursor:pointer;min-width:44px}
.lg-yn button.on[data-a="1"]{background:#16a34a;border-color:#16a34a;color:#fff}
.lg-yn button.on[data-a="0"]{background:#c0392b;border-color:#c0392b;color:#fff}
.lg-rdo,.lg-swo{position:sticky;top:calc(var(--lg-hh) + 60px);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--sh)}
.lg-gauge{position:relative;width:210px;max-width:100%;align-self:center}
.lg-gauge svg{width:100%;display:block}
.lg-gauge path{fill:none;stroke-width:14;stroke-linecap:round}
.lg-gauge .t{stroke:var(--surface-2)}
.lg-gauge .v{stroke:#0066FF;stroke-dasharray:263.9;stroke-dashoffset:263.9;transition:stroke-dashoffset .7s var(--ease-o),stroke .3s}
.lg-gauge b{position:absolute;left:0;right:0;bottom:22px;text-align:center;font:800 30px var(--f-disp);color:var(--ink)}
.lg-gauge small{position:absolute;left:0;right:0;bottom:2px;text-align:center;font:600 11px var(--f-mono);color:var(--muted)}
.lg-gaps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.lg-gaps li{display:flex;gap:9px;align-items:flex-start;font-size:12.5px;color:var(--text);background:var(--surface-2);border-radius:8px;padding:8px 10px;line-height:1.45;animation:lgIn .4s var(--ease-o) both}
.lg-gaps li i{flex-shrink:0;width:22px;height:22px;border-radius:6px;background:#c0392b;color:#fff;display:grid;place-items:center}
.lg-gaps li.ok i{background:#16a34a}
.lg-gaps li i svg{width:12px;height:12px}
.lg-gaps li b{color:var(--ink)}
.lg-rdf{display:flex;gap:8px;flex-wrap:wrap;border-top:1px dashed var(--line);padding-top:12px}
.lg-rdf .btn{white-space:normal;text-align:center}

/* ---------- FLEET IOT CALCULATOR ---------- */
.lg-fw2{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:20px;align-items:start}
.lg-fw2>*{min-width:0}
.lg-fwi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:14px}
.lg-fwi label b{float:right;font:800 13px var(--f-mono);color:#0066FF}
html[data-theme="dark"] .lg-fwi label b{color:#9CC2FF}
.lg-chk{display:flex;flex-wrap:wrap;gap:8px}
.lg-chk label{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer;font:600 12.5px var(--f-disp);color:var(--ink);transition:border-color .2s,background .2s}
.lg-chk label svg{width:15px;height:15px;color:#0066FF}
.lg-chk label.ck{border-color:#0066FF;background:var(--lg-bs)}
.lg-chk input{width:15px;height:15px;accent-color:#0066FF}
.lg-fwo{position:sticky;top:calc(var(--lg-hh) + 60px);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--sh)}
.lg-tk{display:flex;justify-content:space-between;font:600 10px var(--f-mono);color:var(--muted);margin-top:4px}
.lg-tv{background:#0B132B;border-radius:12px;padding:14px 16px;color:#fff}
html[data-theme="dark"] .lg-tv{background:#0066FF}
.lg-tv small{display:block;font:600 10px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:#9fb3d9}
html[data-theme="dark"] .lg-tv small{color:#dce8ff}
.lg-tv b{display:block;font:800 28px/1.15 var(--f-disp);font-variant-numeric:tabular-nums;margin:4px 0 2px}
.lg-tv b.bump{animation:lgBump .5s var(--ease-o)}
.lg-tv span{font-size:12.5px;color:#c9d6ee}
html[data-theme="dark"] .lg-tv span{color:#eef4ff}
.lg-mtr>div:first-child{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--text)}
.lg-mtr b{font:800 15px var(--f-disp);color:var(--ink);font-variant-numeric:tabular-nums}
.lg-bar{position:relative;height:14px;border-radius:7px;background:var(--surface-2);margin:8px 0 6px;overflow:visible}
.lg-bar i{position:absolute;left:0;top:0;bottom:0;border-radius:7px;background:#0066FF;transition:width .6s var(--ease-o),background .3s}
.lg-bar i.over{background:#c0392b}
.lg-bar em{position:absolute;top:-4px;bottom:-4px;width:2px;background:#FF8A00}
.lg-mtr small{font:500 11.5px var(--f-mono);color:var(--muted)}
.lg-tbk2{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
.lg-tbk2 li{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--text);border-bottom:1px dashed var(--line);padding-bottom:5px}
.lg-tbk2 li b{color:var(--ink);font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.lg-tbk2 li.t{font-weight:700}
.lg-esf{border:1px dashed var(--line-2);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.lg-esf b{font:700 10.5px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink)}
.lg-esf code{font:500 11.5px/1.45 var(--f-mono);color:var(--text);white-space:normal;word-break:break-word;background:none;padding:0}
.lg-fwo .btn{align-self:flex-start;white-space:normal;max-width:100%;text-align:center}
.lg-fwo .lg-fine{margin:0}

/* ---------- VS ---------- */
.lg-vsr{display:flex;flex-direction:column;gap:8px}
.lg-vh,.lg-v{display:grid;grid-template-columns:minmax(0,1.1fr) repeat(3,minmax(0,1fr));gap:10px;align-items:center}
.lg-vh span{font:700 10.5px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:0 14px}
.lg-vh span.hl{color:#0066FF}
html[data-theme="dark"] .lg-vh span.hl{color:#8DB8FF}
.lg-v{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px;transition:border-color .3s,transform .3s var(--ease-o)}
.lg-v:hover{border-color:#0066FF;transform:translateY(-2px)}
.lg-v b{display:flex;align-items:center;gap:6px;font:700 13.5px var(--f-disp);color:var(--ink);padding:8px}
.lg-v b svg{width:15px;height:15px;color:#0066FF;flex-shrink:0}
html[data-theme="dark"] .lg-v b svg{color:#9CC2FF}
.lg-v span{font-size:13px;color:var(--text);padding:8px;line-height:1.45}
.lg-v span.hl{background:var(--lg-bs);border-radius:6px;color:var(--ink);font-weight:600}

/* ---------- STEPS · horizontal route ---------- */
.lg-stp{list-style:none;margin:0;padding:34px 0 0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;position:relative}
.lg-stp:before{content:"";position:absolute;left:8%;right:8%;top:52px;height:3px;background:var(--line-2)}
.lg-stp li{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;opacity:.35;transform:translateY(10px);transition:opacity .5s var(--ease-o),transform .5s var(--ease-o)}
.lg-stp li.on{opacity:1;transform:none}
.lg-stp .n{position:relative;z-index:1;width:40px;height:40px;border-radius:10px;background:var(--surface);border:2px solid var(--line-2);color:var(--muted);display:grid;place-items:center;font:800 13px var(--f-mono);transition:background .4s,color .4s,border-color .4s}
.lg-stp li.on .n{background:#0066FF;border-color:#0066FF;color:#fff}
.lg-stp li.on:nth-child(even) .n{background:#FF8A00;border-color:#FF8A00}
.lg-stp b{font:700 14px var(--f-disp);color:var(--ink)}
.lg-stp small{font-size:12.5px;color:var(--text);line-height:1.45}
.lg-stp em{font:600 10.5px var(--f-mono);color:#0066FF;font-style:normal;background:var(--chip);border-radius:4px;padding:3px 7px}
html[data-theme="dark"] .lg-stp em{color:#9CC2FF}

/* ---------- RELATED ---------- */
.lg-fam{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:34px}
.lg-fam a{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;padding:8px 12px;font:600 13px var(--f-disp);transition:border-color .2s,transform .2s var(--ease-o)}
.lg-fam a svg{width:15px;height:15px;color:#0066FF}
html[data-theme="dark"] .lg-fam a svg{color:#9CC2FF}
.lg-fam a:hover{border-color:#0066FF;transform:translateY(-2px);text-decoration:none}
.lg-fam a.on{background:#0B132B;border-color:#0B132B;color:#fff}
.lg-fam a.on svg{color:#FFB15C}
html[data-theme="dark"] .lg-fam a.on{background:#0066FF;border-color:#0066FF}
.lg-sh2{margin-top:6px}
.lg-xs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.lg-x{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:13px 14px;color:var(--ink);transition:transform .3s var(--ease-o),border-color .3s,box-shadow .3s}
