.ab-blox i{position:absolute;left:var(--x);top:var(--y);font:700 10px var(--f-mono);letter-spacing:.12em;color:rgba(190,212,255,.5);border:1.5px dashed rgba(127,176,255,.32);border-radius:9px;padding:7px 11px;font-style:normal;animation:abFloat 12s ease-in-out infinite;animation-delay:var(--d);will-change:transform}
.ab-blox i:nth-child(2n){border-color:rgba(255,138,0,.32);color:rgba(255,190,120,.55)}
.hero.lh .hero-grid.ab-hg{grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:40px;align-items:center}
.ab-copy{position:relative;z-index:3;min-width:0}
.ab-hero .lh-title{color:#fff}
.hero.lh .stage.ab-stage{position:relative;z-index:3;display:flex;flex-direction:column;align-items:stretch;place-items:stretch;gap:12px;padding:44px 0 8px;min-width:0;min-height:0;margin-top:0}
.ab-stage>.lh-tilt{order:1}.ab-kpis{order:2}.ab-foot{order:3}
.ab-stage>.lh-tilt{width:100%;min-width:0}
.ab-stage .lh-orbit{opacity:.4}
/* KPI row above the console */
.ab-kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;position:relative;z-index:4}
.ab-kp{background:rgba(14,26,54,.92);border:1px solid rgba(255,255,255,.14);border-radius:13px;padding:9px 12px 10px;color:#fff;min-width:0;box-shadow:0 18px 36px -22px rgba(0,0,0,.9)}
.ab-kp small{display:block;font:600 9.5px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:#9fb3d9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ab-kp b{display:block;font:800 19px var(--f-disp);color:#fff;font-variant-numeric:tabular-nums;margin:1px 0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ab-kp b.bump{animation:abBump .5s var(--ease-o)}
.ab-kp u{display:block;height:4px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden;text-decoration:none}
.ab-kp u i{display:block;height:100%;background:#0066FF;transform-origin:left;transform:scaleX(0);transition:transform .5s var(--ease-o)}
.ab-kp.o u i{background:#FF8A00}
/* console */
.ab-con{background:var(--ab-card);border-radius:18px;box-shadow:0 40px 80px -30px rgba(0,0,0,.75),0 0 0 1px rgba(255,255,255,.08);overflow:hidden;color:var(--ink)}
.ab-ch{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--surface)}
.ab-tl{display:flex;gap:5px;flex-shrink:0}
.ab-tl i{width:10px;height:10px;border-radius:50%;background:var(--line-2)}
.ab-tl i:nth-child(1){background:#c0392b}.ab-tl i:nth-child(2){background:#FF8A00}.ab-tl i:nth-child(3){background:#16a34a}
.ab-ch b{min-width:0;font:600 12px var(--f-mono);color:var(--ink)}
.ab-ch b span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ab-ch b span.sw{animation:abIn .5s var(--ease-o)}
.ab-env{margin-left:auto;flex-shrink:0;font:700 10px var(--f-mono);letter-spacing:.12em;color:#fff;background:#0B132B;border-radius:6px;padding:3px 8px;font-style:normal;transition:background .3s}
.ab-env.live{background:#16a34a}
.ab-env.warn{background:#c0392b}
html[data-theme="dark"] .ab-env{background:#22325e}
html[data-theme="dark"] .ab-env.live{background:#16a34a}
html[data-theme="dark"] .ab-env.warn{background:#c0392b}
.ab-scr{position:relative;height:340px;background:var(--surface-2);overflow:hidden;touch-action:pan-y}
.ab-cv{position:absolute;inset:0;width:100%;height:100%;display:block;opacity:0;transition:opacity .8s var(--ease-o)}
.ab-cv.on{opacity:1}
.ab-cap{position:absolute;left:10px;top:10px;display:inline-flex;align-items:center;gap:8px;background:var(--ab-card);border:1px solid var(--line);border-radius:999px;padding:4px 12px 4px 4px;font:600 11.5px var(--f-disp);color:var(--ink);box-shadow:0 8px 18px -12px rgba(11,19,43,.4);max-width:calc(100% - 90px)}
.ab-cap span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ab-cap b{font:700 10px var(--f-mono);background:#0066FF;color:#fff;border-radius:999px;padding:3px 7px;flex-shrink:0}
.ab-cap.sw span{animation:abIn .6s var(--ease-o)}
.ab-smp{position:absolute;right:10px;top:12px;font:600 9.5px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);background:var(--ab-card);border:1px solid var(--line);border-radius:6px;padding:3px 7px}
.ab-dots{display:flex;align-items:center;gap:6px;padding:9px 12px;border-top:1px solid var(--line);background:var(--surface)}
.ab-dots button[data-k]{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:5px;border:0;background:none;cursor:pointer;padding:2px 0;color:var(--muted);font:600 10.5px var(--f-mono);letter-spacing:.06em;text-transform:uppercase}
.ab-dots button[data-k] i{display:block;width:100%;height:4px;border-radius:3px;background:var(--line);position:relative;overflow:hidden}
.ab-dots button[data-k] i:after{content:"";position:absolute;inset:0;background:#FF8A00;transform-origin:left;transform:scaleX(var(--p,0))}
.ab-dots button[data-k].done i:after{background:#0066FF;transform:scaleX(1);opacity:.45}
.ab-dots button[data-k] span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;transition:color .3s}
.ab-dots button[data-k]:hover span{color:var(--ink)}
.ab-dots button[data-k].on span{color:#0066FF}
html[data-theme="dark"] .ab-dots button[data-k].on span{color:#7FB0FF}
.ab-pz{flex-shrink:0;width:30px;height:30px;border:1px solid var(--line);background:var(--surface-2);border-radius:9px;color:var(--ink);display:grid;place-items:center;cursor:pointer;margin-left:4px}
.ab-pz svg{width:12px;height:12px}
.ab-pz[hidden]{display:none}
.ab-pz .pl,.ab-pz.paused .pa{display:none}
.ab-pz.paused .pl{display:block}
/* chips */
.ab-chip{position:absolute;max-width:240px;backdrop-filter:none!important;-webkit-backdrop-filter:none!important;background:rgba(11,19,43,.96)!important;z-index:7}
.ab-chip b{display:block;font:700 12px var(--f-disp);color:#fff;white-space:nowrap}
.ab-chip small{white-space:nowrap}
.ab-chip.sw b,.ab-chip.sw small{animation:abIn .55s var(--ease-o)}
#main .ab-chO i{background:#FF8A00}
/* foot: log + powered */
.ab-foot{display:grid;grid-template-columns:minmax(0,1fr) 210px;gap:12px;align-items:stretch}
.ab-log{min-width:0;background:#0B132B;border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:10px 14px 8px;color:#fff;box-shadow:0 24px 50px -20px rgba(0,0,0,.85)}
.ab-logh{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:6px}
.ab-logh span{display:flex;align-items:center;gap:6px;font:700 9.5px var(--f-mono);letter-spacing:.1em}
.ab-logh span i{width:7px;height:7px;border-radius:50%;background:#FF8A00;flex-shrink:0;animation:abPulseO 1.6s infinite}
.ab-logh em{font:500 9px var(--f-mono);color:#9fb3d9;font-style:normal}
.ab-log ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px;min-height:60px}
.ab-log li{font:500 10.5px/1.35 var(--f-mono);color:#7d8fb3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ab-log li b{font-weight:600;color:#7FB0FF;margin-right:6px}
.ab-log li.go{color:#fff}
.ab-log li.go b{color:#FFB15C}
.ab-log li.ok{color:#c9d6ee}
.ab-log li.ok b{color:#5FE08D}
.ab-log li.nw{animation:abIn .45s var(--ease-o) both}
.ab-pw.lh-powered{position:relative;left:auto;right:auto;bottom:auto;top:auto;margin:0;background:#0B132B;max-width:none;min-width:0;align-self:stretch;display:flex;flex-direction:column;justify-content:center}
.ab-pw.lh-powered>span{font-size:12.5px;line-height:1.25;align-items:center}
.ab-pw em{display:block;font:500 10px/1.4 var(--f-mono);color:#9fb6de;font-style:normal;margin-top:4px}
.ab-tile{width:24px;height:24px;border-radius:7px;background:#0066FF;color:#fff;display:grid;place-items:center;flex-shrink:0;font:800 14px/1 var(--f-disp)}

/* proof strip + sticky sub-nav */
.ab-proof b{color:var(--ink)}
.ab-sub{position:sticky;top:var(--ab-hh);z-index:60;background:rgba(255,255,255,.97);border-bottom:1px solid var(--line);box-shadow:0 8px 20px -18px rgba(11,19,43,.5)}
html[data-theme="dark"] .ab-sub{background:rgba(6,18,42,.95)}
.ab-subt{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:8px 0}
.ab-subt::-webkit-scrollbar{display:none}
.ab-subt a{flex-shrink:0;font:600 12.5px var(--f-disp);color:var(--muted);padding:6px 13px;border-radius:999px;border:1px solid transparent;transition:color .2s,background .25s,border-color .25s}
.ab-subt a:hover{color:var(--ink);border-color:var(--line);text-decoration:none}
.ab-subt a.on{color:#fff;background:#0066FF;border-color:#0066FF}
.ab-fine,.ab-tm{font-size:12px;color:var(--muted);margin:14px 0 0;line-height:1.6}
.ab-fine a,.ab-usage a{color:#0066FF}
html[data-theme="dark"] .ab-fine a,html[data-theme="dark"] .ab-usage a{color:#9CC2FF}

/* ---------- OVERVIEW ---------- */
.ab-four{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:26px;counter-reset:ab}
.ab-fc{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px 18px;display:flex;flex-direction:column;gap:9px;overflow:hidden;transition:transform .35s var(--ease-o),border-color .3s,box-shadow .3s}
.ab-fc:after{content:"";position:absolute;left:0;top:0;height:3px;width:100%;background:#0066FF;transform:scaleX(.18);transform-origin:left;transition:transform .5s var(--ease-o)}
.ab-fc:nth-child(2):after{background:#FF8A00}.ab-fc:nth-child(4):after{background:#0B132B}
html[data-theme="dark"] .ab-fc:nth-child(4):after{background:#7FB0FF}
.ab-fc:hover{transform:translateY(-5px);border-color:#0066FF;box-shadow:var(--sh)}
.ab-fc:hover:after{transform:scaleX(1)}
.ab-fn{position:absolute;right:14px;top:12px;font:800 30px/1 var(--f-disp);color:var(--line);letter-spacing:-.02em}
.ab-fi{width:42px;height:42px;border-radius:12px;background:#0066FF;color:#fff;display:grid;place-items:center;transition:transform .4s var(--ease-o)}
.ab-fc:hover .ab-fi{transform:rotate(-8deg) scale(1.08)}
.ab-fi svg{width:20px;height:20px}
.ab-fi.o{background:#FF8A00}.ab-fi.n{background:#0B132B}
html[data-theme="dark"] .ab-fi.n{background:#22325e}
.ab-fc h3{margin:0;font:700 18px var(--f-disp);color:var(--ink)}
.ab-fc p{margin:0;font-size:13.5px;color:var(--text);line-height:1.55}
.ab-fc ul{list-style:none;margin:4px 0 0;padding:10px 0 0;border-top:1px dashed var(--line);display:flex;flex-direction:column;gap:6px}
.ab-fc li{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--ink);font-weight:500}
.ab-fc li svg{width:14px;height:14px;color:#0066FF;flex-shrink:0}
html[data-theme="dark"] .ab-fc li svg{color:#9CC2FF}
.ab-ent{margin-top:18px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:22px;align-items:center;background:#0B132B;color:#fff;border-radius:20px;padding:24px 26px;box-shadow:0 30px 60px -36px rgba(11,19,43,.8)}
html[data-theme="dark"] .ab-ent{background:#0E1A36;border:1px solid var(--line)}
.ab-enk{display:inline-flex;align-items:center;gap:7px;font:700 10.5px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:#FFB15C}
.ab-enk svg{width:14px;height:14px}
.ab-ent h3{margin:8px 0 6px;font:700 20px/1.25 var(--f-disp);color:#fff}
.ab-ent p{margin:0;font-size:13.5px;color:#c9d6ee;line-height:1.55}
.ab-enr{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ab-enr li{display:flex;gap:10px;align-items:flex-start;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:13px;padding:11px 12px;transition:background .3s,transform .3s var(--ease-o)}
.ab-enr li:hover{background:rgba(0,102,255,.22);transform:translateY(-2px)}
.ab-enr li>svg{width:18px;height:18px;color:#7FB0FF;flex-shrink:0;margin-top:2px}
.ab-enr b{display:block;font:700 13.5px var(--f-disp);color:#fff}
.ab-enr small{display:block;font-size:11.5px;color:#9fb3d9;line-height:1.4}
.ab-gets{margin-top:26px}
.ab-gk{display:block;font:700 10.5px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ab-ot);margin-bottom:10px}
.ab-gg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.ab-g{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;grid-template-columns:44px minmax(0,1fr);gap:4px 12px;align-items:start;transition:transform .35s var(--ease-o),box-shadow .3s}
.ab-g:hover{transform:translateY(-4px);box-shadow:var(--sh)}
.ab-g i{grid-row:span 2;width:44px;height:44px;border-radius:13px;background:var(--chip);color:#0066FF;display:grid;place-items:center}
.ab-g i.o{color:var(--ab-ot)}.ab-g i.n{color:var(--ink)}
html[data-theme="dark"] .ab-g i{color:#9CC2FF}
.ab-g i svg{width:20px;height:20px}
.ab-g b{font:700 15px var(--f-disp);color:var(--ink)}
.ab-g p{margin:0;font-size:13px;color:var(--text);line-height:1.5}
.ab-pwr{margin-top:14px;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.ab-pwr>span{font:600 12px var(--f-mono);color:var(--muted);margin-right:4px}
.ab-pwr a{display:inline-flex;align-items:center;gap:7px;font:600 12.5px var(--f-disp);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 13px;transition:border-color .25s,color .25s,transform .25s var(--ease-o)}
.ab-pwr a svg{width:14px;height:14px;color:#0066FF}
html[data-theme="dark"] .ab-pwr a svg{color:#9CC2FF}
.ab-pwr a:hover{border-color:#0066FF;color:#0066FF;text-decoration:none;transform:translateY(-2px)}

/* ---------- BUILDER ---------- */
.ab-bdw{display:grid;grid-template-columns:250px minmax(0,1fr);gap:18px;align-items:stretch}
.ab-bdt{display:flex;flex-direction:column;gap:6px}
.ab-bdt button{display:flex;align-items:center;gap:10px;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 13px;cursor:pointer;color:var(--ink);font:600 13.5px var(--f-disp);transition:border-color .25s,background .25s,color .25s,transform .25s var(--ease-o)}
.ab-bdt button svg{width:17px;height:17px;color:#0066FF;flex-shrink:0}
html[data-theme="dark"] .ab-bdt button svg{color:#9CC2FF}
.ab-bdt button:hover{border-color:var(--line-2);transform:translateX(3px)}
.ab-bdt button.on{background:#0066FF;border-color:#0066FF;color:#fff}
.ab-bdt button.on svg{color:#fff}
.ab-bdp{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:var(--sh-s)}
.ab-bdk{display:inline-block;font:800 11px var(--f-mono);color:#fff;background:#FF8A00;border-radius:8px;padding:4px 8px}
.ab-bdd h3{margin:10px 0 8px;font:700 22px var(--f-disp);color:var(--ink)}
.ab-bdd p{margin:0 0 12px;font-size:14px;color:var(--text);line-height:1.6}
.ab-bdd ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.ab-bdd li{display:flex;gap:9px;align-items:flex-start;font-size:13px;color:var(--text);line-height:1.45}
.ab-bdd li i{flex-shrink:0;width:22px;height:22px;border-radius:6px;background:var(--chip);color:#0066FF;display:grid;place-items:center}
html[data-theme="dark"] .ab-bdd li i{color:#9CC2FF}
.ab-bdd li i svg{width:12px;height:12px}
.ab-bdd .sw{animation:abIn .45s var(--ease-o) both}
.ab-mf{position:relative;min-height:300px;border-radius:16px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:18px 18px}
.ab-mfw{position:absolute;inset:0;width:100%;height:100%}
.ab-mfw path{fill:none;stroke:var(--line-2);stroke-width:2;stroke-dasharray:6 7;vector-effect:non-scaling-stroke;transition:stroke .4s}
.ab-mfw path.on{stroke:#0066FF;animation:abDash 4s linear infinite}
.ab-mn{position:absolute;left:var(--x);top:var(--y);transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--surface);border:1.5px solid var(--line-2);border-radius:12px;padding:8px 10px;min-width:78px;color:var(--muted);transition:transform .45s var(--ease-o),border-color .3s,background .3s,color .3s,box-shadow .3s}
.ab-mn svg{width:18px;height:18px}
.ab-mn b{font:700 10.5px var(--f-mono);letter-spacing:.04em;white-space:nowrap}
.ab-mn.on{background:#0066FF;border-color:#0066FF;color:#fff;transform:translate(-50%,-50%) scale(1.1);box-shadow:0 14px 30px -12px rgba(0,102,255,.8)}
.ab-mn.near{border-color:#0066FF;color:var(--ink)}
.ab-mfk{position:absolute;right:10px;bottom:8px;font:600 9.5px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

/* ---------- HOW (rail) ---------- */
.ab-rail{position:relative}
.ab-rl{position:relative;height:6px;border-radius:3px;background:var(--line);margin:8px 0 20px;overflow:visible}
.ab-rl i{position:absolute;left:0;top:0;height:100%;width:100%;border-radius:3px;background:#0066FF;transform-origin:left;transform:scaleX(.25);transition:transform .8s var(--ease-o)}
.ab-rp{position:absolute;top:50%;left:0;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:#FF8A00;box-shadow:0 0 0 5px rgba(255,138,0,.22);will-change:transform}
.ab-rs{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.ab-rs li{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:20px 18px;display:flex;flex-direction:column;gap:8px;transition:border-color .4s,box-shadow .4s,transform .4s var(--ease-o)}
.ab-rs li.on{border-color:#0066FF;box-shadow:0 26px 50px -30px rgba(0,102,255,.7);transform:translateY(-4px)}
.ab-rn{width:48px;height:48px;border-radius:14px;background:var(--chip);color:#0066FF;display:grid;place-items:center;transition:background .4s,color .4s}
html[data-theme="dark"] .ab-rn{color:#9CC2FF}
.ab-rn svg{width:22px;height:22px}
.ab-rs li.on .ab-rn{background:#0066FF;color:#fff}
.ab-rs b{font:700 16px var(--f-disp);color:var(--ink)}
.ab-rs p{margin:0;font-size:13.5px;color:var(--text);line-height:1.55;flex:1}
.ab-rs em{font:600 11px var(--f-mono);color:var(--ab-ot);font-style:normal}

/* ---------- TABLE ---------- */
.ab-tb td:first-child{font-weight:600;color:var(--ink);white-space:nowrap}
.ab-tb td:first-child small{display:block;font:500 11.5px var(--f-body);color:var(--muted);margin-left:21px}
.ab-tb td svg,.ab-vt td svg{display:inline-block;width:15px;height:15px;vertical-align:-3px;color:#0066FF;margin-right:6px}
html[data-theme="dark"] .ab-tb td svg,html[data-theme="dark"] .ab-vt td svg{color:#9CC2FF}
.ab-tb td.hl{font-weight:700}

/* ---------- USE CASES ---------- */
.ab-ucg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.ab-u{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:10px;transition:transform .35s var(--ease-o),border-color .3s,box-shadow .3s}
.ab-u:hover{transform:translateY(-5px);border-color:#0066FF;box-shadow:var(--sh)}
.ab-uh{display:flex;gap:12px;align-items:center}
.ab-uh i{width:42px;height:42px;border-radius:12px;background:#0066FF;color:#fff;display:grid;place-items:center;flex-shrink:0;transition:transform .4s var(--ease-o)}
.ab-u:hover .ab-uh i{transform:rotate(-8deg) scale(1.06)}
.ab-uh i.o{background:#FF8A00}.ab-uh i.n{background:#0B132B}
html[data-theme="dark"] .ab-uh i.n{background:#22325e}
.ab-uh i svg{width:19px;height:19px}
.ab-uh small{display:block;font:700 10px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ab-ot)}
.ab-uh b{display:block;font:700 15.5px var(--f-disp);color:var(--ink)}
.ab-u p{margin:0;font-size:13.5px;color:var(--text);line-height:1.55;flex:1}
.ab-um{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font:500 12px var(--f-mono);color:var(--ink);background:var(--surface-2);border-radius:10px;padding:8px 10px}
.ab-um span{display:inline-flex;align-items:center;gap:5px;font-weight:700;color:#0066FF;text-transform:uppercase;font-size:10.5px;letter-spacing:.08em}
html[data-theme="dark"] .ab-um span{color:#9CC2FF}
.ab-um svg{width:13px;height:13px}

/* ---------- DELIVERY ---------- */
.ab-lanes{margin-top:24px}
.ab-lk{display:block;font:700 10.5px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ab-ot);margin-bottom:10px}
.ab-lg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.ab-ln,.ab-x{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 14px;color:var(--ink);min-width:0;transition:transform .3s var(--ease-o),border-color .3s,box-shadow .3s}
.ab-ln:hover,.ab-x:hover{transform:translateY(-3px);border-color:#0066FF;text-decoration:none;box-shadow:var(--sh-s)}
.ab-ln i,.ab-x i{width:36px;height:36px;border-radius:10px;background:var(--chip);color:#0066FF;display:grid;place-items:center;flex-shrink:0}
html[data-theme="dark"] .ab-ln i,html[data-theme="dark"] .ab-x i{color:#9CC2FF}
.ab-ln i svg,.ab-x i svg{width:17px;height:17px}
.ab-ln span,.ab-x span{flex:1;min-width:0}
.ab-ln small,.ab-x small{display:block;font-size:11.5px;color:var(--muted)}
.ab-ln b,.ab-x b{display:block;font:700 13.5px var(--f-disp)}
.ab-ln em,.ab-x em{font-style:normal;color:#FF8A00;font-weight:700;transition:transform .3s var(--ease-o)}
.ab-ln:hover em,.ab-x:hover em{transform:translateX(4px)}

/* ---------- INDIA ---------- */
.ab-ing{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.ab-inc{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:8px;border-left:4px solid #0066FF;transition:transform .35s var(--ease-o),box-shadow .3s}
.ab-inc:nth-child(2){border-left-color:#FF8A00}.ab-inc:nth-child(3){border-left-color:#0B132B}.ab-inc:nth-child(4){border-left-color:#16a34a}
html[data-theme="dark"] .ab-inc:nth-child(3){border-left-color:#7FB0FF}
.ab-inc:hover{transform:translateY(-4px);box-shadow:var(--sh)}
.ab-inb{align-self:flex-start;font:800 19px var(--f-disp);color:#0066FF}
html[data-theme="dark"] .ab-inb{color:#7FB0FF}
.ab-inb.o{color:var(--ab-ot)}.ab-inb.n{color:var(--ink)}
.ab-inc b{font:700 15px var(--f-disp);color:var(--ink)}
.ab-inc p{margin:0;font-size:13px;color:var(--text);line-height:1.55}

/* ---------- PLANS ---------- */
.ab-plg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;align-items:stretch}
.ab-plc{position:relative;background:var(--surface);border:1.5px solid var(--line);border-radius:20px;padding:22px 20px;display:flex;flex-direction:column;gap:10px;transition:transform .35s var(--ease-o),box-shadow .35s,border-color .3s;min-width:0}
.ab-plc:hover{transform:translateY(-6px);box-shadow:var(--sh)}
.ab-plc.pop{border-color:#0066FF;box-shadow:0 30px 60px -34px rgba(0,102,255,.6)}
.ab-flag{position:absolute;top:-12px;right:18px;background:#FF8A00;color:#fff;font:700 10.5px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;border-radius:999px;padding:5px 11px}
.ab-pt{font:700 10.5px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ab-ot)}
.ab-plc h3{margin:0;font:700 19px var(--f-disp);color:var(--ink)}
.ab-pr{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.ab-pr b{font:800 29px var(--f-disp);color:var(--ink);letter-spacing:-.01em}
.ab-pr small{font-size:12px;color:var(--muted)}
.ab-pu{font:600 11.5px var(--f-mono);color:#0066FF;background:var(--chip);border-radius:8px;padding:5px 9px;align-self:flex-start}
html[data-theme="dark"] .ab-pu{color:#9CC2FF}
.ab-plc ul{list-style:none;margin:6px 0 10px;padding:0;display:flex;flex-direction:column;gap:8px;flex:1}
.ab-plc li{display:flex;gap:9px;align-items:flex-start;font-size:13px;color:var(--text);line-height:1.4}
.ab-plc li svg{width:16px;height:16px;color:#0066FF;flex-shrink:0;margin-top:1px}
html[data-theme="dark"] .ab-plc li svg{color:#9CC2FF}
.ab-plc .btn{justify-content:center}
.ab-usage{margin-top:16px;display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;background:var(--surface);border:1px dashed var(--line-2);border-radius:14px;padding:12px 16px;font-size:13px;color:var(--text)}
.ab-uk{display:inline-flex;align-items:center;gap:6px;font:700 10.5px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ab-ot)}
.ab-uk svg{width:14px;height:14px}
.ab-usage b{color:var(--ink)}

/* ---------- CONFIGURATOR ---------- */
.ab-cfw,.ab-mtw,.ab-tkw{display:grid;gap:20px}
.ab-cfw>*,.ab-mtw>*,.ab-tkw>*{min-width:0}
.ab-cfw{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);align-items:start}
.ab-cfi,.ab-mti,.ab-tki{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px;display:flex;flex-direction:column;gap:18px}
.ab-cf2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.ab-cf2>*{min-width:0}
.ab-cfi .seg,.ab-mti .seg{flex-wrap:wrap}
.ab-adds{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ab-adds label{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;transition:border-color .2s,background .2s;min-width:0}
.ab-adds label:hover{border-color:var(--line-2)}
.ab-adds label.ck{border-color:#0066FF;background:var(--ab-bs)}
.ab-adds input[type=checkbox]{width:17px;height:17px;accent-color:#0066FF;flex-shrink:0}
.ab-ab{flex:1;min-width:0}
.ab-ab b{display:flex;align-items:center;gap:7px;font:600 13px var(--f-disp);color:var(--ink)}
.ab-ab b svg{width:15px;height:15px;color:#0066FF;flex-shrink:0}
html[data-theme="dark"] .ab-ab b svg{color:#9CC2FF}
.ab-ab small{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}
.ab-adds .stp.sm{flex-shrink:0;height:32px}
.ab-adds .stp.sm input{width:36px;padding:0;font-size:13px}
.ab-adds .stp.sm button{width:26px;min-width:26px;height:30px;padding:0}
.ab-cfo{position:sticky;top:calc(var(--ab-hh) + 60px)}
.ab-cfs{background:#0B132B;color:#fff;border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:10px;box-shadow:0 30px 60px -30px rgba(11,19,43,.8)}
html[data-theme="dark"] .ab-cfs{background:#0E1A36;border:1px solid var(--line)}
.ab-cfk{font:700 10.5px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:#FFB15C}
.ab-cfs h3{margin:0;font:700 19px var(--f-disp);color:#fff}
.ab-cfl{list-style:none;margin:0;padding:10px 0 0;display:flex;flex-direction:column;gap:6px;border-top:1px solid rgba(255,255,255,.12)}
.ab-cfl li{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:#c9d6ee;animation:abIn .35s var(--ease-o)}
.ab-cfl li b{color:#fff;font-weight:600;white-space:nowrap}
.ab-cfl li.q b{color:#FFB15C}
.ab-cft{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
.ab-cft div{background:rgba(255,255,255,.06);border-radius:10px;padding:9px 11px;min-width:0}
.ab-cft span{display:block;font:600 10px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:#9fb3d9}
.ab-cft b{font:800 17px var(--f-disp);color:#fff}
.ab-cfr{display:flex;justify-content:space-between;font-size:13px;color:#c9d6ee}
.ab-cfr b{color:#fff;font-variant-numeric:tabular-nums}
.ab-cfr.t{border-top:1px solid rgba(255,255,255,.14);padding-top:10px;font-weight:700;color:#fff}
.ab-cfr.t b{font:800 24px var(--f-disp);color:#fff}
.ab-cfr.t b.bump{animation:abBump .5s var(--ease-o)}
.ab-cfr.q b{color:#FFB15C}
.ab-cfr.q[hidden]{display:none}
.ab-cfb{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.ab-cfb .btn{justify-content:center}
.btn.btn-gw{background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.35);color:#fff}
.btn.btn-gw:hover{background:rgba(255,255,255,.2)}
.ab-cfb .btn:disabled{opacity:.5;cursor:not-allowed}
.ab-cff{font-size:11px;color:#9fb3d9;line-height:1.5}
.ab-num{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;font:600 14px var(--f-body);background:var(--surface);color:var(--ink)}
.ab-num:focus{outline:none;border-color:#0066FF}
.ab-num::placeholder{color:var(--muted);font-weight:500;font-size:13px}

/* ---------- MATCHER ---------- */
.ab-mtw{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);align-items:start}
.ab-mtl{font:700 13px var(--f-disp);color:var(--ink)}
.ab-mti textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font:500 14.5px/1.5 var(--f-body);background:var(--surface-2);color:var(--ink);resize:vertical;min-height:96px;margin-top:-10px}
.ab-mti textarea:focus{outline:none;border-color:#0066FF;background:var(--surface)}
.ab-mtx{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:-6px}
.ab-mtx span{font:600 11.5px var(--f-mono);color:var(--muted)}
.ab-mtx button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 11px;font:600 12px var(--f-disp);cursor:pointer;transition:border-color .2s,color .2s,background .2s}
.ab-mtx button:hover{border-color:#0066FF;color:#0066FF}
.ab-mres{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.ab-mres li{display:grid;grid-template-columns:30px minmax(0,1fr) 54px;gap:10px;align-items:center;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;transition:border-color .25s,background .25s;animation:abIn .4s var(--ease-o) both}
.ab-mres li:nth-child(2){animation-delay:.06s}.ab-mres li:nth-child(3){animation-delay:.12s}
.ab-mres li:hover{border-color:var(--line-2)}
.ab-mres li.on{border-color:#0066FF;background:var(--ab-bs)}
.ab-mres li>i{width:30px;height:30px;border-radius:9px;background:var(--chip);color:#0066FF;display:grid;place-items:center}
html[data-theme="dark"] .ab-mres li>i{color:#9CC2FF}
.ab-mres li>i svg{width:15px;height:15px}
.ab-mres b{display:block;font:600 13.5px var(--f-disp);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ab-mres em{display:block;height:5px;border-radius:3px;background:var(--line);margin-top:6px;overflow:hidden}
.ab-mres em u{display:block;height:100%;background:#0066FF;transform-origin:left;transition:transform .6s var(--ease-o)}
.ab-mres li:nth-child(n+2) em u{background:#FF8A00}
.ab-mres strong{font:800 15px var(--f-disp);color:var(--ink);text-align:right;font-variant-numeric:tabular-nums}
.ab-mto{position:sticky;top:calc(var(--ab-hh) + 60px);background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--sh)}
.ab-mtk{font:700 10.5px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ab-ot)}
.ab-mth{display:flex;gap:12px;align-items:center}
.ab-mti2{width:48px;height:48px;border-radius:14px;background:#0066FF;color:#fff;display:grid;place-items:center;flex-shrink:0}
.ab-mti2 svg{width:22px;height:22px}
.ab-mth h3{margin:0;font:700 18px/1.25 var(--f-disp);color:var(--ink)}
.ab-mth small{font:600 11.5px var(--f-mono);color:var(--muted)}
.ab-mto>p{margin:0;font-size:13.5px;color:var(--text);line-height:1.55}
.ab-mflow{display:flex;flex-wrap:wrap;gap:0;align-items:center;row-gap:8px;min-height:40px}
.ab-mflow span{display:inline-flex;align-items:center;gap:5px;font:700 11px var(--f-mono);color:var(--ink);background:var(--surface-2);border:1.5px solid var(--line-2);border-radius:9px;padding:6px 9px;opacity:0;transform:translateY(6px);animation:abIn .45s var(--ease-o) forwards;animation-delay:calc(var(--i)*90ms)}
.ab-mflow span svg{width:13px;height:13px;color:#0066FF}
html[data-theme="dark"] .ab-mflow span svg{color:#9CC2FF}
.ab-mflow span.k{border-color:#0066FF}
.ab-mflow i{display:inline-block;width:18px;height:2px;background:repeating-linear-gradient(90deg,#0066FF 0 4px,transparent 4px 7px);background-size:14px 2px;animation:abWire .8s linear infinite;opacity:0;animation-delay:calc(var(--i)*90ms)}
.ab-mflow i.v{opacity:1}
@keyframes abWire{to{background-position:14px 0}}
.ab-mdl{margin:0;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ab-mdl div{background:var(--surface-2);border-radius:11px;padding:9px 11px;min-width:0}
.ab-mdl dt{font:700 10px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ab-mdl dd{margin:3px 0 0;font-size:12.5px;color:var(--ink);font-weight:500;line-height:1.4}
.ab-mtf{display:flex;gap:8px;flex-wrap:wrap}
.ab-mtn{font-size:11.5px;color:var(--muted);line-height:1.5}

/* ---------- TOKENS ---------- */
.ab-tkw{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);align-items:start}
.ab-tg{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer}
.ab-tg input{width:17px;height:17px;accent-color:#0066FF;margin-top:2px;flex-shrink:0}
.ab-tg b{display:block;font:600 13px var(--f-disp);color:var(--ink)}
.ab-tg small{display:block;font-size:11.5px;color:var(--muted)}
.ab-tpr{border-top:1px dashed var(--line);padding-top:16px}
.ab-tko{position:sticky;top:calc(var(--ab-hh) + 60px);background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:13px;box-shadow:var(--sh)}
.ab-tkk{font:700 10.5px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ab-ot)}
.ab-tkbig{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.ab-tkbig b{font:800 34px/1 var(--f-disp);color:var(--ink);font-variant-numeric:tabular-nums}
.ab-tkbig b.bump{animation:abBump .5s var(--ease-o)}
.ab-tkbig small{font:600 12px var(--f-mono);color:var(--muted)}
.ab-tkbar{display:flex;height:16px;border-radius:8px;overflow:hidden;background:var(--surface-2)}
.ab-tkbar i{display:block;height:100%;background:#0066FF;transition:flex-grow .6s var(--ease-o);flex:1 1 0}
.ab-tkbar i.o{background:#FF8A00}
.ab-tkleg{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.ab-tkleg span{display:inline-flex;align-items:center;gap:6px}
.ab-tkleg i{width:10px;height:10px;border-radius:3px;background:#0066FF}
.ab-tkleg i.o{background:#FF8A00}
.ab-tkleg b{color:var(--ink);font-variant-numeric:tabular-nums}
.ab-tkg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ab-tkg div{background:var(--surface-2);border-radius:12px;padding:10px 12px;min-width:0}
.ab-tkg small{display:block;font:600 10px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ab-tkg b{display:block;font:800 18px var(--f-disp);color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ab-tkc{background:#0B132B;border-radius:14px;padding:14px 16px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;color:#fff}
html[data-theme="dark"] .ab-tkc{background:#0066FF}
.ab-tkc>div span{display:block;font:600 10px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:#9fb3d9}
html[data-theme="dark"] .ab-tkc>div span{color:#dce8ff}
.ab-tkc>div b{display:block;font:800 17px var(--f-disp);color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.ab-tkc>div b.bump{animation:abBump .5s var(--ease-o)}
.ab-tkc .ab-tkp{grid-column:1/-1;font-size:12px;color:#c9d6ee;border-top:1px solid rgba(255,255,255,.14);padding-top:8px;line-height:1.45}
html[data-theme="dark"] .ab-tkc .ab-tkp{color:#eef4ff}
.ab-tkc.empty>div b{color:#FFB15C;font-size:14px}
.ab-tkf{border:1px dashed var(--line-2);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.ab-tkf b{font:700 10.5px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink)}
.ab-tkf code{font:500 11.5px/1.45 var(--f-mono);color:var(--text);white-space:normal;word-break:break-word}
.ab-tkn{font-size:11.5px;color:var(--muted);line-height:1.5}

/* ---------- VS ---------- */
.ab-vt tbody tr{transition:opacity .5s var(--ease-o),transform .5s var(--ease-o)}
.ab-vt.pre tbody tr{opacity:0;transform:translateX(-12px)}
.ab-vt td:first-child{white-space:nowrap;font-weight:600;color:var(--ink)}
.ab-vt td:nth-child(2){color:#c0392b}
html[data-theme="dark"] .ab-vt td:nth-child(2){color:#FF7A6B}

/* ---------- STEPS (vertical timeline, 2 columns) ---------- */
.ab-sts{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:12px 28px;counter-reset:s}
.ab-sts li{position:relative;display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;opacity:.35;transform:translateX(-10px);transition:opacity .5s var(--ease-o),transform .5s var(--ease-o),border-color .3s}
.ab-sts li.on{opacity:1;transform:none}
.ab-sts li.on .n{background:#0066FF;color:#fff}
.ab-sts li.on:nth-child(even) .n{background:#FF8A00}
.ab-sts .n{display:grid;place-items:center;width:46px;height:46px;border-radius:13px;background:var(--surface-2);color:var(--muted);font:800 14px var(--f-mono);transition:background .4s,color .4s}
.ab-sts b{display:block;font:700 15px var(--f-disp);color:var(--ink)}
.ab-sts small{display:block;font-size:12.5px;color:var(--text);margin-top:3px;line-height:1.45}
.ab-sts em{font:600 10.5px var(--f-mono);color:#0066FF;font-style:normal;background:var(--chip);border-radius:6px;padding:3px 7px;white-space:nowrap}
html[data-theme="dark"] .ab-sts em{color:#9CC2FF}

/* ---------- RELATED ---------- */
.ab-xs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}

/* ---------- RESPONSIVE ---------- */
@media(max-width:1180px){
  .hero.lh .hero-grid.ab-hg{grid-template-columns:minmax(0,1fr)}
  .hero.lh .stage.ab-stage{max-width:780px;width:100%;margin:0 auto}
  .ab-four,.ab-ing{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ab-plg{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ab-xs,.ab-lg{grid-template-columns:repeat(3,minmax(0,1fr))}
  .ab-rs{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ab-rl{display:none}
  .ab-bdp{grid-template-columns:minmax(0,1fr)}
}
@media(max-width:960px){
  .ab-cfw,.ab-mtw,.ab-tkw{grid-template-columns:minmax(0,1fr)}
  .ab-cfo,.ab-mto,.ab-tko{position:static}
  .ab-bdw{grid-template-columns:minmax(0,1fr)}
  .ab-bdt{flex-direction:row;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .ab-bdt::-webkit-scrollbar{display:none}
