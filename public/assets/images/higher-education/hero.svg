<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" role="img" aria-label="Illustration: campus workloads connected to one managed XcellHost cloud"><style>:root{--navy:#041e42;--navy2:#062a5c;--blue:#1565d8;--blue2:#3b82f6;--sky:#8ab4ff;--soft:#e8f0fd;--ice:#f2f6fc;--orange:#ff8c1a;--orange2:#ffb15c;--green:#16a34a;--ink:#0b1730;--ink2:#33415c;--mute:#5b6b85;--line:#dce5f3;--font-h:"Sora",sans-serif;--font-b:"IBM Plex Sans",sans-serif;--font-m:"IBM Plex Mono",monospace;--font-s:"Instrument Serif",serif;--font-d:"Fraunces",Georgia,serif;--royal:#1f5bd9;--royal2:#163f9e;--royal3:#0e2a66;--r:16px;--sh1:0 6px 18px rgba(4,30,66,.06);--sh:0 10px 30px rgba(4,30,66,.08);--sh2:0 22px 60px rgba(4,30,66,.16)}
.ha-t{font:600 10px var(--font-m);fill:#b9c8e4;letter-spacing:.08em}
.ha-c{font:500 10px var(--font-m);fill:#dce7ff;letter-spacing:0}
.ha-h{font:700 12px var(--font-h);fill:#fff;letter-spacing:0}
.ha-n{font:700 12.5px var(--font-h);fill:#041e42;letter-spacing:0}
.ha-m{font:500 10.5px var(--font-b);fill:#5b6b85;letter-spacing:0}
.ha-w{fill:#fff}.ha-g{fill:#4ade80}.ha-o{fill:#ffb15c}.ha-r{fill:#f87171}.ha-b{fill:#8ab4ff}.ha-y{fill:#fbbf24}
.ha-glass{fill:rgba(255,255,255,.07);stroke:rgba(255,255,255,.18)}
.ha-dark{fill:rgba(0,0,0,.28);stroke:rgba(255,255,255,.1)}
.ha-frame{fill:rgba(255,255,255,.06);stroke:rgba(255,255,255,.18)}
.ha-white{fill:rgba(255,255,255,.97)}
.ha-ring{fill:none;stroke:rgba(138,180,255,.28);stroke-width:1}
.ha-ico{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ha-blink{animation:ha-blink 1.6s ease-in-out infinite}
@keyframes ha-blink{0%,100%{opacity:1}50%{opacity:.25}}
.ha-pop{animation:ha-pop 7s ease-in-out infinite both}
@keyframes ha-pop{0%,6%{opacity:0;transform:translateY(8px)}14%,90%{opacity:1;transform:none}100%{opacity:0;transform:none}}
.ha-dash{stroke-dasharray:6 6;animation:ha-dash 1.2s linear infinite}
@keyframes ha-dash{to{stroke-dashoffset:-24}}
.ha-in{animation:ha-in .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes ha-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.ha-in rect.ha-glass{animation:ha-glow 4s ease-in-out infinite}
