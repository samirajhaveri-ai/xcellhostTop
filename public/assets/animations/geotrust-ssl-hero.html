<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>GeoTrust certificate activity illustration</title>

<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=IBM+Plex+Sans:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&family=Poppins:wght@500;600;700&family=Fraunces:wght@700;800&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:transparent}body{--navy:#041E42;--blue:#1565D8;--sky:#69B6FF;--orange:#FF8C1A;--red:#E60012;--ok:#2ECC71;--ink:#DCE7F8;--mut:#9FB8D8;
 --mono:"IBM Plex Mono",monospace;--body:"IBM Plex Sans",system-ui,sans-serif;--pop:"Poppins",sans-serif;--disp:"Sora",sans-serif;font-family:var(--body);color:var(--ink)}
*,*::before,*::after{box-sizing:border-box}main{display:flow-root;padding:16px 8px 24px;overflow:hidden}main *{margin:0;padding:0}
@keyframes xtTw{50%{opacity:.1}}@keyframes xtIn{to{opacity:1;transform:none}}
/* ---------- right: live visual ---------- */
.xt-viz{position:relative;height:540px}
.xt-map{position:absolute;inset:-30px -40px -30px -10px;background-image:radial-gradient(circle,rgba(127,168,232,.55) 1.6px,transparent 1.8px);background-size:18px 18px;
 -webkit-mask-image:radial-gradient(ellipse 55% 52% at 52% 50%,#000 55%,transparent 72%);mask-image:radial-gradient(ellipse 55% 52% at 52% 50%,#000 55%,transparent 72%);opacity:.55}
.xt-ring{position:absolute;left:50%;top:50%;border-radius:50%;border:1px dashed rgba(127,168,232,.28);transform:translate(-50%,-50%)}
.xt-ring.r1{width:420px;height:420px;animation:xtSp 60s linear infinite}.xt-ring.r2{width:290px;height:290px;animation:xtSp 40s linear infinite reverse}
@keyframes xtSp{to{transform:translate(-50%,-50%) rotate(360deg)}}
.xt-lines{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.xt-lines path{fill:none;stroke:rgba(105,182,255,.35);stroke-width:1.5;stroke-dasharray:4 6;animation:xtDa 1.2s linear infinite}
@keyframes xtDa{to{stroke-dashoffset:-20}}
/* centre server */
.xt-srv{position:absolute;left:50%;top:41%;transform:translate(-50%,-50%);width:216px;border-radius:18px;padding:16px;
 background:linear-gradient(170deg,rgba(21,101,216,.35),rgba(4,30,66,.92));border:1px solid rgba(156,200,255,.4);box-shadow:0 0 0 6px rgba(21,101,216,.12),0 24px 60px rgba(0,0,0,.45);backdrop-filter:blur(8px)}
.xt-srv:before{content:"";position:absolute;inset:-14px;border-radius:24px;border:2px solid rgba(105,182,255,.35);animation:xtPu 2.4s ease-out infinite;pointer-events:none}
@keyframes xtPu{0%{opacity:.9;transform:scale(.96)}100%{opacity:0;transform:scale(1.12)}}
.xt-srv h3{display:flex;align-items:center;gap:7px;font:700 13.5px var(--pop);color:#fff;white-space:nowrap}.xt-srv h3 svg{width:22px;height:22px;color:var(--sky)}
.xt-srv small{display:block;font:600 10.5px var(--mono);color:var(--mut);letter-spacing:.08em;margin-top:2px}
.xt-live{display:inline-flex;align-items:center;gap:5px;font:700 10px var(--mono);color:var(--ok);margin-left:auto}.xt-live:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok);animation:xtTw 1.4s infinite}
.xt-hw{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:12px}
.xt-hw div{border-radius:9px;background:rgba(255,255,255,.07);padding:7px 9px}.xt-hw b{display:block;font:700 12px var(--pop);color:#fff;white-space:nowrap}.xt-hw span{font:600 9.5px var(--mono);color:var(--mut)}
.xt-bars{display:grid;gap:5px;margin-top:10px;font:600 10px var(--mono);color:var(--mut)}
.xt-bars div{display:grid;grid-template-columns:42px 1fr 34px;gap:6px;align-items:center}
.xt-bars u{height:6px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden;text-decoration:none}.xt-bars u i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--blue),var(--sky));transition:width .8s}
.xt-bars em{font-style:normal;color:#fff;text-align:right}
/* device nodes */
.xt-dev{position:absolute;display:flex;align-items:center;gap:9px;padding:8px 12px 8px 8px;border-radius:14px;background:rgba(4,30,66,.88);border:1px solid rgba(156,200,255,.3);box-shadow:0 14px 30px rgba(0,0,0,.35);animation:xtFl 5s ease-in-out infinite;z-index:3}
.xt-dev .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:rgba(105,182,255,.15);color:var(--sky);flex:none}.xt-dev .ic svg{width:19px;height:19px}
.xt-dev b{display:block;font:700 12.5px var(--pop);color:#fff;white-space:nowrap}.xt-dev small{font:600 10px var(--mono);color:var(--mut);white-space:nowrap}
.xt-dev .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok);margin-left:4px;flex:none}
.xt-dev.flash{border-color:var(--ok);box-shadow:0 0 0 3px rgba(46,204,113,.25),0 14px 30px rgba(0,0,0,.35)}
.xt-dev{width:158px}.xt-dev>div:nth-child(2){min-width:0}.xt-dev b,.xt-dev small{display:block;overflow:hidden;text-overflow:ellipsis}
.d1{left:0;top:15%}.d2{right:0;top:21%;animation-delay:-1.2s}.d3{left:0;top:49%;animation-delay:-2.4s}.d4{right:0;top:55%;animation-delay:-3.6s}
@keyframes xtFl{50%{transform:translateY(-8px)}}
/* ledger feed */
.xt-feed{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:min(430px,96%);border-radius:14px;background:rgba(3,15,36,.92);border:1px solid rgba(156,200,255,.25);padding:10px 12px;z-index:4;box-shadow:0 18px 40px rgba(0,0,0,.4)}
.xt-feed h4{display:flex;justify-content:space-between;font:700 10.5px var(--mono);letter-spacing:.1em;color:var(--mut);margin-bottom:6px}.xt-feed h4 b{color:var(--ok)}
.xt-feed ul{list-style:none;display:grid;gap:4px;min-height:84px}
.xt-feed li{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;font:500 12px var(--mono);color:#C7D5EC;animation:xtIn .4s ease forwards;opacity:0}
.xt-feed li em{font-style:normal;padding:2px 6px;border-radius:5px;font-size:10px;font-weight:700;background:rgba(105,182,255,.15);color:var(--sky)}
.xt-feed li em.g{background:rgba(46,204,113,.15);color:var(--ok)}.xt-feed li em.o{background:rgba(255,140,26,.15);color:var(--orange)}
.xt-feed li span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.xt-feed li b{color:#fff;font-weight:600}
/* floating badges */
.xt-bdg{position:absolute;z-index:4;display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:12px;background:#fff;color:#0B1B33;font:700 12px var(--pop);box-shadow:0 14px 30px rgba(0,0,0,.35);animation:xtFl 6s ease-in-out infinite}
.xt-bdg svg{width:16px;height:16px;color:var(--blue)}.xt-bdg b{color:#16A34A}
.xt-bdg.p{left:50%;top:0;transform:translateX(-50%);animation:none;background:linear-gradient(135deg,var(--orange),#FFB45C);color:#fff}
.xt-bdg.p b{color:#fff;font:800 15px var(--disp)}
/* ---------- responsive ---------- */
@media (max-width:1240px){.xt-wrap{grid-template-columns:minmax(0,1fr)}.xt-viz{max-width:620px;width:100%;margin:10px auto 0}}
@media (max-width:440px){.xt-wrap{padding:36px 16px 44px;gap:26px}.xt-pts{grid-template-columns:minmax(0,1fr)}.xt-ctas .xt-btn{flex:1 1 calc(50% - 10px);justify-content:center}
 .xt-ctas .xt-btn.o{flex-basis:100%}.xt-ai span{flex-basis:100%}
 .xt-viz{height:auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;grid-template-areas:"b b" "d1 d2" "s s" "d3 d4" "f f"}
 .xt-lines{display:none}.xt-ring.r1{width:320px;height:320px}.xt-ring.r2{width:220px;height:220px}
 .xt-bdg.p{position:static;transform:none;grid-area:b;justify-self:center}
 .xt-srv{position:relative;left:auto;top:auto;transform:none;width:auto;grid-area:s;margin:8px 4px}
 .xt-dev{position:static;animation:none;min-width:0;width:auto}.xt-dev b{font-size:12px;white-space:normal}.xt-dev small{white-space:normal}
 .d1{grid-area:d1}.d2{grid-area:d2}.d3{grid-area:d3}.d4{grid-area:d4}
 .xt-feed{position:static;transform:none;width:auto;grid-area:f}}
@media (prefers-reduced-motion:reduce){.xt-hero *{animation:none!important;transition:none!important}.xt-pts li,.xt-feed li{opacity:1;transform:none}}

.xt-srv h3 svg{flex:none;width:14px;height:14px}.xt-srv h3{gap:4px;font-size:12px}
.is-paused *,.is-paused *::before,.is-paused *::after{animation-play-state:paused!important}
@media(max-width:440px){.xt-feed h4{flex-wrap:wrap;gap:4px}.xt-dev{gap:6px;padding-right:8px}.xt-dev .ic{width:28px;height:28px}.xt-feed li{font-size:10px}.xt-srv h3{font-size:13.5px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.xt-feed li{opacity:1;transform:none}}
</style></head><body><main><div class="xt-viz" aria-label="Illustration: GeoTrust SSL Certificates live activity">
   <div class="xt-map" aria-hidden="true"></div>

   <svg class="xt-lines" id="xtLines" aria-hidden="true"></svg>

   <div class="xt-bdg p"><span>From</span><b>₹6,999</b><span>/year</span></div>

   <div class="xt-srv" id="xtSrv">
    <h3><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>XcellSSL · GeoTrust<span class="xt-live">LIVE</span></h3>

   </div>

   <div class="xt-dev d1" data-n="0"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z"/></svg></div><div><b>Website</b><small>QuickSSL</small></div><span class="dot"></span></div><div class="xt-dev d2" data-n="1"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6"/></svg></div><div><b>Store</b><small>BusinessID</small></div><span class="dot"></span></div><div class="xt-dev d3" data-n="2"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg></div><div><b>Apps</b><small>Wildcard</small></div><span class="dot"></span></div><div class="xt-dev d4" data-n="3"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.59 13.51l6.83 3.98M15.41 6.51l-6.82 3.98"/></svg></div><div><b>Domains</b><small>SAN</small></div><span class="dot"></span></div>

   <div class="xt-feed" aria-live="off"><h4><span>LIVE CERTIFICATE ACTIVITY</span><b>● VALID · MONITORED</b></h4><ul id="xtFeed"></ul></div>
  </div></main>
<script>
(function(){
var D={"words": ["QuickSSL Premium — issued in under 10 minutes", "True BusinessID — your company name in the certificate", "Wildcard and multi-domain options", "From ₹6,999 per year"], "feed": [["Issued", "shop.example.in · QuickSSL", "7 min", "g", 0], ["Validate", "DNS TXT record verified", "✓", "g", 0], ["OV", "Company check · GST & MCA", "Done", "", 1], ["Install", "Nginx · full chain + HSTS", "✓", "g", 1], ["Wildcard", "*.portal.example.in reissued", "✓", "", 2], ["Renew", "Expiry in 30 days · reminder", "Sent", "o", -1], ["Scan", "TLS 1.3 · A+ rating", "A+", "g", 3], ["Bill", "INR invoice with GST", "GST", "o", -1]], "q": "Explain GeoTrust SSL certificates sold by XcellHost in India: QuickSSL Premium DV, True BusinessID OV and EV, wildcard and multi-domain options. Which one should an Indian business choose and how do prices compare with Sectigo and DigiCert?", "base": 1840, "bars": [62, 18]};
var $=function(i){return document.getElementById(i)},motion=matchMedia('(prefers-reduced-motion: reduce)'),RM=motion.matches;
var viz=document.querySelector(".xt-viz"),svg=$("xtLines"),srv=$("xtSrv"),devs=[].slice.call(document.querySelectorAll(".xt-dev"));
function lines(){var r=viz.getBoundingClientRect(),s=srv.getBoundingClientRect(),cx=s.left+s.width/2-r.left,cy=s.top+s.height/2-r.top,out="";
 svg.setAttribute("viewBox","0 0 "+r.width+" "+r.height);
 devs.forEach(function(d,k){var b=d.getBoundingClientRect(),x=b.left+b.width/2-r.left,y=b.top+b.height/2-r.top,mx=(x+cx)/2,my=(y+cy)/2-30;
  out+='<path id="xtP'+k+'" d="M'+x+' '+y+' Q'+mx+' '+my+' '+cx+' '+cy+'"/>'+(RM?'':'<circle r="4" fill="#69B6FF"><animateMotion dur="'+(2.2+k*.35)+'s" repeatCount="indefinite"'+(k%2?' keyPoints="1;0" keyTimes="0;1"':'')+'><mpath href="#xtP'+k+'"/></animateMotion></circle>')});
 svg.innerHTML=out}


/* live activity feed */
var F=D.feed,fi=0,feed=$("xtFeed"),U=$("xtUsers");
function jit(v,r){return Math.max(1,Math.min(99,v+Math.round((Math.random()-.5)*r)))}
function push(){var f=F[fi++%F.length],li=document.createElement("li");li.innerHTML='<em class="'+f[3]+'">'+f[0]+'</em><span>'+f[1]+'</span><b>'+f[2]+'</b>';feed.insertBefore(li,feed.firstChild);while(feed.children.length>4)feed.removeChild(feed.lastChild);
 if(!RM&&f[4]>=0&&devs[f[4]]){var d=devs[f[4]];d.classList.add("flash");setTimeout(function(){d.classList.remove("flash")},900)}
 var c=jit(D.bars[0],16),k=jit(D.bars[1],10);$("xtCpu").style.width=c+"%";$("xtCpuV").textContent=c+"%";$("xtDsk").style.width=k+"%";$("xtDskV").textContent=k+"%";
 if(U){U.textContent=Math.max(1,D.base+Math.round((Math.random()-.4)*Math.max(3,D.base*.15)))}}

for(var j=0;j<4;j++)push();
var intervalIds=[],visible=false;
function stop(){intervalIds.forEach(clearInterval);intervalIds=[];document.body.classList.add('is-paused');svg.pauseAnimations()}
function start(){stop();if(!visible||document.hidden||RM)return;document.body.classList.remove('is-paused');svg.unpauseAnimations();intervalIds=[setInterval(push,2200),setInterval(lines,5000)]}
function resize(){lines();if(!visible||document.hidden||RM)svg.pauseAnimations()}
resize();document.fonts.ready.then(resize);addEventListener('resize',resize);
var observer=new IntersectionObserver(function(entries){visible=entries[0].isIntersecting;start()});observer.observe(viz);
document.addEventListener('visibilitychange',start);
motion.addEventListener('change',function(){location.reload()});
addEventListener('pagehide',function(){stop();observer.disconnect()});
})();
</script></body></html>
