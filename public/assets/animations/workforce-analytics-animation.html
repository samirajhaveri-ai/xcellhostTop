<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Workforce Analytics — XcellHost</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:transparent;font-family:'Segoe UI',system-ui,sans-serif;overflow:hidden;min-height:100vh}.scene{position:relative;width:100vw;height:100vh;overflow:hidden}canvas#bg{position:absolute;inset:0;z-index:0}.grid{position:absolute;inset:0;background-image:radial-gradient(circle at 1px 1px,rgba(0,102,255,.05) 1px,transparent 0);background-size:28px 28px;z-index:0}.grid::after{content:'';position:absolute;inset:0;background:none}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes dash{to{stroke-dashoffset:-20}}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}@keyframes fadeIn{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
.badge{position:absolute;z-index:12;padding:4px 10px;border-radius:5px;font-size:.48rem;font-weight:700;letter-spacing:.06em;animation:pulse 3s ease-in-out infinite}.bg{background:rgba(34,197,94,.1);color:#22c55e;border:1px solid rgba(34,197,94,.15)}.bb{background:rgba(0,102,255,.1);color:#0066FF;border:1px solid rgba(0,102,255,.15)}.bo{background:rgba(255,138,0,.1);color:#FF8A00;border:1px solid rgba(255,138,0,.15)}
.lc{position:absolute;z-index:11;background:rgba(255,255,255,.03);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.07);border-radius:8px;padding:8px 12px;animation:float 5s ease-in-out infinite}.lcd{width:5px;height:5px;border-radius:50%;animation:blink 1.5s ease-in-out infinite;display:inline-block;margin-right:4px}.lct{color:rgba(255,255,255,.5);font-size:.48rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase}.lcv{color:#fff;font-size:.78rem;font-weight:700;margin-top:2px}.lcs{color:rgba(255,255,255,.28);font-size:.44rem;margin-top:1px}
.dash{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:10;display:grid;grid-template-columns:1fr 1fr 1fr;grid-template-rows:auto auto;gap:10px;width:750px}
.widget{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:10px;padding:14px;backdrop-filter:blur(8px);animation:fadeIn .5s ease-out both}
.w-span2{grid-column:span 2}
.w-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.w-title{color:rgba(255,255,255,.5);font-size:.5rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.w-val{color:#fff;font-size:1.1rem;font-weight:800}.w-sub{color:rgba(255,255,255,.3);font-size:.44rem;margin-top:2px}
.w-bar{height:3px;background:rgba(255,255,255,.05);border-radius:3px;margin-top:8px;overflow:hidden}.w-fill{height:100%;border-radius:3px;animation:barGrow 4s ease-in-out infinite}@keyframes barGrow{0%,100%{width:30%}50%{width:90%}}
.w-chart{display:flex;align-items:flex-end;gap:4px;height:40px;margin-top:8px}.w-col{width:12px;border-radius:3px 3px 0 0;animation:colPulse 3s ease-in-out infinite}@keyframes colPulse{0%,100%{height:30%}50%{height:95%}}
.title-bar{position:absolute;top:4%;left:50%;transform:translateX(-50%);z-index:15;text-align:center}
.tb-l{color:#fff;font-size:1.2rem;font-weight:800}.tb-s{color:rgba(255,255,255,.35);font-size:.55rem}
.w-ring{width:50px;height:50px;border-radius:50%;border:4px solid rgba(255,255,255,.06);border-top-color:#0066FF;display:flex;align-items:center;justify-content:center;color:#fff;font-size:.65rem;font-weight:800;animation:spin 3s linear infinite}
.scene{position:absolute;width:790px;height:460px;top:50%;left:50%;transform-origin:center}
.badge.bg{left:8%!important}.badge.bo{right:8%!important}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}}
</style></head><body><div class="scene"><canvas id="bg"></canvas><div class="grid"></div><div class="title-bar"><div class="tb-l">Workforce Analytics</div><div class="tb-s">Employee Productivity & Insights Dashboard</div></div>
<div class="dash">
<div class="widget" style="animation-delay:.1s"><div class="w-head"><div class="w-title">Productivity</div></div><div style="display:flex;align-items:center;gap:12px"><div class="w-ring">87%</div><div><div class="w-val">87.2%</div><div class="w-sub">Top: Engineering 94.1%</div></div></div></div>
<div class="widget" style="animation-delay:.2s"><div class="w-head"><div class="w-title">Active Users</div></div><div class="w-val">128 / 142</div><div class="w-sub">Idle: 8 | Away: 6</div><div class="w-bar"><div class="w-fill" style="background:#0066FF;width:90%"></div></div></div>
<div class="widget" style="animation-delay:.3s"><div class="w-head"><div class="w-title">Focus Time</div></div><div class="w-val">4.2 hrs</div><div class="w-sub">Avg per user today</div><div class="w-bar"><div class="w-fill" style="background:#22c55e"></div></div></div>
<div class="widget w-span2" style="animation-delay:.4s"><div class="w-head"><div class="w-title">Hourly Activity</div></div><div class="w-chart"><div class="w-col" style="background:rgba(0,102,255,.2);animation-delay:0s"></div><div class="w-col" style="background:rgba(0,102,255,.3);animation-delay:.15s"></div><div class="w-col" style="background:rgba(0,102,255,.5);animation-delay:.3s"></div><div class="w-col" style="background:rgba(0,102,255,.7);animation-delay:.45s"></div><div class="w-col" style="background:rgba(0,102,255,.9);animation-delay:.6s"></div><div class="w-col" style="background:rgba(0,102,255,.8);animation-delay:.75s"></div><div class="w-col" style="background:rgba(0,102,255,.6);animation-delay:.9s"></div><div class="w-col" style="background:rgba(0,102,255,.4);animation-delay:1.05s"></div><div class="w-col" style="background:rgba(0,102,255,.3);animation-delay:1.2s"></div></div></div>
<div class="widget" style="animation-delay:.5s"><div class="w-head"><div class="w-title">Top Apps</div></div><div class="w-val">Teams, Excel</div><div class="w-sub">Switches: 12.4/hr</div><div class="w-bar"><div class="w-fill" style="background:#FF8A00"></div></div></div>
</div>
<div class="badge bg" style="bottom:5%;left:25%">● TRACKING</div><div class="badge bb" style="bottom:5%;left:50%;transform:translateX(-50%)">● DPDPA PRIVACY MODE</div><div class="badge bo" style="bottom:5%;right:25%">● REAL-TIME</div></div><script>const cv=document.getElementById('bg'),cx=cv.getContext('2d');let W,H;function rsz(){W=cv.width=790;H=cv.height=460;document.querySelector('.scene').style.transform='translate(-50%,-50%) scale('+Math.min(innerWidth/790,innerHeight/460)+')'}rsz();addEventListener('resize',rsz);const pts=Array.from({length:35},()=>({x:Math.random()*2000,y:Math.random()*1200,r:Math.random()*1.1+.3,a:Math.random(),s:Math.random()*.004+.002,d:Math.random()>.5?1:-1}));(function draw(){cx.clearRect(0,0,W,H);pts.forEach(p=>{p.a+=p.s*p.d;if(p.a>=1||p.a<=.08)p.d*=-1;cx.beginPath();cx.arc(p.x,p.y,p.r,0,6.28);cx.fillStyle=`rgba(0,102,255,${p.a.toFixed(2)})`;cx.fill()});for(let i=0;i<pts.length;i++)for(let j=i+1;j<pts.length;j++){const dx=pts[i].x-pts[j].x,dy=pts[i].y-pts[j].y,d=Math.sqrt(dx*dx+dy*dy);if(d<80){cx.beginPath();cx.moveTo(pts[i].x,pts[i].y);cx.lineTo(pts[j].x,pts[j].y);cx.strokeStyle=`rgba(0,102,255,${(.02*(1-d/80)).toFixed(3)})`;cx.lineWidth=.3;cx.stroke()}}if(!matchMedia('(prefers-reduced-motion: reduce)').matches)requestAnimationFrame(draw)})();</script></body></html>
