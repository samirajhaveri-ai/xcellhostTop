}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:var(--f-body);color:var(--text);background:var(--bg);line-height:1.6;overflow-x:hidden;overflow-x:clip;-webkit-font-smoothing:antialiased;transition:background .35s,color .35s}

h1,h2,h3,h4{font-family:var(--f-disp);color:var(--ink);line-height:1.15;letter-spacing:-.02em;font-weight:700}
a{color:inherit;text-decoration:none}img,svg{display:block}button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}

:focus-visible{outline:2px solid var(--blue);outline-offset:3px;border-radius:6px}

:root{
  --blue:#1565D8;--blue-d:#0C3E8F;--navy:#041E42;--navy-2:#0A2A57;--orange:#FF8C1A;--orange-d:#F57C00;--red:#FF3B3B;

  --sh-s:0 6px 18px rgba(4,30,66,.06);--sh:0 18px 50px rgba(4,30,66,.10);--sh-l:0 34px 80px -20px rgba(4,30,66,.34);

}
html[data-theme="dark"]{--bg:#06122A;--surface:#0B1A38;--surface-2:#081630;--ink:#EAF1FF;--text:#C9D6EE;--muted:#93A4C4;--line:#1B2D52;--line-2:#243A66;--chip:#10244A}
body{font-size:15px}
h1,h2,h3,h4{color:var(--ink)}
#xhProgress{background:linear-gradient(90deg,#1565D8,#FF8C1A);box-shadow:0 0 12px rgba(21,101,216,.6)}


.lh-powered{position:absolute;left:4%;bottom:-8px;z-index:6;background:#0A1A3A;border:1px solid rgba(255,255,255,.18);border-radius:10px;padding:8px 14px 9px;box-shadow:0 14px 30px -12px rgba(0,0,0,.7)}
.lh-powered small{display:block;font-family:var(--f-mono);font-size:8.5px;letter-spacing:.16em;color:#9fb6de;text-transform:uppercase;margin-bottom:4px}
.lh-powered>span{display:flex;align-items:center;gap:8px;font-family:var(--f-disp);font-weight:700;font-size:16px;color:#fff}

.lh-orbit{position:absolute;left:50%;top:50%;width:560px;height:560px;margin:-280px 0 0 -280px;border-radius:50%;border:1px dashed rgba(127,176,255,.22);pointer-events:none;animation:lhSpin 60s linear infinite}
.lh-orbit.o2{width:440px;height:440px;margin:-220px 0 0 -220px;border-style:solid;border-color:rgba(255,140,26,.14);animation-duration:38s;animation-direction:reverse}
.lh-orbit:before,.lh-orbit:after{content:"";position:absolute;width:10px;height:10px;border-radius:50%;background:#7fb0ff;box-shadow:0 0 14px 4px rgba(127,176,255,.6);top:-5px;left:50%}
.lh-orbit:after{top:auto;bottom:-5px;background:#FF8C1A;box-shadow:0 0 14px 4px rgba(255,140,26,.55)}
.lh-orbit.o2:before{background:#5FE08D;box-shadow:0 0 12px 3px rgba(95,224,141,.5)}
@keyframes lhSpin{to{transform:rotate(360deg)}}
.lh-chip{position:absolute;z-index:5;display:flex;align-items:center;gap:8px;background:rgba(10,26,58,.88);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(8px);color:#fff;border-radius:12px;padding:8px 12px;font:600 12px var(--f-disp);box-shadow:0 16px 30px -14px rgba(0,0,0,.7);animation:lhFloat 6s ease-in-out infinite}
.lh-chip i{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;background:#1565D8}
.lh-chip i svg{width:13px;height:13px}
.lh-chip small{display:block;font:500 10px var(--f-mono);color:#9fb6de}
.lh-chip.c2{animation-delay:-3s}.lh-chip.c2 i{background:#FF8C1A}
@keyframes lhFloat{50%{transform:translateY(-10px)}}

.kdt{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:6px;background:#1565D8;color:#fff;font:800 12px/1 var(--f-disp);box-shadow:inset 0 0 0 1px rgba(255,255,255,.2);flex-shrink:0}
/* ---- hero background: drifting privacy glyphs ---- */
.vdb{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.vdb span{position:absolute;bottom:-40px;width:26px;height:26px;color:rgba(127,176,255,.28);animation:vdRise 26s linear infinite}
.vdb span svg{width:100%;height:100%}
@keyframes vdRise{0%{transform:translateY(0) rotate(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateY(-760px) rotate(25deg);opacity:0}}
/* ---- hero visual: privacy desk ---- */
.pvo{text-align:left;width:min(470px,100%);background:#fff;border-radius:18px;box-shadow:0 30px 60px -20px rgba(0,0,0,.6);overflow:hidden;color:#0B132B;font-family:var(--f-body)}
html[data-theme="dark"] .pvo{background:#0E1630;color:#F2F5FB}
.pvo-h{display:flex;justify-content:space-between;align-items:center;padding:13px 16px;border-bottom:1px solid var(--line)}
.pvo-h b{display:flex;align-items:center;gap:9px;font:700 14.5px var(--f-disp)}.pvo-h b i{width:28px;height:28px;border-radius:8px;background:#0B132B;color:#fff;display:grid;place-items:center}.pvo-h b i svg{width:15px;height:15px}
.pvo-live{font:600 11px var(--f-mono);color:#16a34a;display:flex;align-items:center;gap:6px}.pvo-live:before{content:"";width:7px;height:7px;border-radius:50%;background:#16a34a;animation:vdPulse 1.6s infinite}
@keyframes vdPulse{50%{opacity:.3}}
.pvo-k{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--line)}
.pvo-k div{padding:10px 12px;display:grid;gap:1px}.pvo-k div+div{border-left:1px solid var(--line)}
.pvo-k small{font:600 9.5px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}.pvo-k b{font:800 19px var(--f-disp)}
.pvo-q{padding:10px 12px;display:grid;gap:7px;min-height:196px;align-content:start;background:var(--surface-2)}
.pvq{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:8px 10px;font-size:12.5px;animation:vdIn .45s var(--ease-o)}
@keyframes vdIn{from{opacity:0;transform:translateY(-8px)}}
.pvq .ty{font:700 9.5px var(--f-mono);letter-spacing:.06em;padding:3px 7px;border-radius:6px;color:#fff}
.pvq .tx b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pvq .tx{min-width:0}
.pvq .sl{display:block;height:4px;border-radius:9px;background:var(--line);margin-top:5px;overflow:hidden}.pvq .sl i{display:block;height:100%;background:#FF8A00;transition:width .8s linear}
.pvq em{font:600 10.5px var(--f-mono);font-style:normal;color:var(--muted);white-space:nowrap}
.pvq.done{border-color:#bbf7d0}.pvq.done .sl i{background:#16a34a}.pvq.done em{color:#16a34a}
.pvo-br{display:flex;align-items:center;gap:12px;padding:11px 14px;background:#FFF7ED;border-top:1px solid #FED7AA}
html[data-theme="dark"] .pvo-br{background:#2a1a08;border-color:#5b3a12}
.pvo-br svg{width:42px;height:42px;flex-shrink:0}.pvo-br .bg{stroke:#FED7AA}.pvo-br .fg{stroke:#FF8A00;transition:stroke-dashoffset 1s linear}
.pvo-br span{flex:1;min-width:0}.pvo-br b{display:block;font:700 12.5px var(--f-disp);color:#9A3412}.pvo-br small{font:600 11px var(--f-mono);color:#C2410C}
html[data-theme="dark"] .pvo-br b{color:#fdba74}
.pvo-br em{font:700 10px var(--f-mono);font-style:normal;text-transform:uppercase;letter-spacing:.08em;color:#16a34a;background:#dcfce7;border-radius:6px;padding:4px 8px}

.flash{animation:flash .5s var(--ease-o)}
@keyframes flash{0%{opacity:.35;transform:translateY(-4px)}}


html,body{background:transparent;overflow:hidden}
main.hero{position:relative;isolation:isolate;padding:58px 28px 30px}
.hero-bg{position:absolute;inset:0;pointer-events:none;z-index:-1}
.lh-net{position:absolute;inset:0;width:100%;height:100%;opacity:.9}

  .lh-orbit.o2{width:85%}
  .pvo-h{padding:12px 10px;gap:6px}
  .pvo-h b{font-size:12px;gap:6px}
  .pvo-live{font-size:9px;white-space:nowrap}
  .pvo-k div{padding:10px 8px}
  .pvo-k small{font-size:8px}
  .pvq{gap:6px;padding:8px 7px;grid-template-columns:auto minmax(0,1fr);font-size:12px}
  .pvq em{grid-column:2;font-size:9px}
  .pvq .tx b{white-space:normal;overflow:visible}
  .pvo-br{gap:8px;padding:11px 10px;flex-wrap:wrap}
  .pvo-br b{font-size:11px}
  .pvo-br small{font-size:10px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
