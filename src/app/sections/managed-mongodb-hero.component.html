<div class="clu" [class.paused]="paused()" aria-label="Illustrative MongoDB replica set and sample shell output">
  <div class="clu-h"><span>mongo-rs0 · MUMBAI</span><b>● HEALTHY</b></div>
  <svg viewBox="0 0 440 190" role="img" aria-label="MongoDB primary replicates to two secondaries, with a router representing the application endpoint">
    <path class="ln" id="mongo-oplog-1" d="M150 60 H290" />
    <path class="ln" id="mongo-oplog-2" d="M95 85 V130 H150" />
    <path class="ln" id="mongo-oplog-3" d="M95 85 V130 H150 M200 130 H290" />
    <g class="nd pri" transform="translate(40,35)"><rect width="110" height="50" rx="10" /><text x="12" y="22">Primary</text><text class="t2" x="12" y="38">read / write</text></g>
    <g class="nd" transform="translate(290,35)"><rect width="110" height="50" rx="10" /><text x="12" y="22">Secondary 1</text><text class="t2" x="12" y="38">replicating</text></g>
    <g class="nd" transform="translate(150,110)"><rect width="100" height="44" rx="10" /><text x="12" y="20">Secondary 2</text><text class="t2" x="12" y="35">oplog · sync</text></g>
    <g class="nd" transform="translate(290,110)"><rect width="110" height="44" rx="10" /><text x="12" y="20">Router</text><text class="t2" x="12" y="35">app endpoint</text></g>
    @if (!paused()) {
      <circle class="dot" r="4"><animateMotion dur="1.6s" repeatCount="indefinite"><mpath href="#mongo-oplog-1" /></animateMotion></circle>
      <circle class="dot" r="4"><animateMotion dur="2.2s" repeatCount="indefinite"><mpath href="#mongo-oplog-2" /></animateMotion></circle>
      <circle class="dot" r="4"><animateMotion dur="2.8s" repeatCount="indefinite"><mpath href="#mongo-oplog-3" /></animateMotion></circle>
    }
    <text x="175" y="52" class="diagram-note">oplog</text>
    <text x="40" y="180" class="diagram-note">replication lag: 0.4 ms · last backup 12 min ago</text>
  </svg>
  <div class="term" aria-hidden="true">
    @for (row of terminalRows(); track $index) {
      <div [class]="row[0]">{{ row[1] }}@if ($last && !paused()) {<span class="c"></span>}</div>
    }
  </div>
</div>
