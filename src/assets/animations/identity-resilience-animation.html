<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Identity resilience graph</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; }
    body { position: relative; color: #fff; font-family: Arial, sans-serif; }
    canvas { display: block; width: 100%; height: 100%; }
    .tags { position: absolute; left: 8px; right: 8px; bottom: 6px; display: flex; justify-content: space-between; gap: 8px; font: 600 11px/1.2 ui-monospace, monospace; letter-spacing: .06em; white-space: nowrap; }
    .tags span { padding: 5px 11px; border: 1px solid rgba(127,178,255,.3); border-radius: 99px; background: rgba(8,31,68,.64); }
    .tags .live::before { content: ""; display: inline-block; width: 7px; height: 7px; margin-right: 6px; border-radius: 50%; background: #2ecc71; vertical-align: 1px; animation: blink 1.4s infinite; }
    @keyframes blink { 50% { opacity: .3; } }
    @media (max-width: 450px) { .tags { font-size: 9px; } .tags span { padding: 4px 7px; } }
    @media (prefers-reduced-motion: reduce) { .tags .live::before { animation: none; } }
  </style>
</head>
<body>
  <canvas id="graph" aria-hidden="true"></canvas>
  <div class="tags"><span>IDENTITY PROTECTION</span><span class="live">Managed from India</span></div>
  <script>
    (() => {
      const canvas = document.getElementById('graph');
      const context = canvas.getContext('2d');
      const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
      const pixelRatio = Math.min(devicePixelRatio || 1, 2);
      let width = 0;
      let height = 0;
      let nodes = [];
      let edges = [];
      let phase = 2;
      let progress = .58;
      let frame = 0;

      function resize() {
        const bounds = canvas.getBoundingClientRect();
        width = bounds.width;
        height = bounds.height;
        canvas.width = Math.round(width * pixelRatio);
        canvas.height = Math.round(height * pixelRatio);
        context.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
        const centerX = width * .5;
        const centerY = height * .5;
        const radius = Math.min(width, height) * .33;
        nodes = [{ x: centerX, y: centerY, r: 15, state: 0, identityProvider: true }];
        edges = [];
        for (let i = 0; i < 7; i++) {
          const angle = i / 7 * Math.PI * 2 - 1.2;
          nodes.push({ x: centerX + Math.cos(angle) * radius * .6, y: centerY + Math.sin(angle) * radius * .6, r: 9, state: i % 3 === 0 ? 2 : 0 });
          edges.push([0, nodes.length - 1]);
        }
        for (let i = 0; i < 10; i++) {
          const angle = i / 10 * Math.PI * 2;
          const parent = 1 + Math.floor(Math.random() * 7);
          nodes.push({ x: centerX + Math.cos(angle) * radius, y: centerY + Math.sin(angle) * radius, r: 6.5, state: i % 4 === 0 ? 2 : 0 });
          edges.push([parent, nodes.length - 1]);
        }
        draw(0);
      }

      function draw(time) {
        context.clearRect(0, 0, width, height);
        for (const [from, to] of edges) {
          const a = nodes[from];
          const b = nodes[to];
          const compromised = a.state === 1 || b.state === 1;
          context.strokeStyle = compromised ? 'rgba(229,72,77,.6)' : b.state === 2 ? 'rgba(46,204,113,.5)' : 'rgba(127,178,255,.25)';
          context.lineWidth = compromised ? 1.6 : 1;
          context.beginPath();
          context.moveTo(a.x, a.y);
          context.lineTo(b.x, b.y);
          context.stroke();
        }
        for (const node of nodes) {
          const color = node.state === 1 ? '#e5484d' : node.state === 2 ? '#2ecc71' : node.identityProvider ? '#1565d8' : 'rgba(140,175,255,.9)';
          context.fillStyle = node.identityProvider ? '#1565d8' : '#0b1a33';
          context.strokeStyle = color;
          context.lineWidth = node.identityProvider ? 3 : 2;
          context.beginPath();
          context.arc(node.x, node.y, node.r + (node.state === 1 ? 2 * Math.sin(time * 8) : 0), 0, Math.PI * 2);
          context.fill();
          context.stroke();
          if (node.identityProvider) {
            context.fillStyle = '#fff';
            context.font = '700 8px ui-monospace, monospace';
            context.textAlign = 'center';
            context.fillText('IdP', node.x, node.y + 4);
            context.textAlign = 'left';
          }
        }
        const label = phase === 1 ? 'COMPROMISE SPREADING' : phase === 2 ? 'IDENTITY-AWARE ROLLBACK' : 'HEALTHY IDENTITY GRAPH';
        context.fillStyle = phase === 1 ? '#e5484d' : phase === 2 ? '#2ecc71' : 'rgba(255,255,255,.78)';
        context.font = `${width < 450 ? 9 : 11}px ui-monospace, monospace`;
        context.fillText(label, 14, 22);
        context.fillStyle = 'rgba(255,255,255,.6)';
        context.font = `${width < 450 ? 8 : 10}px ui-monospace, monospace`;
        context.textAlign = 'right';
        context.fillText('ENTRA ID · AD · OKTA', width - 14, 22);
        context.textAlign = 'left';
        const lineX = width * .12;
        const lineWidth = width * .76;
        context.fillStyle = 'rgba(255,255,255,.1)';
        context.fillRect(lineX, height * .92, lineWidth, 4);
        context.fillStyle = phase === 2 ? '#2ecc71' : phase === 1 ? '#e5484d' : '#1565d8';
        context.fillRect(lineX, height * .92, lineWidth * progress, 4);
      }

      function tick(timestamp) {
        progress += .01;
        if (progress > 1) {
          progress = 0;
          phase = (phase + 1) % 3;
          for (const node of nodes) {
            if (phase === 1 && !node.identityProvider && Math.random() < .45) node.state = 1;
            if (phase === 2 && node.state === 1) node.state = 2;
            if (phase === 0) node.state = 0;
          }
        }
        draw(timestamp / 1000);
        frame = requestAnimationFrame(tick);
      }

      const observer = new ResizeObserver(resize);
      observer.observe(canvas);
      resize();
      if (!reducedMotion) frame = requestAnimationFrame(tick);
      addEventListener('pagehide', () => { cancelAnimationFrame(frame); observer.disconnect(); }, { once: true });
    })();
  </script>
</body>
</html>
