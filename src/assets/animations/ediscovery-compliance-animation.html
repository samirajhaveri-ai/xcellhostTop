<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>eDiscovery and compliance search animation</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; }
    body { position: relative; color: #fff; font-family: Arial, sans-serif; }
    canvas { display: block; width: 100%; height: 100%; }
    .tags { position: absolute; left: 8px; right: 8px; bottom: 6px; display: flex; justify-content: space-between; gap: 8px; font: 600 11px/1.2 ui-monospace, monospace; letter-spacing: .06em; white-space: nowrap; }
    .tags span { padding: 5px 11px; border: 1px solid rgba(127,178,255,.3); border-radius: 99px; background: rgba(8,31,68,.64); }
    .tags .live::before { content: ""; display: inline-block; width: 7px; height: 7px; margin-right: 6px; border-radius: 50%; background: #2ecc71; vertical-align: 1px; animation: blink 1.4s infinite; }
    @keyframes blink { 50% { opacity: .3; } }
    @media (max-width: 450px) { .tags { font-size: 9px; } .tags span { padding: 4px 7px; } }
    @media (prefers-reduced-motion: reduce) { .tags .live::before { animation: none; } }
  </style>
</head>
<body>
  <canvas id="graph" aria-hidden="true"></canvas>
  <div class="tags"><span>LEGAL &amp; COMPLIANCE</span><span class="live">Managed from India</span></div>
  <script>
    (() => {
      const canvas = document.getElementById('graph');
      const context = canvas.getContext('2d');
      const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
      const pixelRatio = Math.min(devicePixelRatio || 1, 2);
      const documents = [];
      let width = 0;
      let height = 0;
      let held = 0;
      let lastAdded = 0;
      let frame = 0;

      function resize() {
        const bounds = canvas.getBoundingClientRect();
        width = bounds.width;
        height = bounds.height;
        canvas.width = Math.round(width * pixelRatio);
        canvas.height = Math.round(height * pixelRatio);
        context.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
        documents.length = 0;
        held = 0;
        draw(0);
      }

      function draw(time) {
        context.clearRect(0, 0, width, height);
        const centerX = width * .5;
        const centerY = height * .52;
        const funnelWidth = width * .3;
        if (time - lastAdded > .18) {
          lastAdded = time;
          documents.push({ x: width * .12 + Math.random() * width * .76, y: -20, matches: Math.random() < .32, speed: 40 + Math.random() * 40, counted: false });
        }

        context.strokeStyle = 'rgba(127,178,255,.6)';
        context.lineWidth = 2;
        context.beginPath();
        context.moveTo(centerX - funnelWidth / 2, centerY - 26);
        context.lineTo(centerX + funnelWidth / 2, centerY - 26);
        context.lineTo(centerX + 16, centerY + 16);
        context.lineTo(centerX - 16, centerY + 16);
        context.closePath();
        context.stroke();
        context.fillStyle = 'rgba(21,101,216,.14)';
        context.fill();
        context.fillStyle = 'rgba(255,255,255,.8)';
        context.font = `600 ${width < 450 ? 8 : 9.5}px ui-monospace, monospace`;
        context.textAlign = 'center';
        context.fillText('QUERY: "contract" AND 2026', centerX, centerY - 34);
        context.textAlign = 'left';

        for (let i = documents.length - 1; i >= 0; i--) {
          const document = documents[i];
          document.y += document.speed / 60;
          if (document.y > centerY - 26 && document.y < centerY + 16) {
            document.x += ((document.matches ? centerX : document.x + (document.x < centerX ? -90 : 90)) - document.x) * .12 * (document.matches ? 1 : .35);
          }
          if (document.y > height + 30) { documents.splice(i, 1); continue; }
          if (document.matches && document.y > height * .8 && !document.counted) { document.counted = true; held++; }
          context.fillStyle = document.matches ? '#ff8c1a' : 'rgba(140,175,255,.55)';
          context.globalAlpha = document.matches ? 1 : Math.max(.15, 1 - Math.max(0, document.y - centerY) / (height * .4));
          context.fillRect(document.x - 6, document.y - 8, 12, 16);
          context.strokeStyle = 'rgba(255,255,255,.5)';
          context.lineWidth = .8;
          context.beginPath();
          context.moveTo(document.x - 3, document.y - 4);
          context.lineTo(document.x + 3, document.y - 4);
          context.moveTo(document.x - 3, document.y);
          context.lineTo(document.x + 3, document.y);
          context.stroke();
          context.globalAlpha = 1;
        }

        const holdX = centerX - width * .12;
        const holdY = height * .83;
        const holdWidth = width * .24;
        const holdHeight = height * .11;
        context.strokeStyle = '#ff8c1a';
        context.lineWidth = 2;
        context.strokeRect(holdX, holdY, holdWidth, holdHeight);
        context.fillStyle = 'rgba(255,140,26,.14)';
        context.fillRect(holdX, holdY, holdWidth, holdHeight);
        context.fillStyle = '#ff8c1a';
        context.font = `700 ${width < 450 ? 8 : 11}px ui-monospace, monospace`;
        context.textAlign = 'center';
        context.fillText(`LEGAL HOLD · ${held} ITEMS`, centerX, holdY + holdHeight / 2 + 4);
        context.textAlign = 'left';
        context.fillStyle = 'rgba(255,255,255,.78)';
        context.font = `600 ${width < 450 ? 8 : 11}px ui-monospace, monospace`;
        context.fillText('FEDERATED SEARCH · BACKUP DATA', 14, 22);
      }

      function tick(timestamp) {
        draw(timestamp / 1000);
        frame = requestAnimationFrame(tick);
      }

      const observer = new ResizeObserver(resize);
      observer.observe(canvas);
      resize();
      if (!reducedMotion) frame = requestAnimationFrame(tick);
      addEventListener('pagehide', () => { cancelAnimationFrame(frame); observer.disconnect(); }, { once: true });
    })();
  </script>
</body>
</html>
