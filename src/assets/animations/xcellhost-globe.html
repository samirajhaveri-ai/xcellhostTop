<title>XcellHost Global Infrastructure</title>
<base target="_parent">

<style>
:root{--ink:#0B1B33;--slate:#5B6B82;--line:#E6EAF0;--bg:#F7F8FA;--card:#fff;--navy:#041E42;--acc:#FF8C1A;--blue:#1565D8}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"DM Sans",system-ui,sans-serif;background:#F5F5F5;color:var(--ink);overflow-x:hidden}
.gx{max-width:1380px;margin:0 auto;padding:40px 32px}
.gx-h{text-align:center;margin-bottom:28px}
.gx-h small{font:700 12px "IBM Plex Mono",monospace;letter-spacing:.14em;color:var(--blue)}
.gx-h h2{font:700 clamp(28px,4vw,42px)/1.15 "DM Sans";margin:8px 0}.gx-h h2 em{font-style:normal;background:linear-gradient(90deg,#1565D8,#7C3AED);-webkit-background-clip:text;background-clip:text;color:transparent}
.gx-h p{color:var(--slate);font-size:16px;max-width:925px;margin:0 auto}
.gx-b{display:grid;grid-template-columns:minmax(0,.95fr) minmax(520px,1.08fr);gap:64px;align-items:center}
.gw{position:relative;width:100%;max-width:560px;aspect-ratio:1;margin:0 auto;touch-action:pan-y;cursor:grab}.gw:active{cursor:grabbing}
.gw canvas{width:100%;height:100%;display:block}
.tip{position:absolute;pointer-events:none;transform:translate(-50%,-150%);background:rgba(4,30,66,.92);color:#fff;font:600 12px "IBM Plex Mono",monospace;padding:6px 9px;border-radius:6px;white-space:nowrap;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.hint{display:none}
.gx-panel{min-height:568px;padding:24px;border:1px solid #E1E1E1;border-radius:14px;background:#fff;box-shadow:0 1px 2px rgba(15,23,42,.02)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.tabs button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:10px 16px;font:600 14px "IBM Plex Mono",monospace;color:var(--ink);cursor:pointer;white-space:nowrap}
.tabs button[aria-selected=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.rs{font-size:15px;color:var(--ink);margin-bottom:12px}
.tags{display:flex;gap:6px;flex-wrap:wrap;padding-bottom:18px;border-bottom:1px solid var(--line);margin-bottom:6px}
.tags span{font:600 11px "IBM Plex Mono",monospace;letter-spacing:.06em;padding:6px 9px;border:1px solid var(--line);border-radius:4px;background:#F1F3F6;color:#334155}
.cn{padding:14px 0;border-bottom:1px solid var(--line)}
.cn h5{display:flex;align-items:center;justify-content:space-between;gap:10px;font:600 12.5px "IBM Plex Mono",monospace;letter-spacing:.06em;color:#334155;margin-bottom:6px}
.cn h5 span{display:flex;align-items:center;gap:8px}.cn h5 canvas{width:20px;height:14px;border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,.08)}
.cn h5 a{font:700 12px "IBM Plex Mono",monospace;color:var(--ink);text-decoration:none;white-space:nowrap}.cn h5 a:hover{color:var(--blue)}
.ct{display:flex;align-items:center;justify-content:space-between;width:100%;border:0;background:transparent;padding:9px 6px 9px 12px;border-radius:8px;cursor:pointer;font:500 15px "DM Sans";color:var(--ink);text-align:left;position:relative}
.ct::before{content:"";position:absolute;left:0;top:50%;width:5px;height:5px;border-radius:50%;background:#94A3B8;transform:translateY(-50%)}
.ct small{font:600 11.5px "IBM Plex Mono",monospace;color:#8A6D3B}
.ct:hover{background:#F1F5F9}.ct.on{background:#FFF4E8}.ct.on::before{background:var(--acc)}.ct.on small{color:var(--acc)}
.legend{display:none}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
@media (max-width:900px){.gx-b{grid-template-columns:minmax(0,1fr);gap:28px}.gx{padding:32px 16px}.gx-panel{min-height:0;padding:18px}.tabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}}
</style>
</head>
